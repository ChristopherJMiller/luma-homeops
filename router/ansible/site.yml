---
# VyOS Main Configuration Playbook
# Orchestrates complete VyOS router configuration
  - name: Deploy complete VyOS configuration
    hosts: vyos_routers
    gather_facts: true
    connection: ansible.netcommon.network_cli
    serial: 1 # Configure one router at a time to avoid conflicts
    pre_tasks:
      - name: Get timestamp on localhost
        setup:
          gather_subset: min
        delegate_to: localhost
        run_once: true
        tags: [always, backup]

      - name: Verify connectivity to VyOS router
        vyos.vyos.vyos_command:
          commands:
            - show version
        register: vyos_version
        tags: [always, verify]

      - name: Display VyOS version
        debug:
          msg: "Connected to VyOS {{ vyos_version.stdout[0].split()[2] }}"
        tags: [always, verify]

      - name: Create configuration backup
        vyos.vyos.vyos_command:
          commands:
            - show configuration commands
        register: current_config
        tags: [always, backup]

      - name: Save current configuration locally
        copy:
          content: "{{ current_config.stdout[0] }}"
          dest: "./backups/vyos-config-backup-{{ ansible_date_time.epoch | default(ansible_play_batch | random) }}.txt"
        delegate_to: localhost
        tags: [always, backup]

    tasks:
      # Parachute (see playbooks/commit-confirm-arm.yml). Tagged `always`:
      # every run that can change the router is wrapped, whatever
      # --tags/--skip-tags say. Select work by playbook tag (system,
      # network, firewall, nat, services, monitoring); inner task tags such
      # as `voice` or `dhcp` match nothing on their own, because the
      # includes are dynamic.
      - name: Arm commit-confirm parachute
        include_tasks: playbooks/commit-confirm-arm.yml
        tags: [always]

      - name: Include system configuration
        include_tasks: playbooks/system.yml
        tags: [system]

      - name: Include network configuration
        include_tasks: playbooks/network.yml
        tags: [network]

      - name: Include firewall configuration
        include_tasks: playbooks/firewall.yml
        tags: [firewall]

      - name: Include NAT configuration
        include_tasks: playbooks/nat.yml
        tags: [nat]

      - name: Include services configuration
        include_tasks: playbooks/services.yml
        tags: [services]

      - name: Include monitoring configuration
        include_tasks: playbooks/monitoring.yml
        tags: [monitoring]

      - name: Verify and confirm (cancels the parachute)
        include_tasks: playbooks/commit-confirm-verify.yml
        tags: [always]

      # The save is what makes a change survive the rollback reboot, so it
      # must never run while the timer is still pending (for example if a
      # failed verify was skipped past).
      - name: Refuse to save while a rollback is pending
        vyos.vyos.vyos_command:
          commands:
            - systemctl is-active commit-confirm.timer || true
        register: commit_confirm_pending
        when: not ansible_check_mode
        changed_when: false
        failed_when: commit_confirm_pending.stdout[-1].strip() == 'active'
        tags: [always, commit]

      - name: Commit and save all changes
        vyos.vyos.vyos_config:
          save: true
          comment: "Ansible automated configuration deployment"
        tags: [always, commit]

    post_tasks:
      - name: Verify configuration integrity
        vyos.vyos.vyos_command:
          commands:
            - show configuration
            - show interfaces
            - show firewall
            - show nat
        register: config_verification
        tags: [always, verify]

      - name: Display configuration summary
        debug:
          msg:
            - "Configuration deployment completed successfully"
            - "Router: {{ inventory_hostname }}"
            - "Timestamp: {{ ansible_date_time.iso8601 }}"
            - "Backup saved to: ./backups/vyos-config-backup-{{ ansible_date_time.epoch }}.txt"
        tags: [always, verify]
