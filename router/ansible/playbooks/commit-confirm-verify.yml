---
# Commit-confirm parachute, part 2 of 2 (part 1: commit-confirm-arm.yml).
#
# Two post-apply checks from the control node (on the LAN), both before the
# timer is cancelled:
#
# 1. Each URL in commit_confirm_verify_urls must return a status < 500. The
#    apex hostnames are Cloudflare-proxied, so a request leaves via the WAN
#    and comes back in through the port-forwards. A pass proves LAN→WAN
#    forwarding and WAN→Traefik NAT. A DNS-only name would take NAT
#    reflection and prove nothing.
# 2. A brand-new SSH login must succeed. Ansible's own session is
#    persistent and already established, so it survives a change that
#    blocks *new* connections (firewall, sshd listen address, keys). Only a
#    fresh connection proves we can still get back in.
  - name: Verify LAN egress and port-forwards (via Cloudflare)
    ansible.builtin.uri:
      url: '{{ item }}'
      method: GET
      status_code: [200, 301, 302, 401, 403, 404]
      timeout: 15
    loop: '{{ commit_confirm_verify_urls }}'
    delegate_to: localhost
    when: not ansible_check_mode
    register: commit_confirm_verify
    retries: 3
    delay: 5
    until: commit_confirm_verify is succeeded
    tags: [always]

  - name: Verify a fresh SSH login to the router still works
    ansible.builtin.command:
      argv:
        - ssh
        - -o
        - BatchMode=yes
        - -o
        - ControlMaster=no
        - -o
        - ControlPath=none
        - -o
        - ConnectTimeout=10
        - -o
        - StrictHostKeyChecking=no
        - -i
        - '{{ ansible_ssh_private_key_file }}'
        - '{{ ansible_user }}@{{ ansible_host }}'
        - 'true'
    delegate_to: localhost
    when: not ansible_check_mode
    changed_when: false
    tags: [always]

# `config-mgmt confirm` stops the reboot timer, then tries to finalise a
# commit-log entry that only the interactive CLI writes (it exports
# IN_COMMIT_CONFIRM around its commit; vyos_config's commits are logged
# normally at commit time instead). That second step throws a harmless
# traceback, so stop the timer directly and assert it is gone.
  - name: Confirm commit (cancel rollback timer)
    vyos.vyos.vyos_command:
      commands:
        - sudo systemctl stop --quiet commit-confirm.timer
        - sudo pkill -f commit-confirm-notify.py || true
        - systemctl is-active commit-confirm.timer || true
    register: commit_confirm_result
    when: not ansible_check_mode
    changed_when: true
    failed_when: "'inactive' not in commit_confirm_result.stdout[-1]"
    tags: [always]
