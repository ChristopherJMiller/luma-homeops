---
# netpol-canary: the permanent NetworkPolicy canary (design §6.4). A probe DaemonSet, one pod per
# node because each node's agent enforces on its own, runs probe.sh over matrix.txt; an echo
# server gives it a target in its own namespace. B1b (plan Task 7): the namespace takes the
# default-deny, allow-dns and egress-internet-only components plus its own two policies, and the
# probe runs in enforced mode. NetpolCanaryFailing fires when a probe stays unready.
#
# No kustomization-level namespace (preflight F5): the PrometheusRule lives in `prometheus`, so
# every object names netpol-canary itself, the generator below does too, and the patch at the end
# gives the components' policies (which carry no namespace) netpol-canary.
#
# Roll back by rendering nothing, never by deleting cluster/applications/netpol-canary.yaml.
# Below this header the file becomes exactly the marker `# netpol: rolled back (Global
# Constraints)`, apiVersion, kind and `resources: []`, with everything after the resources list
# deleted (the generator, components and patches). Argo prunes it all (allowEmpty). The
# netpol-manifests hook accepts only that shape.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - probe.yaml
  - echo.yaml
  - networkpolicy.yaml
  - prometheusrule.yaml
# The name gets a content hash, so a change to probe.sh or matrix.txt rolls the probe pods.
configMapGenerator:
  - name: netpol-probe
    namespace: netpol-canary
    files:
      - probe.sh
      - matrix.txt
components:
  - ../components/netpol/default-deny
  - ../components/netpol/allow-dns
  - ../components/netpol/egress-internet-only
patches:
  # Every NetworkPolicy lands in netpol-canary, the components' policies included.
  - target:
      kind: NetworkPolicy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: netpol-canary
