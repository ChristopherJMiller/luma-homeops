---
# netpol-echo: the canary's target in its own namespace, agnhost porter. Both ports listen. The
# replies name what echo-ingress-from-probe allows: 9376 says open (allowed from the probe) and
# 9377 says closed (denied). Readiness is the kubelet's tcpSocket check, and root on the node is
# exempt from policy (design §3.4 item 3), so it must keep passing under default-deny.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-echo
  namespace: netpol-canary
  labels:
    app.kubernetes.io/name: netpol-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netpol-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netpol-echo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
          args: [porter]
          env:
            - name: SERVE_PORT_9376
              value: open
            - name: SERVE_PORT_9377
              value: closed
          ports:
            - name: open
              containerPort: 9376
            - name: closed
              containerPort: 9377
          readinessProbe:
            tcpSocket:
              port: 9376
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# ClusterIP: the matrix rows for 9376 and 9377 go through kube-proxy's DNAT to the pod.
apiVersion: v1
kind: Service
metadata:
  name: netpol-echo
  namespace: netpol-canary
  labels:
    app.kubernetes.io/name: netpol-echo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netpol-echo
  ports:
    - name: open
      port: 9376
      targetPort: open
    - name: closed
      port: 9377
      targetPort: closed
---
# Headless: the name resolves to the echo pod's own IP, for the matrix row that dials the pod
# directly (no DNAT) on 9378, which nothing serves. With no policy the pod refuses the connection,
# which proves it answers. echo-ingress-from-probe accepts TCP 9378 from the probe, so only the
# probe's egress can drop the row; a leak shows as a refusal, which fails.
apiVersion: v1
kind: Service
metadata:
  name: netpol-echo-pod
  namespace: netpol-canary
  labels:
    app.kubernetes.io/name: netpol-echo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: netpol-echo
  ports:
    - name: open
      port: 9376
      targetPort: open
    - name: closed
      port: 9377
      targetPort: closed
