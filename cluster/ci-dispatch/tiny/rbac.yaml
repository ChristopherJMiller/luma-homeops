---
# What ci-dispatch may do in ci-tiny, exactly, and nothing cluster-wide (no ClusterRole).
# - jobs: create (suspended), get, list, patch (resume), delete (reap);
# - secrets: create and delete only, the runner's one-time credential, owned by its Job. No get:
#   the dispatcher never reads a Secret back, and cannot read any other;
# - pods: get and list, to see whether a runner pod is Running.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-dispatch
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-dispatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-dispatch
subjects:
  - kind: ServiceAccount
    name: ci-dispatch
    namespace: ci-dispatch
