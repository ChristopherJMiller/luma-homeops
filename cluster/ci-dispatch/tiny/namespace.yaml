---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-tiny
  labels:
    # LOAD-BEARING: ci-dispatch's Kubernetes guard checks the Job's shape (suspend, deadline, no
    # token) but leaves pod privilege fields (hostNetwork, privileged, capabilities, host paths) to
    # Pod Security admission here. Drop this label and nothing else stops a privileged pod.
    # scripts/test_ci_dispatch_manifests.py::test_namespaces_restricted keeps it.
    pod-security.kubernetes.io/enforce: restricted
    # PSA enforce judges Pods, not Jobs: warn and audit make a bad Job template visible on the POST.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
