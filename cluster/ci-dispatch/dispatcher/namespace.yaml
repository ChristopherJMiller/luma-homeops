---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-dispatch
  annotations:
    # Pruning a Namespace deletes its PVC whatever the PVC says (D5), and the PVC holds the usage
    # ledger. A rollback renders nothing and leaves this behind.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    # The pod is distroless, non-root, read-only root, every capability dropped, RuntimeDefault seccomp.
    pod-security.kubernetes.io/enforce: restricted
    # PSA enforce judges Pods, not Jobs: warn and audit make a bad Job template visible on the POST.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
