---
# promtool tests for prometheusrule.yaml, run by scripts/test-ci-dispatch-alerts.sh. Not a manifest,
# so kustomization.yaml does not list it. One firing and one quiet case per alert (phase 1's eight,
# v0.4.0's CIDispatchOrgListStale, phase 2's seven); the summaries are copied from the rules, so a
# reworded alert fails here until this file follows.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - name: CIDispatchStale fires when the loop stops succeeding
    interval: 1m
    input_series:
      # The timestamp tracks the clock for 3 minutes, then freezes.
      - series: 'ci_dispatch_loop_last_success_timestamp{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0+60x3 180x40'
    alert_rule_test:
      - {eval_time: 6m, alertname: CIDispatchStale, exp_alerts: []}
      - eval_time: 15m
        alertname: CIDispatchStale
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-dispatch, job: ci-dispatch}
            exp_annotations:
              summary: "ci-dispatch has not completed a loop with every read succeeding for 5 minutes (docs/ci.md)"
  - name: CIDispatchStale is quiet while the loop keeps succeeding
    interval: 1m
    input_series:
      - series: 'ci_dispatch_loop_last_success_timestamp{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0+60x40'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchStale, exp_alerts: []}
      - {eval_time: 35m, alertname: CIDispatchStale, exp_alerts: []}
  - name: CIDispatchStale fires when the metric is absent (never scraped, or the pod is gone)
    interval: 1m
    input_series:
      - series: 'up{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 1m, alertname: CIDispatchStale, exp_alerts: []}
      - eval_time: 5m
        alertname: CIDispatchStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "ci-dispatch has not completed a loop with every read succeeding for 5 minutes (docs/ci.md)"
  - name: CIDispatchLaunchFailing fires when a job is held as launch-failing
    interval: 1m
    input_series:
      - series: 'ci_dispatch_holds{namespace="ci-dispatch",class="tiny",reason="launch-failing"}'
        values: '0x2 1x20'
    alert_rule_test:
      - {eval_time: 1m, alertname: CIDispatchLaunchFailing, exp_alerts: []}
      - eval_time: 5m
        alertname: CIDispatchLaunchFailing
        exp_alerts:
          - exp_labels: {severity: warning, reason: held}
            exp_annotations:
              summary: "ci-dispatch holds a job as launch-failing: three launches did not produce a runner (docs/ci.md)"
  - name: CIDispatchLaunchFailing fires on launch errors that persist for 15 minutes
    interval: 1m
    input_series:
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="error"}'
        values: '0+1x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: CIDispatchLaunchFailing, exp_alerts: []}
      - eval_time: 25m
        alertname: CIDispatchLaunchFailing
        exp_alerts:
          - exp_labels: {severity: warning, reason: errors}
            exp_annotations:
              summary: "ci-dispatch launches keep failing with errors (docs/ci.md)"
  - name: CIDispatchLaunchFailing is quiet with no holds and a flat error counter
    interval: 1m
    input_series:
      - series: 'ci_dispatch_holds{namespace="ci-dispatch",class="tiny",reason="launch-failing"}'
        values: '0x40'
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="error"}'
        values: '3x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: CIDispatchLaunchFailing, exp_alerts: []}
  - name: CIDispatchConfigUntrusted fires after 15 minutes unverified
    interval: 1m
    input_series:
      - series: 'ci_dispatch_config_verified{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: CIDispatchConfigUntrusted, exp_alerts: []}
      - eval_time: 20m
        alertname: CIDispatchConfigUntrusted
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-dispatch, job: ci-dispatch}
            exp_annotations:
              summary: "ci-dispatch cannot verify the Owner-signed limits (ci.yaml): it runs on the last verified copy or the code defaults (docs/ci.md)"
  - name: CIDispatchConfigUntrusted is quiet while verified
    interval: 1m
    input_series:
      - series: 'ci_dispatch_config_verified{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: CIDispatchConfigUntrusted, exp_alerts: []}
  - name: CIDispatchStoredConfigRejected fires once a stored config fails its proof
    interval: 1m
    input_series:
      # The counter moves at start (the restore) and stays until the process restarts.
      - series: 'ci_dispatch_store_rejected_total{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0x5 1x20'
    alert_rule_test:
      - {eval_time: 3m, alertname: CIDispatchStoredConfigRejected, exp_alerts: []}
      - eval_time: 10m
        alertname: CIDispatchStoredConfigRejected
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-dispatch, job: ci-dispatch}
            exp_annotations:
              summary: "ci-dispatch stored config rejected: the copy of ci.yaml in its ledger failed its proof at start: usually a signer no longer in the keyring (a rotated or expired key), rarely corruption or tampering (docs/ci.md)"
              description: "The counter stays above zero until the pod restarts. Once ci_dispatch_config_verified is 1, delete pod ci-dispatch-0 to clear it. With no key rotated or expired, treat it as tampering (docs/ci.md)."
  - name: CIDispatchStoredConfigRejected is quiet at zero
    interval: 1m
    input_series:
      - series: 'ci_dispatch_store_rejected_total{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: CIDispatchStoredConfigRejected, exp_alerts: []}
  - name: CIDispatchConfigFindings fires on a finding that lasts 30 minutes
    interval: 1m
    input_series:
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="owner-name-stale"}'
        values: '1x60'
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="owner-name-missing"}'
        values: '0x60'
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="owner-names-unchecked"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchConfigFindings, exp_alerts: []}
      - eval_time: 40m
        alertname: CIDispatchConfigFindings
        exp_alerts:
          - exp_labels: {severity: warning, kind: owner-name-stale}
            exp_annotations:
              summary: "ci-dispatch config findings (the kind label names it): an owner name in ci.yaml no longer matches its id, the name lookups failed, or a paid class is on but no hourly cap or paid concurrency lets it launch (docs/ci.md)"
  - name: CIDispatchConfigFindings fires on a paid class that can never launch
    interval: 1m
    input_series:
      # small is on in ci.yaml, but global.paid_usd_per_hour is unset: its jobs would wait forever.
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="paid-class-unlaunchable"}'
        values: '1x60'
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="owner-name-stale"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchConfigFindings, exp_alerts: []}
      - eval_time: 40m
        alertname: CIDispatchConfigFindings
        exp_alerts:
          - exp_labels: {severity: warning, kind: paid-class-unlaunchable}
            exp_annotations:
              summary: "ci-dispatch config findings (the kind label names it): an owner name in ci.yaml no longer matches its id, the name lookups failed, or a paid class is on but no hourly cap or paid concurrency lets it launch (docs/ci.md)"
  - name: CIDispatchConfigFindings leaves stored-config-rejected to its own alert
    interval: 1m
    input_series:
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="stored-config-rejected"}'
        values: '1x60'
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="owner-name-stale"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 50m, alertname: CIDispatchConfigFindings, exp_alerts: []}
  - name: CIDispatchLaunchesUndone fires on 12 undos an hour, sustained for an hour
    interval: 1m
    input_series:
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="undone"}'
        values: '0+0.2x200'
    alert_rule_test:
      - {eval_time: 80m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - eval_time: 120m
        alertname: CIDispatchLaunchesUndone
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "ci-dispatch undid more than 7 tiny launches an hour for an hour: jobs Forgejo holds, or crash leftovers, keep taking the launch slot (docs/ci.md)"
  - name: CIDispatchLaunchesUndone is quiet for one held job's whole back-off schedule
    interval: 1m
    input_series:
      # Undos at 3, 7, 12, 20, 33 and 46 min (3 min pickup, then 1/2/5/10/10 min back-off), then
      # 109 and 172 min (60 min after the sixth): never more than 6 in an hour. One-minute samples from
      # zero: the counter-zero clamp keeps increase() from extrapolating the window's start.
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="undone"}'
        values: '0x2 1x3 2x4 3x7 4x12 5x12 6x62 7x62 8x28'
    alert_rule_test:
      - {eval_time: 60m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 110m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 200m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
  - name: CIDispatchLaunchesUndone is quiet for one held job sampled every 30 s from a non-zero counter
    interval: 30s
    input_series:
      # The same schedule as a scrape sees it: 30 s samples, 10 undos counted before. increase()
      # now extrapolates to the window's edges, so 6 undos read about 6.05; the threshold of 7
      # leaves room for that.
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="undone"}'
        values: '10x5 11x7 12x9 13x15 14x25 15x25 16x125 17x125 18x56'
    alert_rule_test:
      # The 6.05 reading lasts from 46 to 62 min, so 61 and 62 min are where a threshold of 6
      # with a shorter `for` would fire.
      - {eval_time: 60m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 61m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 62m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 110m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 200m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
  - name: CIDispatchLaunchesUndone is quiet for two held jobs sharing the slot (for 1h carries it)
    interval: 1m
    input_series:
      # Two held jobs take turns in the one global slot: undos at 3, 6, 9, 12, 15, 18, 23, 26, 36,
      # 39, 49 and 52 min, then 112, 115, 175 and 178. Up to 12 in an hour, and above 7 for about
      # 49 min. Only the hour-long `for` keeps this quiet; a shorter one fires.
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="undone"}'
        values: '20x2 21x2 22x2 23x2 24x2 25x2 26x4 27x2 28x9 29x2 30x9 31x2 32x59 33x2 34x59 35x2 36x22'
    alert_rule_test:
      - {eval_time: 60m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 90m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 200m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
  - name: CIDispatchOrphanCompute fires on an orphan container group that lasts 15 minutes
    interval: 1m
    input_series:
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="job"}'
        values: '0x40'
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="runner"}'
        values: '0x40'
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="group"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: CIDispatchOrphanCompute, exp_alerts: []}
      - eval_time: 20m
        alertname: CIDispatchOrphanCompute
        exp_alerts:
          - exp_labels: {severity: critical, kind: group}
            exp_annotations:
              summary: "ci-dispatch sees compute it has no launch for, for 15 minutes: a ci-tiny Job or runner, or a container group in rg-realliance-ci; the reaper should have removed it (docs/ci.md)"
  - name: CIDispatchOrphanCompute fires on a tiny orphan too
    interval: 1m
    input_series:
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="job"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CIDispatchOrphanCompute
        exp_alerts:
          - exp_labels: {severity: critical, kind: job}
            exp_annotations:
              summary: "ci-dispatch sees compute it has no launch for, for 15 minutes: a ci-tiny Job or runner, or a container group in rg-realliance-ci; the reaper should have removed it (docs/ci.md)"
  - name: CIDispatchOrphanCompute is quiet when every count is zero
    interval: 1m
    input_series:
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="job"}'
        values: '0x40'
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="runner"}'
        values: '0x40'
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="group"}'
        values: '0x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: CIDispatchOrphanCompute, exp_alerts: []}
  - name: CITinyQuotaFull fires when the pod quota stays full for 30 minutes
    interval: 1m
    input_series:
      - series: 'kube_resourcequota{namespace="ci-tiny",resource="pods",type="used"}'
        values: '3x70'
      - series: 'kube_resourcequota{namespace="ci-tiny",resource="pods",type="hard"}'
        values: '3x70'
    alert_rule_test:
      - {eval_time: 20m, alertname: CITinyQuotaFull, exp_alerts: []}
      - eval_time: 40m
        alertname: CITinyQuotaFull
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-tiny, resource: pods}
            exp_annotations:
              summary: "ci-tiny has used all 3 pods of its quota for 30 minutes; jobs are waiting for a free slot (docs/ci.md)"
  - name: CITinyQuotaFull is quiet below the quota
    interval: 1m
    input_series:
      - series: 'kube_resourcequota{namespace="ci-tiny",resource="pods",type="used"}'
        values: '2x70'
      - series: 'kube_resourcequota{namespace="ci-tiny",resource="pods",type="hard"}'
        values: '3x70'
    alert_rule_test:
      - {eval_time: 40m, alertname: CITinyQuotaFull, exp_alerts: []}
  # ---- v0.4.0: the org list (org_defaults)
  - name: CIDispatchOrgListStale fires on an org list held over an hour old for 15 minutes (stale)
    interval: 1m
    input_series:
      - series: 'ci_dispatch_org_list_age_seconds{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '3700x40'
    alert_rule_test:
      - {eval_time: 14m, alertname: CIDispatchOrgListStale, exp_alerts: []}
      - eval_time: 16m
        alertname: CIDispatchOrgListStale
        exp_alerts:
          - exp_labels: {severity: warning, reason: stale, namespace: ci-dispatch, job: ci-dispatch}
            exp_annotations:
              summary: "ci-dispatch's organisation list is over an hour old, so every owner without an owners: entry gets org_defaults, with no paid classes (docs/ci.md)"
  - name: CIDispatchOrgListStale fires when the age is absent for 30 minutes (absent)
    interval: 1m
    input_series:
      - series: 'up{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchOrgListStale, exp_alerts: []}
      - eval_time: 35m
        alertname: CIDispatchOrgListStale
        exp_alerts:
          - exp_labels: {severity: warning, reason: absent}
            exp_annotations:
              summary: "ci-dispatch has no organisation list, so every owner without an owners: entry gets org_defaults (docs/ci.md)"
  - name: CIDispatchOrgListStale is quiet at 600 s (the 10-minute refresh)
    interval: 1m
    input_series:
      - series: 'ci_dispatch_org_list_age_seconds{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '600x80'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchOrgListStale, exp_alerts: []}
      - {eval_time: 75m, alertname: CIDispatchOrgListStale, exp_alerts: []}
  - name: CIDispatchOrgListStale is quiet through a 10-minute absence (a restart)
    interval: 1m
    input_series:
      # Fresh until 10 min, ten stale markers, then a new process reads a new list from 21 min.
      - series: 'ci_dispatch_org_list_age_seconds{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0+60x10 stale stale stale stale stale stale stale stale stale stale 0+60x40'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchOrgListStale, exp_alerts: []}
      - {eval_time: 45m, alertname: CIDispatchOrgListStale, exp_alerts: []}
  # ---- phase 2: the paid classes (docs/superpowers/plans/2026-11-05-runner-classes-phase-2.md, Task 18)
  - name: CIDispatchSpendHigh fires at 80 % of the cap ($65 of $80, used plus reserved)
    interval: 1m
    input_series:
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="used"}'
        values: '50x30'
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="reserved"}'
        values: '15x30'
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="cap"}'
        values: '80x30'
    alert_rule_test:
      - {eval_time: 3m, alertname: CIDispatchSpendHigh, exp_alerts: []}
      - eval_time: 10m
        alertname: CIDispatchSpendHigh
        exp_alerts:
          - exp_labels: {severity: critical, level: "80"}
            exp_annotations:
              summary: "ci-dispatch's paid spend this period, used plus reserved, is at 80 % of the $80 global cap ($64) (docs/ci.md)"
  - name: CIDispatchSpendHigh fires at both levels at 95 % ($77 of $80)
    interval: 1m
    input_series:
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="used"}'
        values: '70x30'
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="reserved"}'
        values: '7x30'
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="cap"}'
        values: '80x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: CIDispatchSpendHigh
        exp_alerts:
          - exp_labels: {severity: critical, level: "80"}
            exp_annotations:
              summary: "ci-dispatch's paid spend this period, used plus reserved, is at 80 % of the $80 global cap ($64) (docs/ci.md)"
          - exp_labels: {severity: critical, level: "95"}
            exp_annotations:
              summary: "ci-dispatch's paid spend this period, used plus reserved, is at 95 % of the $80 global cap ($76): new paid launches stop at the cap (docs/ci.md)"
  - name: CIDispatchSpendHigh is quiet below 80 % ($63 of $80)
    interval: 1m
    input_series:
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="used"}'
        values: '50x30'
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="reserved"}'
        values: '13x30'
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="cap"}'
        values: '80x30'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchSpendHigh, exp_alerts: []}
  - name: CIDispatchSpendHigh is quiet when the cap gauge reads 0 (built-in limits), whatever is used
    interval: 1m
    input_series:
      # Without the guard, 5 / 0 is +Inf, which is >= 0.95: both levels would page.
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="used"}'
        values: '5x30'
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="reserved"}'
        values: '0x30'
      - series: 'ci_dispatch_period_usd{namespace="ci-dispatch",kind="cap"}'
        values: '0x30'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchSpendHigh, exp_alerts: []}
  - name: CIDispatchLocked fires two minutes into a lock
    interval: 1m
    input_series:
      - series: 'ci_dispatch_azure_locked{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0x4 1x20'
    alert_rule_test:
      - {eval_time: 6m, alertname: CIDispatchLocked, exp_alerts: []}
      - eval_time: 10m
        alertname: CIDispatchLocked
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Azure has locked ci-dispatch out: the sweeper or the budget removed its role assignment, so paid classes wait not-ready until Chris restores it with a terraform apply (docs/ci.md)"
  - name: CIDispatchLocked is quiet while unlocked
    interval: 1m
    input_series:
      - series: 'ci_dispatch_azure_locked{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0x30'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchLocked, exp_alerts: []}
  - name: CISweeperStale fires 30 minutes after the last finished run (stale)
    interval: 1m
    input_series:
      # The newest finished run ends at 10 min, then none: the age passes 1800 s at 40 min.
      - series: 'ci_dispatch_sweeper_last_run_timestamp{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0+60x10 600x60'
    alert_rule_test:
      - {eval_time: 39m, alertname: CISweeperStale, exp_alerts: []}
      - eval_time: 45m
        alertname: CISweeperStale
        exp_alerts:
          - exp_labels: {severity: critical, reason: stale}
            exp_annotations:
              summary: "The Azure sweeper ci-sweeper has no finished run in 30 minutes: it is disabled or hung, so nothing but the budget bounds Azure compute (docs/ci.md)"
  - name: CISweeperStale fires when the timestamp is absent for 30 minutes (absent)
    interval: 1m
    input_series:
      - series: 'up{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 20m, alertname: CISweeperStale, exp_alerts: []}
      - eval_time: 35m
        alertname: CISweeperStale
        exp_alerts:
          - exp_labels: {severity: critical, reason: absent}
            exp_annotations:
              summary: "ci-dispatch has not reported the Azure sweeper's last run for 30 minutes: the dispatcher cannot read the sweeper's run history, so nobody watches the sweeper (docs/ci.md)"
  - name: CISweeperStale is quiet through a 10-minute absence (a pod move, an RBD detach)
    interval: 1m
    input_series:
      # Fresh until 20 min, then ten stale markers (a failed scrape: absent at once, no 5-min
      # lookback), fresh again from 31 min. absent() is true for the whole 10 minutes.
      - series: 'ci_dispatch_sweeper_last_run_timestamp{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0+60x20 stale stale stale stale stale stale stale stale stale stale 1860+60x40'
    alert_rule_test:
      - {eval_time: 28m, alertname: CISweeperStale, exp_alerts: []}
      - {eval_time: 40m, alertname: CISweeperStale, exp_alerts: []}
      - {eval_time: 70m, alertname: CISweeperStale, exp_alerts: []}
  - name: CIDispatchDrift fires on a ratio over 10 %
    interval: 1m
    input_series:
      - series: 'ci_dispatch_drift_ratio{namespace="ci-dispatch",window="day"}'
        values: '0.15x20'
      - series: 'ci_dispatch_drift_ratio{namespace="ci-dispatch",window="period"}'
        values: '0.02x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: CIDispatchDrift
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "ci-dispatch's paid charges and Azure's cost differ by over 10 % for a closed day or period (docs/ci.md)"
  - name: CIDispatchDrift is quiet at 10 % and under
    interval: 1m
    input_series:
      - series: 'ci_dispatch_drift_ratio{namespace="ci-dispatch",window="day"}'
        values: '0.05x20'
      - series: 'ci_dispatch_drift_ratio{namespace="ci-dispatch",window="period"}'
        values: '0.10x20'
    alert_rule_test:
      - {eval_time: 10m, alertname: CIDispatchDrift, exp_alerts: []}
  - name: CIDispatchPaidNotReady fires per class, in dry-run too (F24)
    interval: 1m
    input_series:
      - series: 'ci_dispatch_class_mode{namespace="ci-dispatch",class="tiny"}'
        values: '2x60'
      - series: 'ci_dispatch_class_mode{namespace="ci-dispatch",class="small"}'
        values: '1x60'
      - series: 'ci_dispatch_class_mode{namespace="ci-dispatch",class="medium"}'
        values: '1x60'
      - series: 'ci_dispatch_paid_ready{namespace="ci-dispatch",class="small"}'
        values: '0x60'
      - series: 'ci_dispatch_paid_ready{namespace="ci-dispatch",class="medium"}'
        values: '1x60'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchPaidNotReady, exp_alerts: []}
      - eval_time: 35m
        alertname: CIDispatchPaidNotReady
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-dispatch, class: small}
            exp_annotations:
              summary: "A paid class in dry-run or on has not been ready for 30 minutes (the class label names it): Azure locked or failing, prices over 7 days old, no succeeded sweeper run in 30 minutes, or a container group whose egress reads keep failing (docs/ci.md)"
  - name: CIDispatchPaidNotReady is quiet for a class that is off, or ready
    interval: 1m
    input_series:
      - series: 'ci_dispatch_class_mode{namespace="ci-dispatch",class="small"}'
        values: '0x60'
      - series: 'ci_dispatch_class_mode{namespace="ci-dispatch",class="medium"}'
        values: '2x60'
      - series: 'ci_dispatch_paid_ready{namespace="ci-dispatch",class="small"}'
        values: '0x60'
      - series: 'ci_dispatch_paid_ready{namespace="ci-dispatch",class="medium"}'
        values: '1x60'
    alert_rule_test:
      - {eval_time: 45m, alertname: CIDispatchPaidNotReady, exp_alerts: []}
  - name: CIDispatchEgressCapHit fires for an hour after an egress-cap reap
    interval: 1m
    input_series:
      - series: 'ci_dispatch_reaped_total{namespace="ci-dispatch",reason="egress-cap"}'
        values: '0x10 1x60'
    alert_rule_test:
      - {eval_time: 5m, alertname: CIDispatchEgressCapHit, exp_alerts: []}
      - eval_time: 15m
        alertname: CIDispatchEgressCapHit
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-dispatch, reason: egress-cap}
            exp_annotations:
              summary: "ci-dispatch deleted a container group that sent 10 GB to the internet, the per-job egress cap, in the last hour; its owner is charged the bytes (docs/ci.md)"
  - name: CIDispatchEgressCapHit is quiet when only other reaps count up
    interval: 1m
    input_series:
      - series: 'ci_dispatch_reaped_total{namespace="ci-dispatch",reason="egress-cap"}'
        values: '0x60'
      - series: 'ci_dispatch_reaped_total{namespace="ci-dispatch",reason="orphan-group"}'
        values: '0+1x60'
    alert_rule_test:
      - {eval_time: 30m, alertname: CIDispatchEgressCapHit, exp_alerts: []}
  - name: CIDispatchAzureFailing fires when Azure calls keep failing with no lock (an expired secret)
    interval: 1m
    input_series:
      - series: 'ci_dispatch_errors_total{namespace="ci-dispatch",api="azure"}'
        values: '0+2x80'
      - series: 'ci_dispatch_azure_locked{namespace="ci-dispatch"}'
        values: '0x80'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchAzureFailing, exp_alerts: []}
      - eval_time: 40m
        alertname: CIDispatchAzureFailing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "ci-dispatch's Azure calls keep failing with no lock: usually an expired or rotated client secret (an AADSTS code in the log; rotate per docs/ci.md), else an Azure outage; paid classes wait not-ready (docs/ci.md)"
  - name: CIDispatchAzureFailing stands aside during a lock (CIDispatchLocked's)
    interval: 1m
    input_series:
      - series: 'ci_dispatch_errors_total{namespace="ci-dispatch",api="azure"}'
        values: '0+2x80'
      - series: 'ci_dispatch_azure_locked{namespace="ci-dispatch"}'
        values: '1x80'
    alert_rule_test:
      - {eval_time: 40m, alertname: CIDispatchAzureFailing, exp_alerts: []}
  - name: CIDispatchAzureFailing is quiet with a flat Azure counter, whatever other APIs do
    interval: 1m
    input_series:
      - series: 'ci_dispatch_errors_total{namespace="ci-dispatch",api="azure"}'
        values: '3x80'
      - series: 'ci_dispatch_errors_total{namespace="ci-dispatch",api="forgejo"}'
        values: '0+2x80'
      - series: 'ci_dispatch_azure_locked{namespace="ci-dispatch"}'
        values: '0x80'
    alert_rule_test:
      - {eval_time: 40m, alertname: CIDispatchAzureFailing, exp_alerts: []}
