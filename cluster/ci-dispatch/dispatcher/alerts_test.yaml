---
# promtool tests for prometheusrule.yaml, run by scripts/test-ci-dispatch-alerts.sh. Not a manifest,
# so kustomization.yaml does not list it. One firing and one quiet case per alert; the summaries
# are copied from the rules, so a reworded alert fails here until this file follows.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - name: CIDispatchStale fires when the loop stops succeeding
    interval: 1m
    input_series:
      # The timestamp tracks the clock for 3 minutes, then freezes.
      - series: 'ci_dispatch_loop_last_success_timestamp{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0+60x3 180x40'
    alert_rule_test:
      - {eval_time: 6m, alertname: CIDispatchStale, exp_alerts: []}
      - eval_time: 15m
        alertname: CIDispatchStale
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-dispatch, job: ci-dispatch}
            exp_annotations:
              summary: "ci-dispatch has not completed a loop with every read succeeding for 5 minutes (docs/ci.md)"
  - name: CIDispatchStale is quiet while the loop keeps succeeding
    interval: 1m
    input_series:
      - series: 'ci_dispatch_loop_last_success_timestamp{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0+60x40'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchStale, exp_alerts: []}
      - {eval_time: 35m, alertname: CIDispatchStale, exp_alerts: []}
  - name: CIDispatchStale fires when the metric is absent (never scraped, or the pod is gone)
    interval: 1m
    input_series:
      - series: 'up{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 1m, alertname: CIDispatchStale, exp_alerts: []}
      - eval_time: 5m
        alertname: CIDispatchStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "ci-dispatch has not completed a loop with every read succeeding for 5 minutes (docs/ci.md)"
  - name: CIDispatchLaunchFailing fires when a job is held as launch-failing
    interval: 1m
    input_series:
      - series: 'ci_dispatch_holds{namespace="ci-dispatch",class="tiny",reason="launch-failing"}'
        values: '0x2 1x20'
    alert_rule_test:
      - {eval_time: 1m, alertname: CIDispatchLaunchFailing, exp_alerts: []}
      - eval_time: 5m
        alertname: CIDispatchLaunchFailing
        exp_alerts:
          - exp_labels: {severity: warning, reason: held}
            exp_annotations:
              summary: "ci-dispatch holds a job as launch-failing: three launches did not produce a runner (docs/ci.md)"
  - name: CIDispatchLaunchFailing fires on launch errors that persist for 15 minutes
    interval: 1m
    input_series:
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="error"}'
        values: '0+1x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: CIDispatchLaunchFailing, exp_alerts: []}
      - eval_time: 25m
        alertname: CIDispatchLaunchFailing
        exp_alerts:
          - exp_labels: {severity: warning, reason: errors}
            exp_annotations:
              summary: "ci-dispatch launches keep failing with errors (docs/ci.md)"
  - name: CIDispatchLaunchFailing is quiet with no holds and a flat error counter
    interval: 1m
    input_series:
      - series: 'ci_dispatch_holds{namespace="ci-dispatch",class="tiny",reason="launch-failing"}'
        values: '0x40'
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="error"}'
        values: '3x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: CIDispatchLaunchFailing, exp_alerts: []}
  - name: CIDispatchConfigUntrusted fires after 15 minutes unverified
    interval: 1m
    input_series:
      - series: 'ci_dispatch_config_verified{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: CIDispatchConfigUntrusted, exp_alerts: []}
      - eval_time: 20m
        alertname: CIDispatchConfigUntrusted
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-dispatch, job: ci-dispatch}
            exp_annotations:
              summary: "ci-dispatch cannot verify the Owner-signed limits (ci.yaml): it runs on the last verified copy or the code defaults (docs/ci.md)"
  - name: CIDispatchConfigUntrusted is quiet while verified
    interval: 1m
    input_series:
      - series: 'ci_dispatch_config_verified{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: CIDispatchConfigUntrusted, exp_alerts: []}
  - name: CIDispatchStoredConfigRejected fires once a stored config fails its proof
    interval: 1m
    input_series:
      # The counter moves at start (the restore) and stays until the process restarts.
      - series: 'ci_dispatch_store_rejected_total{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0x5 1x20'
    alert_rule_test:
      - {eval_time: 3m, alertname: CIDispatchStoredConfigRejected, exp_alerts: []}
      - eval_time: 10m
        alertname: CIDispatchStoredConfigRejected
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-dispatch, job: ci-dispatch}
            exp_annotations:
              summary: "ci-dispatch stored config rejected: the copy of ci.yaml in its ledger failed its proof at start: usually a signer no longer in the keyring (a rotated or expired key), rarely corruption or tampering (docs/ci.md)"
              description: "The counter stays above zero until the pod restarts. Once ci_dispatch_config_verified is 1, delete pod ci-dispatch-0 to clear it. With no key rotated or expired, treat it as tampering (docs/ci.md)."
  - name: CIDispatchStoredConfigRejected is quiet at zero
    interval: 1m
    input_series:
      - series: 'ci_dispatch_store_rejected_total{namespace="ci-dispatch",job="ci-dispatch"}'
        values: '0x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: CIDispatchStoredConfigRejected, exp_alerts: []}
  - name: CIDispatchConfigFindings fires on a finding that lasts 30 minutes
    interval: 1m
    input_series:
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="owner-name-stale"}'
        values: '1x60'
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="owner-name-missing"}'
        values: '0x60'
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="owner-names-unchecked"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 20m, alertname: CIDispatchConfigFindings, exp_alerts: []}
      - eval_time: 40m
        alertname: CIDispatchConfigFindings
        exp_alerts:
          - exp_labels: {severity: warning, kind: owner-name-stale}
            exp_annotations:
              summary: "ci-dispatch config findings: an owner name in ci.yaml no longer matches its id, or the name lookups failed; the limits still bind to the ids (docs/ci.md)"
  - name: CIDispatchConfigFindings leaves stored-config-rejected to its own alert
    interval: 1m
    input_series:
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="stored-config-rejected"}'
        values: '1x60'
      - series: 'ci_dispatch_config_findings{namespace="ci-dispatch",kind="owner-name-stale"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 50m, alertname: CIDispatchConfigFindings, exp_alerts: []}
  - name: CIDispatchLaunchesUndone fires on 12 undos an hour, sustained for an hour
    interval: 1m
    input_series:
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="undone"}'
        values: '0+0.2x200'
    alert_rule_test:
      - {eval_time: 80m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - eval_time: 120m
        alertname: CIDispatchLaunchesUndone
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "ci-dispatch undid more than 7 tiny launches an hour for an hour: jobs Forgejo holds, or crash leftovers, keep taking the launch slot (docs/ci.md)"
  - name: CIDispatchLaunchesUndone is quiet for one held job's whole back-off schedule
    interval: 1m
    input_series:
      # Undos at 3, 7, 12, 20, 33 and 46 min (3 min pickup, then 1/2/5/10/10 min back-off), then
      # 109 and 172 min (60 min after the sixth): never more than 6 in an hour. One-minute samples from
      # zero: the counter-zero clamp keeps increase() from extrapolating the window's start.
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="undone"}'
        values: '0x2 1x3 2x4 3x7 4x12 5x12 6x62 7x62 8x28'
    alert_rule_test:
      - {eval_time: 60m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 110m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 200m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
  - name: CIDispatchLaunchesUndone is quiet for one held job sampled every 30 s from a non-zero counter
    interval: 30s
    input_series:
      # The same schedule as a scrape sees it: 30 s samples, 10 undos counted before. increase()
      # now extrapolates to the window's edges, so 6 undos read about 6.05; the threshold of 7
      # leaves room for that.
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="undone"}'
        values: '10x5 11x7 12x9 13x15 14x25 15x25 16x125 17x125 18x56'
    alert_rule_test:
      # The 6.05 reading lasts from 46 to 62 min, so 61 and 62 min are where a threshold of 6
      # with a shorter `for` would fire.
      - {eval_time: 60m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 61m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 62m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 110m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 200m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
  - name: CIDispatchLaunchesUndone is quiet for two held jobs sharing the slot (for 1h carries it)
    interval: 1m
    input_series:
      # Two held jobs take turns in the one global slot: undos at 3, 6, 9, 12, 15, 18, 23, 26, 36,
      # 39, 49 and 52 min, then 112, 115, 175 and 178. Up to 12 in an hour, and above 7 for about
      # 49 min. Only the hour-long `for` keeps this quiet; a shorter one fires.
      - series: 'ci_dispatch_launches_total{namespace="ci-dispatch",class="tiny",backend="galaxy",outcome="undone"}'
        values: '20x2 21x2 22x2 23x2 24x2 25x2 26x4 27x2 28x9 29x2 30x9 31x2 32x59 33x2 34x59 35x2 36x22'
    alert_rule_test:
      - {eval_time: 60m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 90m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
      - {eval_time: 200m, alertname: CIDispatchLaunchesUndone, exp_alerts: []}
  - name: CIDispatchOrphanCompute fires on an orphan that lasts 15 minutes
    interval: 1m
    input_series:
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="job"}'
        values: '1x40'
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="runner"}'
        values: '0x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: CIDispatchOrphanCompute, exp_alerts: []}
      - eval_time: 20m
        alertname: CIDispatchOrphanCompute
        exp_alerts:
          - exp_labels: {severity: warning, kind: job}
            exp_annotations:
              summary: "ci-dispatch sees a ci-tiny Job or runner it has no launch for, for 15 minutes; the reaper should have removed it (docs/ci.md)"
  - name: CIDispatchOrphanCompute is quiet when every count is zero
    interval: 1m
    input_series:
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="job"}'
        values: '0x40'
      - series: 'ci_dispatch_orphans{namespace="ci-dispatch",kind="runner"}'
        values: '0x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: CIDispatchOrphanCompute, exp_alerts: []}
  - name: CITinyQuotaFull fires when the pod quota stays full for 30 minutes
    interval: 1m
    input_series:
      - series: 'kube_resourcequota{namespace="ci-tiny",resource="pods",type="used"}'
        values: '3x70'
      - series: 'kube_resourcequota{namespace="ci-tiny",resource="pods",type="hard"}'
        values: '3x70'
    alert_rule_test:
      - {eval_time: 20m, alertname: CITinyQuotaFull, exp_alerts: []}
      - eval_time: 40m
        alertname: CITinyQuotaFull
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ci-tiny, resource: pods}
            exp_annotations:
              summary: "ci-tiny has used all 3 pods of its quota for 30 minutes; jobs are waiting for a free slot (docs/ci.md)"
  - name: CITinyQuotaFull is quiet below the quota
    interval: 1m
    input_series:
      - series: 'kube_resourcequota{namespace="ci-tiny",resource="pods",type="used"}'
        values: '2x70'
      - series: 'kube_resourcequota{namespace="ci-tiny",resource="pods",type="hard"}'
        values: '3x70'
    alert_rule_test:
      - {eval_time: 40m, alertname: CITinyQuotaFull, exp_alerts: []}
