---
# Phase 1's eight alerts (nine rules), weekday (D7), v0.4.0's CIDispatchOrgListStale (two rules,
# weekday) in the same group, and phase 2's seven (nine rules) for the paid classes: 16 alerts, 20
# rules. The money alerts are `critical`: CIDispatchSpendHigh, CIDispatchLocked,
# CIDispatchOrphanCompute (since phase 2, when an orphan is a container group that bills) and
# CISweeperStale. Alertmanager routes them, with CIDispatchDrift and CIDispatchPaidNotReady, by name
# to the 24/7 receiver (cluster/prometheus-stack/alertmanager-config.secret.yaml, phase 2 Task 9);
# the rest go to the weekday default. Cases: alerts_test.yaml, run by
# scripts/test-ci-dispatch-alerts.sh. Metric names are the ones internal/metrics of ci-dispatch v0.4.0
# exports. `release: prometheus` selects this rule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ci-dispatch-alerts
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: prometheus
spec:
  groups:
    - name: ci-dispatch
      interval: 60s
      rules:
        # The success timestamp moves only when every read succeeded, so this also catches a long
        # Forgejo or API outage. /healthz does not (a wedge detector), so the pod keeps running.
        - alert: CIDispatchStale
          expr: time() - ci_dispatch_loop_last_success_timestamp > 300 or absent(ci_dispatch_loop_last_success_timestamp)
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "ci-dispatch has not completed a loop with every read succeeding for 5 minutes (docs/ci.md)"
        # Two rules, one name; the reason label tells them apart (promtool --lint-fatal needs it).
        - alert: CIDispatchLaunchFailing
          expr: max(ci_dispatch_holds{reason="launch-failing"}) > 0
          labels:
            severity: warning
            reason: held
          annotations:
            summary: "ci-dispatch holds a job as launch-failing: three launches did not produce a runner (docs/ci.md)"
        - alert: CIDispatchLaunchFailing
          expr: sum(increase(ci_dispatch_launches_total{outcome="error"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            reason: errors
          annotations:
            summary: "ci-dispatch launches keep failing with errors (docs/ci.md)"
        - alert: CIDispatchConfigUntrusted
          expr: ci_dispatch_config_verified == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ci-dispatch cannot verify the Owner-signed limits (ci.yaml): it runs on the last verified copy or the code defaults (docs/ci.md)"
        # The ledger keeps a copy of the last verified ci.yaml, proven again at every start. The usual
        # cause of a failed proof is honest: its signer is no longer in the keyring (a rotated key) or
        # the key expired. The rare one is a corrupt or tampered copy. The counter only grows within a
        # process, so any value above zero fires, and the alert lasts until the pod restarts, even
        # after a newer head verifies. Rotate keys so it never trips: add the new key, sign a new head
        # with it and wait for ci_dispatch_config_verified 1, then remove the old key (docs/ci.md).
        - alert: CIDispatchStoredConfigRejected
          expr: ci_dispatch_store_rejected_total > 0
          labels:
            severity: warning
          annotations:
            summary: "ci-dispatch stored config rejected: the copy of ci.yaml in its ledger failed its proof at start: usually a signer no longer in the keyring (a rotated or expired key), rarely corruption or tampering (docs/ci.md)"
            description: "The counter stays above zero until the pod restarts. Once ci_dispatch_config_verified is 1, delete pod ci-dispatch-0 to clear it. With no key rotated or expired, treat it as tampering (docs/ci.md)."
        # Findings never change which limits apply; they ask an Owner to look. owner-name-stale: the
        # name now resolves to another account. owner-name-missing: no account has the name.
        # owner-names-unchecked: the lookups failed (Forgejo error), which clears at the next good
        # reload; 30 min rides out a short outage. paid-class-unlaunchable (v0.3.0): a paid class is
        # on in ci.yaml, but global.paid_usd_per_hour is unset or 0, or no owner has a paid_concurrent
        # above 0, so its jobs would wait forever with no hold. Its `config finding` log line names
        # the class and, in `detail`, the missing setting.
        # stored-config-rejected has its own alert: CIDispatchStoredConfigRejected reads the same
        # event from its counter.
        - alert: CIDispatchConfigFindings
          expr: max by (kind) (ci_dispatch_config_findings{kind=~"owner-name-stale|owner-name-missing|owner-names-unchecked|paid-class-unlaunchable"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ci-dispatch config findings (the kind label names it): an owner name in ci.yaml no longer matches its id, the name lookups failed, or a paid class is on but no hourly cap or paid concurrency lets it launch (docs/ci.md)"
        # undone counts launches rolled back before they ran: a job Forgejo held (its runner sat idle
        # at the 3 min pickup timeout) and crash leftovers at start. One held job's back-off (1, 2, 5,
        # 10 and 10 min, then 60 min after the sixth undo) allows at most 6 undos in any hour, which
        # increase() reads as up to about 6.05 at the window's edges; 7 leaves room. Past 7 an hour,
        # held launches take over 21 min an hour of the one global tiny slot (ci.yaml global
        # tiny_concurrent 1). `for: 1h` is load-bearing: two held jobs taking turns in the slot count
        # up to 12 in their first hour and stay above 7 for about 49 min, so only churn that lasts a
        # full hour fires. Don't shorten it. Dry-run launches nothing, so this reads 0 there.
        - alert: CIDispatchLaunchesUndone
          expr: sum(increase(ci_dispatch_launches_total{outcome="undone"}[1h])) > 7
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "ci-dispatch undid more than 7 tiny launches an hour for an hour: jobs Forgejo holds, or crash leftovers, keep taking the launch slot (docs/ci.md)"
        # Phase 1's expression; `critical` since phase 2, when kind="group" is an Azure container group
        # that bills until it is gone. A `tiny` orphan pod still dies at its own deadline.
        - alert: CIDispatchOrphanCompute
          expr: max by (kind) (ci_dispatch_orphans) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "ci-dispatch sees compute it has no launch for, for 15 minutes: a ci-tiny Job or runner, or a container group in rg-realliance-ci; the reaper should have removed it (docs/ci.md)"
        - alert: CITinyQuotaFull
          expr: kube_resourcequota{namespace="ci-tiny",resource="pods",type="used"} >= ignoring(type) kube_resourcequota{namespace="ci-tiny",resource="pods",type="hard"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ci-tiny has used all 3 pods of its quota for 30 minutes; jobs are waiting for a free slot (docs/ci.md)"
        # v0.4.0 (org_defaults). Two rules, one name; `reason` tells them apart. The dispatcher
        # rereads the org list with each limits load and every 10 min, so the age reads under about
        # 660 s. A failed read keeps the last good list; past an hour old, or with none, every owner
        # without an owners: entry gets org_defaults (paid 0), users included. The age is absent
        # until the first good list after a start; 30 min rides out a restart, and CIDispatchStale
        # covers a missing dispatcher.
        - alert: CIDispatchOrgListStale
          expr: ci_dispatch_org_list_age_seconds > 3600
          for: 15m
          labels:
            severity: warning
            reason: stale
          annotations:
            summary: "ci-dispatch's organisation list is over an hour old, so every owner without an owners: entry gets org_defaults, with no paid classes (docs/ci.md)"
        - alert: CIDispatchOrgListStale
          expr: absent(ci_dispatch_org_list_age_seconds)
          for: 30m
          labels:
            severity: warning
            reason: absent
          annotations:
            summary: "ci-dispatch has no organisation list, so every owner without an owners: entry gets org_defaults (docs/ci.md)"
    # Phase 2: the paid classes small and medium on Azure Container Instances
    # (docs/superpowers/plans/2026-11-05-runner-classes-phase-2.md, Task 18).
    - name: ci-dispatch-paid
      interval: 60s
      rules:
        # Two rules, one name; `level` tells them apart. The global cap is $80 a period, so these fire
        # at $64 and $76 of used plus reserved money. The gate refuses any launch past the cap itself.
        # `> 0` drops a zero cap: the built-in limits (no verified ci.yaml) carry 0, and money over 0
        # would read +Inf and page both levels (review M1).
        - alert: CIDispatchSpendHigh
          expr: sum(ci_dispatch_period_usd{kind=~"used|reserved"}) / max(ci_dispatch_period_usd{kind="cap"} > 0) >= 0.80
          for: 5m
          labels:
            severity: critical
            level: "80"
          annotations:
            summary: "ci-dispatch's paid spend this period, used plus reserved, is at 80 % of the $80 global cap ($64) (docs/ci.md)"
        - alert: CIDispatchSpendHigh
          expr: sum(ci_dispatch_period_usd{kind=~"used|reserved"}) / max(ci_dispatch_period_usd{kind="cap"} > 0) >= 0.95
          for: 5m
          labels:
            severity: critical
            level: "95"
          annotations:
            summary: "ci-dispatch's paid spend this period, used plus reserved, is at 95 % of the $80 global cap ($76): new paid launches stop at the cap (docs/ci.md)"
        # The gauge comes only from a single-group GET or a PUT answered 403 (and the list's lock
        # probe, itself a single-group GET), never from an empty list: under the lock ACI lists 200
        # with no groups. Only Chris's terraform apply restores the role assignment.
        - alert: CIDispatchLocked
          expr: max(ci_dispatch_azure_locked) == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Azure has locked ci-dispatch out: the sweeper or the budget removed its role assignment, so paid classes wait not-ready until Chris restores it with a terraform apply (docs/ci.md)"
        # Two rules, one name; `reason` tells them apart. The timestamp is the end of the sweeper's newest
        # finished run (a run still going never moves it), read by the dispatcher's watcher every 5 min.
        # The sweeper runs every 10 min, so 30 min is three missed runs.
        - alert: CISweeperStale
          expr: time() - max(ci_dispatch_sweeper_last_run_timestamp) > 1800
          for: 2m
          labels:
            severity: critical
            reason: stale
          annotations:
            summary: "The Azure sweeper ci-sweeper has no finished run in 30 minutes: it is disabled or hung, so nothing but the budget bounds Azure compute (docs/ci.md)"
        # The watcher cannot read the run history, or has not yet, or the dispatcher is gone (a failed
        # scrape marks the series stale at once). 30 min rides out a pod move or an RBD detach (6 min)
        # shorter than that; CIDispatchStale covers a missing dispatcher. A longer gap pages 24/7, the
        # break-glass scale to 0 and a node-loss stall included: expect or silence it then (docs/ci.md).
        - alert: CISweeperStale
          expr: absent(ci_dispatch_sweeper_last_run_timestamp)
          for: 30m
          labels:
            severity: critical
            reason: absent
          annotations:
            summary: "ci-dispatch has not reported the Azure sweeper's last run for 30 minutes: the dispatcher cannot read the sweeper's run history, so nobody watches the sweeper (docs/ci.md)"
        # The day ratio (D-2, from 06:00 UTC, only when Azure's day is $0.50 or more) and the period
        # ratio (day 3 of the next month) are set once and held, so no `for`.
        - alert: CIDispatchDrift
          expr: max(ci_dispatch_drift_ratio) > 0.10
          labels:
            severity: warning
          annotations:
            summary: "ci-dispatch's paid charges and Azure's cost differ by over 10 % for a closed day or period (docs/ci.md)"
        # Per class, in dry-run too (F24): phase 2 Task 19 rolls back on it. Not ready means a lock, a
        # failed Azure read, prices over price_max_age, the sweeper's last Succeeded run over 30 min
        # old (a sweeper failing every run is no backstop), or no fresh egress pass in 5 min (E17).
        # A group whose egress reads keep failing keeps its last good reading, and its staleness
        # dates the whole pass, so it holds paid not-ready until a read succeeds (fails closed).
        - alert: CIDispatchPaidNotReady
          expr: ci_dispatch_class_mode{class=~"small|medium"} >= 1 and on(class) ci_dispatch_paid_ready == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "A paid class in dry-run or on has not been ready for 30 minutes (the class label names it): Azure locked or failing, prices over 7 days old, no succeeded sweeper run in 30 minutes, or a container group whose egress reads keep failing (docs/ci.md)"
        # E17: the dispatcher deleted its own group at the 10 GB cap. Fires for the hour after.
        - alert: CIDispatchEgressCapHit
          expr: increase(ci_dispatch_reaped_total{reason="egress-cap"}[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "ci-dispatch deleted a container group that sent 10 GB to the internet, the per-job egress cap, in the last hour; its owner is charged the bytes (docs/ci.md)"
        # The token-failure alert (phase 2 Task 7 review). An expired or rotated client secret answers
        # AADSTS (7000222 when expired), which the client reads as ErrRejected, never ErrLocked, so
        # CIDispatchLocked stays quiet while every Azure call fails. A lock fails them too, and is
        # CIDispatchLocked's, so this one stands aside then.
        - alert: CIDispatchAzureFailing
          expr: sum(increase(ci_dispatch_errors_total{api="azure"}[10m])) > 0 unless on() max(ci_dispatch_azure_locked) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ci-dispatch's Azure calls keep failing with no lock: usually an expired or rotated client secret (an AADSTS code in the log; rotate per docs/ci.md), else an Azure outage; paid classes wait not-ready (docs/ci.md)"
