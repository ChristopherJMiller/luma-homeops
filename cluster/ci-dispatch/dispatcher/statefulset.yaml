---
# ci-dispatch: launches one `tiny` runner Job per waiting Forgejo Actions job, within each owner's
# limits (plan: docs/superpowers/plans/2026-11-04-runner-classes-phase-0-1.md). Code and README:
# git.realliance.net/realliance-ops/ci-dispatch. Tiny starts in dry-run (config.yaml `classes`):
# it reads the queue, decides, logs and counts, and launches nothing.
#
# Dry-run still reaps, but only what carries the dispatcher's own name: a ci-tiny Job, or an
# ephemeral instance-scope Forgejo runner, named ci-tiny-<job>-<attempt>-<try> with no active
# launch for 10 min, and a ci-tiny Job past its expires-at. It never touches any other name: not a
# drill's ci-probe-* runner, nor a member's own repo or org runner.
#
# A StatefulSet, not a Deployment with Recreate (D5): forge-bot's review showed a Deployment is no
# singleton under eviction or drain, because its ReplicaSet starts the replacement while the old pod
# still terminates. Two dispatchers would launch the same job twice. The StatefulSet controller never
# creates ci-dispatch-0 while the old object exists. Two more guards sit behind it: the process takes
# flock(LOCK_EX|LOCK_NB) on /data/.lock and exits 1 if another holds it, and the ledger's partial
# unique index allows one active launch per job and attempt. The price: on node loss the dispatcher
# stays down until the node returns or an operator force-deletes the pod after confirming the node is
# off (S4); CIDispatchStale fires meanwhile, and the Jobs' own deadlines bound what is running.
# serviceName is the ordinary Service; no per-pod DNS is needed. The PVC is a separate manifest
# (pvc.yaml) so it can carry Prune=false,Delete=false.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ci-dispatch
  labels:
    app.kubernetes.io/name: ci-dispatch
spec:
  replicas: 1
  serviceName: ci-dispatch
  updateStrategy:
    # Deletes ci-dispatch-0, waits for it to be gone, then creates the new one. A rollout to a
    # template whose pod never becomes Ready stalls; after reverting it, delete ci-dispatch-0 by hand.
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-dispatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-dispatch
    spec:
      serviceAccountName: ci-dispatch
      # The projected `kube` volume below replaces the automatic token with a one-hour one.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # On SIGTERM the step in flight finishes within loop.ShutdownGrace (20 s), then both servers
      # stop within 5 s: 25 s, so 30 s leaves 5 s before the SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless static-debian12:nonroot
        runAsGroup: 65532
        # Makes the PVC (and so /data/snapshots, which the code creates on first use) writable by
        # uid 65532, and gives the 0400 projected secrets group 65532 plus group read; without it
        # the process cannot read them (forge-bot pre-flight #2).
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ci-dispatch
          # v0.1.0: tag v0.1.0 (signed) = main 9055e60, built by ci-dispatch's CI as an OCI manifest,
          # amd64 (Task 14). A new image never deploys itself: .renovaterc.json never automerges this
          # image, so its PR is the alarm. Re-pin by hand after review, with the test's RELEASE_IMAGE.
          image: git.realliance.net/realliance-ops/ci-dispatch:sha-9055e60@sha256:39ab99aa87f2e76dae145c67fb7e75fc5e2490d7de76cea95f1a4582ad7dc3ef
          args:
            - --config=/etc/ci-dispatch/config/config.yaml
          env:
            # Soft heap limit for the Go GC, 3/4 of the memory limit.
            - name: GOMEMLIMIT
              value: 192MiB
            # SQLite temp files and anything else the runtime writes: the root is read-only.
            - name: TMPDIR
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
            - name: usage
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # main serves /healthz before Start, and /healthz reads 200 while Start is in flight (it
          # reads the runners and Jobs, undoes half-made launches, removes orphans) for up to
          # start_budget plus the 100 s wedge margin: 280 s. So this probe passes on its first try once
          # main listens, and its 300 s covers only the time before that (config, ledger open, secrets,
          # keyring, clients). Liveness catches a Start wedged past 280 s, and that limit grows with
          # start_budget by itself: raising start_budget needs no change here.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # A wedge detector, not a health check of the reads. /healthz answers 503 only when a tick
          # has been in flight for over 2 min (its 20 s budget plus the wedge margin), or when no tick
          # has finished within the idle limit (the 5 s interval plus the 2 min wedge limit). Every
          # Forgejo and API call runs under the tick's budget, so an outage, even a hanging one, costs
          # a tick its budget and the tick still finishes. A Forgejo or API outage never restarts the
          # pod; CIDispatchStale covers it. Three misses 30 s apart restart a truly wedged loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Memory: tens of MiB steady (one SQLite file, a few hundred rows a day, one job listing a
          # tick). 48Mi requested keeps node requests low (the nodes sit at 85 %); 256Mi is the cap,
          # with GOMEMLIMIT making the GC work hard before the kernel does. Limits do not count
          # toward the node's memory requests. No CPU limit: the loop is idle most of every 5 s.
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: ledger
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/ci-dispatch/config
              readOnly: true
            - name: keyring
              mountPath: /etc/ci-dispatch/keyring
              readOnly: true
            - name: secrets
              mountPath: /etc/ci-dispatch/secrets
              readOnly: true
            - name: kube
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: ci-dispatch-ledger # pvc.yaml
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          configMap:
            name: ci-dispatch-config # configMapGenerator: hash-suffixed, so a change restarts the pod
        - name: keyring
          configMap:
            name: ci-dispatch-keyring # configMapGenerator: owners.asc + fingerprints.txt
        - name: secrets
          projected:
            defaultMode: 256 # 0400
            sources:
              - secret:
                  name: ci-dispatch-forgejo # SealedSecret forgejo-token.yaml
                  items:
                    - key: forgejo-token
                      path: forgejo-token
              - secret:
                  name: ci-dispatch-usage # SealedSecret usage-token.yaml
                  items:
                    - key: usage-token
                      path: usage-token
        # What the automatic mount would give, with the token's life set: an hour, re-read by the
        # client before it lapses. The CA is the cluster's, from the namespace's kube-root-ca.crt.
        - name: kube
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
