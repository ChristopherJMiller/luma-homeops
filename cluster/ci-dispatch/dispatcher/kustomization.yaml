---
# The dispatcher: a single-replica StatefulSet with a 1Gi ledger on rook-ceph-block-ssd.
# Code: git.realliance.net/realliance-ops/ci-dispatch. Plan: docs/superpowers/plans/2026-11-04-runner-classes-phase-0-1.md.
#
# Not manifests, so not listed: alerts_test.yaml (promtool cases, scripts/test-ci-dispatch-alerts.sh)
# and the *.secret.yaml sources of the two SealedSecrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ci-dispatch
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - forgejo-token.yaml # SealedSecret ci-dispatch-forgejo: the ci-dispatch site-admin token
  - usage-token.yaml # SealedSecret ci-dispatch-usage: the bearer token for the usage API
  - pvc.yaml
  - statefulset.yaml
  - service.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - networkpolicy.yaml
components:
  - ../../components/netpol/default-deny
  - ../../components/netpol/allow-dns
# Both keep kustomize's hash suffix: a config or keyring change rolls the pod.
configMapGenerator:
  - name: ci-dispatch-config
    files:
      - config.yaml
  - name: ci-dispatch-keyring
    files:
      - keyring/owners.asc
      - keyring/fingerprints.txt
