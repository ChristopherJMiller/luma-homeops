---
# ci-dispatch's configuration: the Config of internal/config, in snake_case; unknown keys are
# refused. It becomes the hash-suffixed ConfigMap ci-dispatch-config, so any change here restarts
# the pod. Public: no secret, no Azure id (tenant, client, subscription) and no hidden org, team or
# group name. The two tokens are files under /etc/ci-dispatch/secrets (SealedSecrets
# forgejo-token.yaml and usage-token.yaml); the Azure credential is four files under
# /etc/ci-dispatch/azure (SealedSecret azure-credentials.yaml).
#
# Move a class from dry-run to on only by editing `classes` here and watching the decision log
# for a day (docs/ci.md; for small and medium, the paid section there). dry-run decides, logs and
# counts, and launches nothing; the reaper still runs, on the dispatcher's own names only: ci-tiny
# Jobs, and ci-<class>-<job>-<attempt>-<try> runners and container groups. large has no backend
# in phase 2: config.Load refuses it in any mode but off. This file equals ci-dispatch's
# internal/config/testdata/site-config.yaml apart from the class image digest (F9): change both.
forgejo:
  # The in-cluster Service (Forgejo pods, TCP 3000), never the public name through the router.
  url: http://forgejo-http.forgejo.svc.cluster.local:3000
  public_url: https://git.realliance.net # what the runners dial; this process never does
  token_file: /etc/ci-dispatch/secrets/forgejo-token
inventory:
  # Owner-signed ci.yaml (limits, denies, class modes). The keyring is HERE, not in the inventory,
  # so whoever can change the inventory cannot change who may sign it. It equals forge-bot's.
  repo: realliance-ops/forge
  branch: main
  file: ci.yaml
  keyring: /etc/ci-dispatch/keyring/owners.asc
  fingerprints: /etc/ci-dispatch/keyring/fingerprints.txt
classes:
  # tiny: dry-run from Task 18, on since Task 19. Quote every mode: YAML 1.1 reads a bare on or off as a bool.
  tiny: "on"
  # small and medium: dry-run since phase 2 Task 19, for 24 h before on (E14).
  small: "dry-run"
  medium: "dry-run"
  large: "off"
kube:
  namespace: ci-tiny
  host: https://kubernetes.default.svc
  token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
tiny:
  # The general runner's image, consumed unchanged (runner classes R2); scripts/test_ci_dispatch_manifests.py
  # keeps it equal to cluster/forgejo-runner-general/deployment.yaml.
  image: ghcr.io/christopherjmiller/forgejo-runner-general:sha-f9c09c5@sha256:567175795c431ad68271d20e344d162b5cd975e86c3b0e21c7666424c392ed7f
  runner_config_map: ci-tiny-runner # tiny/runner-config.yaml; unsuffixed, the Job names it
  runner_timeout: 15m # equals runner.timeout in that ConfigMap (a test checks)
  hard_stop: 20m # the Job's activeDeadlineSeconds; the reservation per launch
  # A runner that has not picked up its job after this is torn down and the launch retried.
  # Task 3 measured warm starts at 1.3 s median and 2.4 s worst, so twice that is far below 3 min;
  # the 3 min the spec fixes stays, which also covers the pod's first seconds before the enforcer
  # enrols its IP (netpol-gate, NetworkPolicy plan B2). Task 19 Step 5 may still adjust it.
  pickup: 3m
azure:
  # Phase 2: the paid classes run as Azure Container Instances in westus3 (azure/ci/, terraform
  # Chris applies). The ids are not here (E9): they are the files of the SealedSecret.
  files: /etc/ci-dispatch/azure # tenant-id, client-id, subscription-id, client-secret
  resource_group: rg-realliance-ci # the container groups; the Policy fence and the $85 budget
  region: westus3
  guard_resource_group: rg-realliance-ci-guard # the sweeper; never written by the dispatcher
  sweeper: ci-sweeper # the Logic App whose run history CISweeperStale watches
  poll: 30s # the container group list, at most this often
paid:
  # The class image (images/forgejo-runner-class): digest only, never a tag (F16, T2-N1); the
  # Policy fence refuses anything else. Like every image we build, a merged base bump does not
  # ship it (CLAUDE.md sharp edge 6): CI publishes a new sha-<7> build, and the digest here is
  # re-pinned by hand in its own reviewed commit. Tag sha-4fb0c3b (phase 2 Task 1).
  image: ghcr.io/christopherjmiller/forgejo-runner-class@sha256:fa7be53e5255636efb27c29e833fbaaa4fe9f144fa7ff066adc66bbff2ba2100
  price_max_age: 168h # the last retail prices serve up to 7 days, then paid jobs wait
  classes:
    # runner_timeout equals runner.timeout in images/forgejo-runner-class/runner-<class>.yml (a test
    # checks). The container's own timeout wrapper stops it 5 min before hard_stop, even with galaxy
    # down; the reservation is the hard stop's worst case.
    small: {runner_timeout: 30m, hard_stop: 40m, pickup: 6m}
    medium: {runner_timeout: 45m, hard_stop: 55m, pickup: 6m}
interval: 5s
sweep: 5m
ledger: /data/ledger.db
snapshots: /data/snapshots
listen: ":8080"
usage_listen: ":8081"
usage_token_file: /etc/ci-dispatch/secrets/usage-token
