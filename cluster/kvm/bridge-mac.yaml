---
# kvm-rdp bridge: RDP (TLS + NLA) on 3389, translating to the ES3 KVM's
# HTTPS/websocket API. The ES3's ONLY automated client, and it never logs out
# (ES3 logout is global). Hence exactly one replica, Recreate, no PDB, no HPA,
# no preStop hook. Design: docs/superpowers/specs/2026-10-07-kvm-rdp-deployment-design.md §4.2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvm-rdp-mac
  namespace: kvm
  labels:
    app.kubernetes.io/name: kvm-rdp-mac
    app.kubernetes.io/part-of: kvm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kvm-rdp-mac
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvm-rdp-mac
        app.kubernetes.io/part-of: kvm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kvm-rdp
          # Built and signed by kvm-rdp's CI. On every bump, re-run both verify
          # commands (cosign + gh attestation) from docs/kvm.md; there are no
          # semver tags, so Renovate can't follow it.
          image: ghcr.io/christopherjmiller/kvm-rdp:sha-a58a10d@sha256:97c6734518dc0e39a577ab3b3b535a84842d0a75abbb7a9b00f6fd0a653fa2a9
          args: [--config, /etc/kvm-rdp/config.toml]
          # No env: the image sets MALLOC_ARENA_MAX=2 (the memory figures were
          # measured under it) and the bridge reads nothing but KVM_RDP_CONFIG.
          ports:
            - name: rdp
              containerPort: 3389
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # HTTP probes on the admin port only. Never a TCP probe on 3389: it
          # spends the accept budget (30 per 60 s) and looks like a connection.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          # No CPU limit: throttling shows up as video stalls. Memory limit is
          # interim until the kvm-rdp nightly soak (RSS + 4 + 16 MiB, + 50%);
          # expect ~64Mi.
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              memory: 128Mi
          # No subPath anywhere: a subPath mount never receives Secret updates,
          # and the bridge restarts itself when the certificate changes.
          volumeMounts:
            - name: config
              mountPath: /etc/kvm-rdp
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/kvm-rdp
              readOnly: true
            - name: tls
              mountPath: /run/secrets/kvm-rdp-tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kvm-rdp-mac-config
        - name: secrets
          secret:
            secretName: kvm-rdp-mac
            defaultMode: 0440
        - name: tls
          secret:
            secretName: kvm-rdp-mac-tls
            defaultMode: 0440
---
# Fixed ClusterIP (static band 10.96.0.0/24): rdpgw's pod maps the bridge's
# certificate name, mac-bridge.kvm.chrismiller.xyz, to this address with
# hostAliases. No LoadBalancer or NodePort, ever: nothing outside the cluster
# dials 3389, and the admin port is unauthenticated.
apiVersion: v1
kind: Service
metadata:
  name: kvm-rdp-mac
  namespace: kvm
  labels:
    app.kubernetes.io/name: kvm-rdp-mac
    app.kubernetes.io/part-of: kvm
spec:
  type: ClusterIP
  clusterIP: 10.96.0.50
  selector:
    app.kubernetes.io/name: kvm-rdp-mac
  ports:
    - name: rdp
      port: 3389
      targetPort: rdp
      protocol: TCP
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
