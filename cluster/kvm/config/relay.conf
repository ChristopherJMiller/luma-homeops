# Pod-local relay in front of rdpgw (deployment spec §4.3). It re-checks the
# admin session on /connect against the central oauth2-proxy-admin, so no
# admin-tier secret lives in this namespace, and it is the only process that
# can reach rdpgw (127.0.0.1:8081). Included inside nginx's http {} block.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# :8080, Traefik's backend. Only the two Exact paths reach rdpgw.
server {
  listen 8080;
  server_tokens off;

  # rdpgw's /, /api/v1/*, /metrics, /tokeninfo, /static/*: never via this port.
  location / { return 404; }

  location = /healthz { access_log off; return 200; }

  # Second, pod-local check of the admin tier. 202 continues; 401 returns 401
  # (the edge already redirected browsers to sign in). Don't test $admin in an
  # `if`: `if` runs before auth_request and always sees it empty. rdpgw refuses
  # an empty user header with 401 anyway.
  location = /connect {
    auth_request /_admin;
    auth_request_set $admin $upstream_http_x_auth_request_email;
    proxy_set_header X-Forwarded-User $admin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # RDPGWSESSION never leaves the pod (the Leg C session-cookie bypass).
    proxy_hide_header Set-Cookie;
    proxy_pass http://127.0.0.1:8081;
  }

  # MS-TSGU over websocket. The PAA token is the credential, checked by
  # rdpgw. Every method passes, so a legacy-transport attempt still shows as
  # "Opening RDGOUT" in rdpgw's log (acceptance item 2).
  location = /remoteDesktopGateway/ {
    # An empty value removes the header: no caller can stamp a user here.
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    # nginx's 60 s default would cut a stalled stream.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_hide_header Set-Cookie;
    proxy_pass http://127.0.0.1:8081;
  }

  location = /_admin {
    internal;
    proxy_pass http://oauth2-proxy-admin.oauth2-proxy.svc.cluster.local:4180/oauth2/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-User "";
  }
}

# :9090, for Prometheus and the rdpgw container's liveness probe only. No
# Ingress references it.
server {
  listen 9090;
  server_tokens off;
  location = /metrics { proxy_pass http://127.0.0.1:8081; }
  location / { return 404; }
}
