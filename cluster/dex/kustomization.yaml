---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dex.yaml
  - grpc-tls.yaml
  - config.yaml
  - servicemonitor.yaml
# Our error page, mounted over the image's own (see templates/error.html). Hashed
# name so an edit rolls Dex, which reads templates only at startup.
configMapGenerator:
  - name: dex-templates
    namespace: dex # no kustomization-wide namespace here; without it the name ref to dex.yaml is not rewritten
    files:
      - templates/error.html
