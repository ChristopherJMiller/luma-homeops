---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus
# PrometheusRule CRDs. Prometheus selects every PrometheusRule labelled
# `release: prometheus`, in any namespace (ruleSelector in
# cluster/applications/prometheus-stack.yaml); scripts/check-prometheus-rules.sh
# proves they load. The configMapGenerator below is a legacy path the operator
# does not load; new rules go here as resources, labelled release: prometheus.
resources:
  - media-pipeline-alerts.yaml
  - selftest.yaml
  - ceph-critical-alerts.yaml
  - capacity-alerts.yaml
  - control-plane-alerts.yaml
configMapGenerator:
  - name: luma-homelab-alert-rules
    files:
      - certificate-alerts.yaml
      - rook-ceph-alerts.yaml
      - node-resource-alerts.yaml
      - argocd-alerts.yaml
