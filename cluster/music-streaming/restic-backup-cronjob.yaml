---
# Nightly restic snapshot of gonic's state PVCs (gonic.db + playlists) into
# the shared config-tier repo. The music itself (gonic-music-pvc) is rsync'd
# from lidarr nightly and is NOT backed up — re-syncable.
# Restore: docs/backups.md → "Config volumes".
# Both PVCs are RBD (RWO) -> podAffinity to the gonic pod.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-gonic
  namespace: music-streaming
  labels:
    app.kubernetes.io/name: restic-backup
    backup-tier: config
spec:
  schedule: "40 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-backup
        spec:
          restartPolicy: Never # each attempt keeps its pod (and logs); OnFailure deletes them at backoffLimit
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: gonic
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                  # root without DAC_OVERRIDE cannot read the app's 0600 files
                  # (Plex: .LocalAdminToken). DAC_READ_SEARCH would be the minimal
                  # bypass but PodSecurity baseline (cluster default) rejects it;
                  # DAC_OVERRIDE is baseline-allowed and the mounts are read-only.
                  add: [DAC_OVERRIDE]
              envFrom:
                - secretRef:
                    name: restic-config
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: RESTIC_HOST
                  value: gonic
              command: ["/bin/sh"]
              args:
                - -c
                - |
                  set -eu
                  echo "restic backup $RESTIC_HOST start $(date -u +%FT%TZ)"
                  restic backup /data /playlists \
                    --host "$RESTIC_HOST" --tag gonic --tag config \
                    --retry-lock 15m --no-scan --cleanup-cache
                  restic snapshots --host "$RESTIC_HOST" --latest 1 --compact
                  echo "restic backup $RESTIC_HOST done $(date -u +%FT%TZ)"
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: playlists
                  mountPath: /playlists
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: gonic-data-pvc
                readOnly: true
            - name: playlists
              persistentVolumeClaim:
                claimName: gonic-playlists-pvc
                readOnly: true
            - name: cache
              emptyDir: {}
