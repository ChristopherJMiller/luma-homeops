---
# Immich's database. A normal postgres-operator cluster — which is the point:
# it inherits the nightly logical backup, Patroni, the monitoring sidecar and
# every operational habit the other six clusters already have.
#
# The one difference is spec.dockerImage. Immich >= 3.0 requires the VectorChord
# extension, which stock Spilo does not ship, so this cluster (and ONLY this
# cluster) runs images/spilo-vchord — stock Spilo 16 plus the vchord .deb.
# Every other postgresql CR keeps using the operator's default image, so a bad
# build here cannot reach authentik-style shared infrastructure.
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: acid-immich
  namespace: immich
  labels:
    app: postgresql
    cluster: acid-immich
spec:
  enableLogicalBackup: true # nightly pg_dumpall -> B2, docs/backups.md
  # Pinned by digest-bearing tag from .github/workflows/spilo-vchord.yml.
  dockerImage: ghcr.io/christopherjmiller/spilo-vchord:sha-46fc125@sha256:0f7e4b425bd2047619a0af2ec443c93cad6b382da784b54bed7e8d6440c1dbe9
  databases:
    immich: immich
  numberOfInstances: 2
  spiloRunAsUser: 101
  spiloRunAsGroup: 103
  spiloFSGroup: 103
  postgresql:
    version: '16'
    parameters:
      # SMR spinners: same reasoning as every other cluster here (#2587).
      synchronous_commit: "off"
      # What Immich's DB_STORAGE_TYPE=HDD would set if we ran their Postgres
      # image. We run Spilo, so the tuning goes here: no readahead benefit and
      # an honest seek cost on ST8000DM004 spinners.
      effective_io_concurrency: "1"
      random_page_cost: "4"
      # VectorChord must be preloaded. This list is Spilo's own eight libraries
      # PLUS vchord — if the operator replaces rather than extends the value,
      # dropping any of the first eight silently disables pg_cron/bg_mon/etc.
      # Verified after first start; see docs/immich.md.
      shared_preload_libraries: "bg_mon,pg_stat_statements,pgextwlist,pg_auth_mon,set_user,timescaledb,pg_cron,pg_stat_kcache,vchord"
  patroni:
    failsafe_mode: true
  teamId: acid
  users:
    immich: [superuser, createdb] # CREATE EXTENSION vchord needs superuser
    postgres: []
  volume:
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  sidecars:
    - name: postgres-exporter
      image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
      ports:
        - name: metrics
          containerPort: 9187
          protocol: TCP
      env:
        - name: DATA_SOURCE_URI
          value: localhost:5432/postgres?sslmode=disable
        - name: DATA_SOURCE_USER
          value: postgres
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: postgres.acid-immich.credentials.postgresql.acid.zalan.do
              key: password
        - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
          value: 'true'
