---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - namespace.yaml
  - logical-backup-s3.yaml
  - patroni-restapi.yaml
  - db.yaml
  - oidc.yaml
  - b2.yaml
  - accounts.yaml
  - config.yaml
  - pvcs.yaml
  - psql.yaml
  - extensions-job.yaml
  - backup-cronjob.yaml
  - servicemonitor.yaml
  - valkey-exporter.yaml
patches:
  - target: {kind: SealedSecret, name: patroni-restapi}
    patch: |- # fail-closed dependency of every Spilo pod (D7): never prune it
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: patroni-restapi
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
