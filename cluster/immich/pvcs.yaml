---
# Phone uploads and everything Immich generates from them (thumbnails,
# transcodes, profile images). This is NEW irreplaceable data — the family
# archive at /family is only ever read — so it gets its own nightly mirror to
# B2 (see cluster/immich/backup-cronjob.yaml and docs/backups.md).
#
# CephFS RWX because the server and machine-learning pods both mount it and
# may land on different nodes; an RBD volume would pin them together.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-uploads
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: rook-ceph-fs
  resources:
    requests:
      storage: 500Gi
---
# Downloaded CLIP / face-recognition models. Regenerable — deliberately NOT
# backed up; a fresh pod just re-downloads them.
#
# CephFS RWX for the same reason immich-uploads is, plus one specific to a
# cache: an RWO volume cannot be held by two pods at once, so ANY update
# deadlocked. With one replica maxUnavailable rounds to 0, so k8s kept the old
# pod until the new one was Ready, while the new one sat forever in
# ContainerCreating with "Multi-Attach error" waiting for the volume the old
# pod still held. A ~2 GB read-mostly model cache has no business being
# single-attach. (Immich has no object-storage option here — the ML container
# loads ONNX model files from a POSIX path.)
#
# Superseded immich-ml-cache, which was ReadWriteOnce on rook-ceph-block;
# accessModes and storageClassName are both immutable, hence a new claim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache-fs
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: rook-ceph-fs
  resources:
    requests:
      storage: 10Gi
---
# The family archive, for Immich's external library.
#
# PVCs are namespaced and `family-media` lives in ns media, so Immich cannot
# reference it directly. CephFS is happy to serve the same path to several
# mounts, so this is a second static PV over the same /family directory —
# ReadOnlyMany, because Immich must never write to the archive. Same pattern
# as cluster/backups/satellites-pv.yaml.
#
# volumeHandle must differ from the media-namespace PV or the CSI driver
# treats them as the same volume.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: family-media-immich-ro
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 1Ti
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  storageClassName: ""
  csi:
    driver: rook.cephfs.csi.ceph.com
    volumeHandle: family-media-immich-ro-static
    nodeStageSecretRef:
      name: rook-csi-cephfs-node
      namespace: rook
    volumeAttributes:
      clusterID: rook
      fsName: fs-pool
      staticVolume: "true"
      rootPath: /family
      kernelMountOptions: ms_mode=prefer-crc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: family-media-ro
  namespace: immich
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: family-media-immich-ro
  resources:
    requests:
      storage: 1Ti
