---
# Prometheus metrics for Immich's Valkey.
#
# Immich uses Valkey as its job queue -- the queue depths we watch during an
# archive scan live in here -- and nothing was scraping it. The Redis section of
# the database-storage dashboard (6 panels) was querying redis_* metrics that
# had no source at all: the only Redis ever scraped on this cluster belonged to
# authentik, removed 2026-09-23.
#
# redis_exporter speaks the Redis protocol, which Valkey serves unchanged.
# ghcr rather than Docker Hub, pinned by digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey-exporter
  namespace: immich
  labels:
    app.kubernetes.io/name: valkey-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 59000
        runAsGroup: 59000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/oliver006/redis_exporter:v1.92.0@sha256:ca3abd5f19da6c87e96038ba08aaa3dfaab34dc649834584c4d6880b05952fef
          args:
            - --redis.addr=redis://immich-valkey:6379
            - --web.listen-address=0.0.0.0:9121
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 9121
          livenessProbe:
            httpGet: {path: /health, port: metrics}
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey-exporter
  namespace: immich
  labels:
    app.kubernetes.io/name: valkey-exporter
spec:
  selector:
    app.kubernetes.io/name: valkey-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
---
# `release: prometheus` is mandatory: the Prometheus CR selects on it and a
# monitor without it is silently never scraped.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-valkey-exporter
  namespace: immich
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-exporter
  namespaceSelector:
    matchNames: [immich]
  endpoints:
    - port: metrics
      interval: 30s
