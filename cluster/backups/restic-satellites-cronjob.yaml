---
# Nightly restic snapshot of CephFS /satellites (state the NixOS satellites
# keep over NFS — the one piece of satellite state that isn't in git).
# RWX/ROX CephFS: no node affinity needed.
# Restore: docs/backups.md → "Config volumes".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-satellites
  namespace: backups
  labels:
    app.kubernetes.io/name: restic-backup
    backup-tier: config
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              envFrom:
                - secretRef:
                    name: restic-config
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: RESTIC_HOST
                  value: satellites-cephfs
              command: ["/bin/sh"]
              args:
                - -c
                - |
                  set -eu
                  echo "restic backup $RESTIC_HOST start $(date -u +%FT%TZ)"
                  restic backup /data \
                    --host "$RESTIC_HOST" --tag satellites --tag config \
                    --retry-lock 15m --no-scan --cleanup-cache
                  restic snapshots --host "$RESTIC_HOST" --latest 1 --compact
                  echo "restic backup $RESTIC_HOST done $(date -u +%FT%TZ)"
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: satellites-cephfs-ro
                readOnly: true
            - name: cache
              emptyDir: {}
