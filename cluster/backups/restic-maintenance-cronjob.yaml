---
# Weekly retention + integrity pass on the config-tier restic repo.
# Sunday 05:00 UTC, after the nightly backups (01:00–02:00) are long done —
# forget/prune take an exclusive lock and would otherwise collide.
#
# "Delete" here is soft: the key has no deleteFiles capability, so pruned
# packs become hidden versions the bucket purges 30 days later. That is the
# undo window if this ever forgets too much.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-maintenance
  namespace: backups
  labels:
    app.kubernetes.io/name: restic-backup
    backup-tier: config
spec:
  schedule: "0 5 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-backup
        spec:
          restartPolicy: Never # each attempt keeps its pod (and logs); OnFailure deletes them at backoffLimit
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: ghcr.io/restic/restic:0.19.1@sha256:2f0373803493361f9304a57150d464677f69a9dad487afec202105aafb2592f2
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              envFrom:
                - secretRef:
                    name: restic-config
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
              command: ["/bin/sh"]
              args:
                - -c
                - |
                  set -eu
                  echo "restic maintenance start $(date -u +%FT%TZ)"
                  restic forget --group-by host \
                    --keep-daily 14 --keep-weekly 8 --keep-monthly 12 \
                    --prune --retry-lock 30m
                  # Metadata check every week; read back a rotating 10% of the
                  # data too, so silent corruption surfaces within ~10 weeks.
                  restic check --read-data-subset=10% --retry-lock 30m
                  restic snapshots --compact --group-by host
                  echo "restic maintenance done $(date -u +%FT%TZ)"
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: cache
              emptyDir: {}
