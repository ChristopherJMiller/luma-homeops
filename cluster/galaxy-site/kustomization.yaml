---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: galaxy-site
resources:
  - namespace.yaml
  - site.yaml

# Content as a generated ConfigMap: the hash suffix changes when a page
# changes, which rolls the Deployment. Edit content/*.html and commit.
configMapGenerator:
  - name: galaxy-site-content
    files:
      - content/index.html
      - content/privacy.html
      - content/terms.html
      - content/style.css
