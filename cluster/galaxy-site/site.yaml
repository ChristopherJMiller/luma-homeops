---
# galaxy.chrismiller.xyz — the public face of the cluster: what it is, privacy,
# terms. It exists because Google's OAuth consent screen requires a home page,
# a privacy policy and a terms link, all on an authorized domain, before the
# app can be published out of Testing mode (see docs/auth.md).
#
# Deliberately PUBLIC and ungated: these pages have to be readable by Google's
# reviewers and by someone deciding whether to sign in.
#
# Content is a ConfigMap generated by kustomize from cluster/galaxy-site/content/
# — editing an .html file there and committing is the whole update procedure;
# the generated name changes, which rolls the Deployment automatically.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: galaxy-site
  namespace: galaxy-site
  labels:
    app.kubernetes.io/name: galaxy-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: galaxy-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galaxy-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: public.ecr.aws/docker/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # nginx needs writable scratch space; the root filesystem is not.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: content
          configMap:
            name: galaxy-site-content
        - name: conf
          configMap:
            name: galaxy-site-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: galaxy-site-nginx
  namespace: galaxy-site
data:
  default.conf: |
    server {
      # 8080, not 80: the container runs unprivileged.
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: galaxy-site
  namespace: galaxy-site
spec:
  selector:
    app.kubernetes.io/name: galaxy-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: galaxy-site
  namespace: galaxy-site
spec:
  ingressClassName: traefik
  rules:
    - host: galaxy.chrismiller.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: galaxy-site
                port:
                  number: 80
