---
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: acid-media
  labels:
    app: postgresql
    cluster: acid-media
spec:
  enableLogicalBackup: true # nightly pg_dumpall -> B2, docs/backups.md
  databases:
    postgres: postgres
  numberOfInstances: 2
  spiloRunAsUser: 101
  spiloRunAsGroup: 103
  spiloFSGroup: 103
  postgresql:
    version: '16'
    parameters:
      synchronous_commit: "off"
  patroni:
    failsafe_mode: true
  teamId: acid
  users:
    postgres: []
  volume:
    # 2026-10-04: 0.8 GB live; 200Gi per member would over-promise the ~155 GiB ssd pool.
    size: 20Gi
    storageClass: rook-ceph-block-ssd # #2665: members rebuilt onto the ssd tier one at a time
  sidecars:
    - name: postgres-exporter
      image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1@sha256:a88794758ad461c75f3825b51cde4bde730bdff04b3b24d00efe14217e41f615
      ports:
        - name: metrics
          containerPort: 9187
          protocol: TCP
      env:
        - name: DATA_SOURCE_URI
          value: localhost:5432/postgres?sslmode=disable
        - name: DATA_SOURCE_USER
          value: postgres
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: postgres.acid-media.credentials.postgresql.acid.zalan.do
              key: password
        - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
          value: 'true'
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: /etc/postgres_exporter/queries.yaml
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
