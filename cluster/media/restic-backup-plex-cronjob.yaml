---
# Nightly restic snapshot of the mm-plex-config PVC (Plex library DB,
# metadata, preferences) into the shared config-tier repo.
# Restore: docs/backups.md → "Config volumes".
#
# The live SQLite DB (Plug-in Support/Databases/*.db) may be mid-write when
# captured; Plex's own scheduled DB backups (*.db-YYYY-MM-DD, same dir) are
# consistent and come along, so restore from those if the live copy is torn.
# Cache/ and Logs/ are regenerable and excluded. RWO PVC -> podAffinity to
# the Plex pod.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-plex
  namespace: media
  labels:
    app.kubernetes.io/name: restic-backup
    backup-tier: config
spec:
  schedule: "20 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-backup
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: mm-plex
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                  # root without DAC_OVERRIDE cannot read the app's 0600 files
                  # (Plex: .LocalAdminToken); DAC_READ_SEARCH is the read-only bypass.
                  add: [DAC_READ_SEARCH]
              envFrom:
                - secretRef:
                    name: restic-config
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: RESTIC_HOST
                  value: mm-plex-config
              command: ["/bin/sh"]
              args:
                - -c
                - |
                  set -eu
                  echo "restic backup $RESTIC_HOST start $(date -u +%FT%TZ)"
                  restic backup /data \
                    --host "$RESTIC_HOST" --tag plex --tag config \
                    --exclude '/data/Library/Application Support/Plex Media Server/Cache' \
                    --exclude '/data/Library/Application Support/Plex Media Server/Logs' \
                    --exclude '/data/Library/Application Support/Plex Media Server/Crash Reports' \
                    --exclude '/data/Library/Application Support/Plex Media Server/Plug-in Support/Caches' \
                    --retry-lock 15m --no-scan --cleanup-cache
                  restic snapshots --host "$RESTIC_HOST" --latest 1 --compact
                  echo "restic backup $RESTIC_HOST done $(date -u +%FT%TZ)"
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: mm-plex-config
                readOnly: true
            - name: cache
              emptyDir: {}
