---
# Maintainerr has no authentication of its own and can delete media through
# Sonarr/Radarr, so it sits behind the admin tier only (docs/auth.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maintainerr
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-oauth2-admin-errors@kubernetescrd,oauth2-proxy-oauth2-admin-auth@kubernetescrd,traefik-strip-csp@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: maintainerr.chrismiller.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mm-maintainerr
                port:
                  number: 6246
