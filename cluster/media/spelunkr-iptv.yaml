---
# spelunkr-iptv: an HDHomeRun-style tuner for spelunkr.tv's 24/7 Internet Archive
# channels (git.realliance.net/chris/spelunkr-iptv; deploy/k8s.yaml upstream).
# Plex reaches it by cluster DNS (mm-plex is ClusterFirst, not hostNetwork).
# Plex: Live TV & DVR > Set up > enter the address manually:
#   spelunkr-iptv.media.svc.cluster.local:5004   (guide: XMLTV at <BASE_URL>/guide.xml)
# spelunkr.tv is a small operation: one replica, no load tests, no restart loops.
# If the pod crash-loops, scale it to 0 and investigate. Runbook: docs/media.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spelunkr-iptv-cache
  labels: {app: spelunkr-iptv}
spec:
  # Lineup + versioned playlists, kept so a restart revalidates instead of
  # re-downloading ~40 files from spelunkr.
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spelunkr-iptv
  labels: {app: spelunkr-iptv}
spec:
  # 0 while the e14297f06639 image fails exec (/spelunkr-iptv is 0700 root,
  # the container runs as nonroot). Back to 1 with a fixed image pin.
  replicas: 0 # tuners are in-memory; one replica keeps TUNER_COUNT meaningful
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: spelunkr-iptv}
  template:
    metadata:
      labels: {app: spelunkr-iptv}
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: spelunkr-iptv
          # Pinned to the e14297f build (channel logos); bump tag and digest together.
          image: git.realliance.net/chris/spelunkr-iptv:e14297f06639@sha256:b85f5a56ba818f141845695416f34bec9b4c8bb0d0d6a6d9b09ff437141fdcd6
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5004}
          env:
            # How Plex reaches this service; stream URLs in the lineup are built from it.
            - {name: BASE_URL, value: "http://spelunkr-iptv.media.svc.cluster.local:5004"}
            - {name: TUNER_COUNT, value: "2"}
            - {name: CACHE_DIR, value: /cache}
            # The work is network I/O; two runtime threads are plenty.
            - {name: TOKIO_WORKER_THREADS, value: "2"}
            - {name: RUST_LOG, value: info}
          volumeMounts:
            - {name: cache, mountPath: /cache}
          resources:
            # Measured: ~15 MB idle, ~20 MB with two channels streaming; CPU is mostly TLS on the archive.org download.
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          startupProbe:
            # The first lineup load fetches ~40 small files one second apart; later starts reuse the cache.
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Ready once the lineup is loaded.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: spelunkr-iptv-cache
---
apiVersion: v1
kind: Service
metadata:
  name: spelunkr-iptv
  labels: {app: spelunkr-iptv}
spec:
  selector: {app: spelunkr-iptv}
  ports:
    - {name: http, port: 5004, targetPort: http}
