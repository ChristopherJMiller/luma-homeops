---
# One wildcard certificate for every public hostname, served by Traefik as
# its default (see tlsstore.yaml). Ingresses need no `spec.tls` and apps
# need no per-host Certificate: a new public app is one Ingress with a host.
#
# DNS-01 via the same Cloudflare token cert-manager already uses, so every
# zone here must be in that account. The nested wildcard is for
# dav.music.chrismiller.xyz — `*.chrismiller.xyz` only matches one label.
# werethemille.rs and buttert.art were added 2026-09-24 when they came under
# terraform (cloudflare/dns/); a host in either zone now serves valid TLS with
# no per-app Certificate, same as the other two.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: traefik
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: '*.chrismiller.xyz'
  dnsNames:
    - chrismiller.xyz
    - '*.chrismiller.xyz'
    - '*.music.chrismiller.xyz'
    # mcp.family.chrismiller.xyz — the Gramps MCP endpoint. A TLS wildcard covers
    # exactly one label, so *.chrismiller.xyz does NOT match a nested name; DNS
    # wildcards do match multiple labels, which is why the name resolves already.
    # Same reason *.music.chrismiller.xyz is here for dav.music.
    - '*.family.chrismiller.xyz'
    - realliance.net
    - '*.realliance.net'
    - werethemille.rs
    - '*.werethemille.rs'
    - buttert.art
    - '*.buttert.art'
  privateKey:
    rotationPolicy: Always
