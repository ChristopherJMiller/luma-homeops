---
argo-cd:
  global:
    domain: ci.chrismiller.xyz
    addPrometheusAnnotations: true
    statusbadge.enabled: true
  configs:
    repositories:
      luma-homeops:
        url: https://github.com/ChristopherJMiller/luma-homeops
    clusterCredentials:
      default:
        server: https://kubernetes.default.svc
        config: {}
    cm:
      timeout.reconciliation: 180s
      timeout.hard.reconciliation: 300s
  controller:
    replicas: 1
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: argo-cd
        selector:
          release: prometheus
  dex:
    # Unused: argocd-cm has no dex.config, so nothing logs in through it (SSO
    # for apps is the separate Dex in ns `dex`). Since the 2026-10-27 node
    # rebuilds it segfaulted (exit 139) on every start.
    enabled: false
  redis:
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 150m
        memory: 128Mi
    exporter:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 64Mi
  server:
    pdb:
      enabled: true
      minAvailable: 1
    service:
      # Traefik reaches the argo-cd backend over TLS (self-signed HTTPS;
      # serversTransport.insecureSkipVerify is set chart-wide).
      annotations:
        traefik.ingress.kubernetes.io/service.serversscheme: https
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 256Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: argo-cd
        selector:
          release: prometheus
    ingress:
      enabled: true
      ingressClassName: traefik
  repoServer:
    # Fixed at 2, never 1: with 1 replica, pdb minAvailable: 1 would block
    # every drain.
    autoscaling:
      enabled: false
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    # The copyutil init container inherits this block, so the pod's effective
    # request drops too. 256Mi is Chris's call: p95 <= 239 Mi, with spikes to
    # 397 Mi during manifest renders, which the 1Gi limit covers.
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 10m
        memory: 256Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: argo-cd
        selector:
          release: prometheus
  applicationSet:
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 200m
        memory: 128Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: argo-cd
        selector:
          release: prometheus
  notifications:
    enabled: false
