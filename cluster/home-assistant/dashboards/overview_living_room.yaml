# =====================================================================
# ROOM PAGES — same grid grammar as Home: gutter-centered named areas,
# hero band + chips, lights column (4 tracks) + side column (2 tracks),
# single column ≤800px. Amber = state accent only.
# =====================================================================
title: Living Room
type: custom:grid-layout
layout:
  grid-template-columns: minmax(16px, 1fr) repeat(6, minmax(0, 185px)) minmax(16px, 1fr)
  grid-gap: 12px
  margin: 12px 0 28px
  grid-template-areas: |
    ". hero hero hero hero hero hero ."
    ". lights lights lights lights side side ."
    ". ent ent ent ent ent ent ."
  mediaquery:
    "(max-width: 800px)":
      grid-template-columns: minmax(0, 1fr)
      grid-gap: 10px
      margin: 8px 10px 24px
      grid-template-areas: |
        "hero"
        "lights"
        "side"
        "ent"
cards:
- type: vertical-stack
  view_layout:
    grid-area: hero
  cards:
    - type: custom:mushroom-template-card
      primary: Living Room
      secondary: >-
        {{ states('sensor.living_room_temperature') }}° · {{ states('sensor.living_room_humidity') }}%
        · {{ expand('light.living_room_all') | selectattr('state','eq','on') | list | count }} lights on
      icon: mdi:sofa
      icon_color: amber
      card_mod: {class: roomhero}
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          content: All on
          icon: mdi:lightbulb-group
          tap_action:
            action: call-service
            service: light.turn_on
            target:
              entity_id: light.living_room_all
        - type: template
          content: All off
          icon: mdi:lightbulb-group-off
          tap_action:
            action: call-service
            service: light.turn_off
            target:
              entity_id: light.living_room_all
        # whole-home adaptive lighting master (amber when adapting)
        - type: template
          entity: switch.circadian_adaptive_lighting_circadian
          content: Adaptive
          icon: mdi:sun-clock
          icon_color: "{{ 'amber' if is_state('switch.circadian_adaptive_lighting_circadian','on') else '' }}"
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.circadian_adaptive_lighting_circadian
- type: vertical-stack
  view_layout:
    grid-area: lights
  cards:
    - type: custom:mushroom-title-card
      title: Lights
    - type: custom:mushroom-light-card
      entity: light.living_room_all
      name: All Lights
      show_brightness_control: true
      use_light_color: true
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-light-card
          entity: light.floor_lamp_a
          show_brightness_control: true
          use_light_color: true
        - type: custom:mushroom-light-card
          entity: light.floor_lamp_b
          show_brightness_control: true
          use_light_color: true
        - type: custom:mushroom-light-card
          entity: light.ground_spot
          show_brightness_control: true
          use_light_color: true
        - type: custom:mushroom-light-card
          entity: light.sidetable_lamp
          show_brightness_control: true
        - type: custom:mushroom-light-card
          entity: light.desk_underlight
          show_brightness_control: true
          use_light_color: true
        - type: custom:mushroom-light-card
          entity: light.bookshelf_lamp
          icon: mdi:bookshelf
    # Room modes: Auto = adaptive lighting; a scene holds until Auto (lighting.yaml).
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          content: Auto
          icon: mdi:sun-clock
          icon_color: "{{ 'amber' if is_state('input_select.living_room_light_mode', 'Auto') else 'disabled' }}"
          tap_action:
            action: perform-action
            perform_action: script.room_auto
            data:
              room: living_room
        - type: template
          content: Bright
          icon: mdi:brightness-7
          icon_color: "{{ 'amber' if is_state('input_select.living_room_light_mode', 'Bright') else 'disabled' }}"
          tap_action:
            action: perform-action
            perform_action: script.room_scene
            data:
              room: living_room
              scene: Bright
        - type: template
          content: Relax
          icon: mdi:sofa-single
          icon_color: "{{ 'amber' if is_state('input_select.living_room_light_mode', 'Relax') else 'disabled' }}"
          tap_action:
            action: perform-action
            perform_action: script.room_scene
            data:
              room: living_room
              scene: Relax
        - type: template
          content: Movie
          icon: mdi:movie-open
          icon_color: "{{ 'amber' if is_state('input_select.living_room_light_mode', 'Movie') else 'disabled' }}"
          tap_action:
            action: perform-action
            perform_action: script.room_scene
            data:
              room: living_room
              scene: Movie
        - type: template
          content: Read
          icon: mdi:book-open-variant
          icon_color: "{{ 'amber' if is_state('input_select.living_room_light_mode', 'Read') else 'disabled' }}"
          tap_action:
            action: perform-action
            perform_action: script.room_scene
            data:
              room: living_room
              scene: Read
- type: vertical-stack
  view_layout:
    grid-area: side
  cards:
    - type: custom:mushroom-title-card
      title: Climate
    # The climate brain (packages/climate.yaml): pause it, see what it thinks, and why.
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          entity: input_boolean.climate_auto
          content: "{{ 'Climate Auto' if is_state('input_boolean.climate_auto', 'on') else 'Climate paused' }}"
          icon: mdi:thermostat-auto
          icon_color: "{{ 'amber' if is_state('input_boolean.climate_auto', 'on') else 'disabled' }}"
          tap_action:
            action: toggle
        # The schedule HA writes to the ecobee: the comfort and its heat-cool pair.
        - type: template
          entity: sensor.climate_comfort
          content: >-
            {% set c = states('sensor.climate_comfort') %}
            {% set pairs = {'Home': ['input_number.comfort_home_heat', 'input_number.comfort_home_cool'],
                            'Sleep': ['input_number.comfort_sleep_heat', 'input_number.comfort_sleep_cool'],
                            'Away': ['input_number.comfort_away_heat', 'input_number.comfort_away_cool']} %}
            {% if c in pairs %}{{ c }} {{ '%g' | format(states(pairs[c][0]) | float(0)) }}–{{ '%g' | format(states(pairs[c][1]) | float(0)) }}°{% else %}Schedule unknown{% endif %}
          icon: "{{ {'Away': 'mdi:home-export-outline', 'Sleep': 'mdi:weather-night'}.get(states('sensor.climate_comfort'), 'mdi:home-thermometer') }}"
          icon_color: "{{ 'amber' if is_state('input_boolean.climate_auto', 'on') else 'disabled' }}"
        - type: template
          entity: binary_sensor.window_insert_installed
          content: "Insert {{ 'in' if is_state('binary_sensor.window_insert_installed', 'on') else 'out' }}"
          icon: mdi:window-shutter-open
          icon_color: "{{ 'amber' if is_state('binary_sensor.window_insert_installed', 'on') else 'disabled' }}"
        - type: template
          entity: sensor.airnow_air_quality_index
          content: "AQI {{ states('sensor.airnow_air_quality_index') }}"
          icon: mdi:air-filter
          icon_color: >-
            {% set a = states('sensor.airnow_air_quality_index') | float(none) %}
            {% set limit = states('input_number.aqi_limit') | float(100) %}
            {{ 'disabled' if a is none else ('red' if a > limit else ('amber' if a > 50 else 'green')) }}
        # Climate won't command the AC: unreachable (cloud) or switched to °C. Only while
        # the insert is in: in winter the AC is unplugged on purpose.
        - type: conditional
          conditions:
            - entity: binary_sensor.window_insert_installed
              state: "on"
            - entity: binary_sensor.ac_ready
              state: "off"
          chip:
            type: template
            entity: climate.portable_air_conditioner
            content: AC not ready
            icon: mdi:air-conditioner
            icon_color: red
    - type: custom:mushroom-template-card
      entity: sensor.free_cooling_status
      primary: "Free cooling: {{ states('sensor.free_cooling_status') }}"
      secondary: >-
        Δ {{ '%g' | format(states('input_number.free_cooling_delta') | float(0)) }}° · floor {{ '%g' | format(states('input_number.free_cooling_floor') | float(0)) }}°
        · AQI ≤ {{ states('input_number.aqi_limit') | int(0) }} · AC −{{ states('input_number.ac_setpoint_offset') | int(0) }}° · heat +{{ states('input_number.heat_setpoint_offset') | int(0) }}°
      icon: "{% set s = states('sensor.free_cooling_status') %}{{ {'running': 'mdi:fan', 'smoke': 'mdi:smoke', 'insert out': 'mdi:window-closed-variant', 'paused': 'mdi:pause-circle-outline'}.get(s, 'mdi:fan-off') }}"
      icon_color: "{{ 'amber' if is_state('sensor.free_cooling_status', 'running') else ('red' if is_state('sensor.free_cooling_status', 'smoke') else 'disabled') }}"
    - type: custom:mushroom-climate-card
      entity: climate.living_room
      show_temperature_control: true
      collapsible_controls: true
    - type: custom:mushroom-climate-card
      entity: climate.portable_air_conditioner
      name: A/C
      icon: mdi:air-conditioner
      collapsible_controls: true
    # The real heat: SmartRent's wall thermostat, which climate runs while the ecobee calls for heat.
    - type: custom:mushroom-climate-card
      entity: climate.living_room_thermostat
      name: Heat
      icon: mdi:radiator
      collapsible_controls: true
    - type: custom:mushroom-entity-card
      entity: switch.vent_fan_switch
      name: Vent Fan
      icon: mdi:fan
      tap_action:
        action: toggle
    - type: custom:mushroom-template-card
      entity: switch.floor_fan
      primary: Floor Fan
      secondary: >-
        {% set onoff = 'On' if is_state('switch.floor_fan', 'on') else 'Off' %}
        {% if is_state('binary_sensor.octoprint_printing', 'on') and is_state('switch.floor_fan', 'off') %}Paused for print
        {% elif is_state('timer.floor_fan_manual_hold', 'active') %}{{ onoff }} · by hand until {{ as_timestamp(state_attr('timer.floor_fan_manual_hold', 'finishes_at')) | timestamp_custom('%-I:%M %p') }}
        {% else %}{{ onoff }} · ecobee schedule{% endif %}
      icon: mdi:fan
      icon_color: "{{ 'blue' if is_state('switch.floor_fan', 'on') else 'disabled' }}"
      tap_action:
        action: toggle
    - type: custom:mushroom-entity-card
      entity: switch.camp_lamp
      name: Camp Lamp
      icon: mdi:lamp
      tap_action:
        action: toggle
    - type: custom:mushroom-cover-card
      entity: cover.plant_blinds
      name: Plant Blinds
      show_tilt_position_control: true
- type: vertical-stack
  view_layout:
    grid-area: ent
  cards:
    - type: custom:mushroom-title-card
      title: Entertainment
    - type: custom:mushroom-light-card
      entity: light.tv_accent
      show_brightness_control: true
      use_light_color: true
      icon: mdi:television-ambient-light
    - type: custom:mushroom-entity-card
      entity: sensor.plex_chrismiller_xyz
      name: Plex Server
      icon: mdi:plex
