# =====================================================================
# ROOM PAGES — same grid grammar as Home: gutter-centered named areas,
# hero band + chips, lights column (4 tracks) + side column (2 tracks),
# single column ≤800px. Amber = state accent only.
# =====================================================================
title: Living Room
type: custom:grid-layout
layout:
  grid-template-columns: minmax(16px, 1fr) repeat(6, minmax(0, 185px)) minmax(16px, 1fr)
  grid-gap: 12px
  margin: 12px 0 28px
  grid-template-areas: |
    ". hero hero hero hero hero hero ."
    ". lights lights lights lights side side ."
    ". ent ent ent ent ent ent ."
  mediaquery:
    "(max-width: 800px)":
      grid-template-columns: minmax(0, 1fr)
      grid-gap: 10px
      margin: 8px 10px 24px
      grid-template-areas: |
        "hero"
        "lights"
        "side"
        "ent"
cards:
- type: vertical-stack
  view_layout:
    grid-area: hero
  cards:
    - type: custom:mushroom-template-card
      primary: Living Room
      secondary: >-
        {{ states('sensor.living_room_temperature') }}° · {{ states('sensor.living_room_humidity') }}%
        · {{ expand('light.living_room', 'light.sidetable_lamp', 'light.desk_underlight')
             | selectattr('state','eq','on') | list | count }} lights on
      icon: mdi:sofa
      icon_color: amber
      card_mod: {class: roomhero}
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          content: All on
          icon: mdi:lightbulb-group
          tap_action:
            action: call-service
            service: light.turn_on
            target:
              entity_id:
                - light.living_room
                - light.sidetable_lamp
                - light.desk_underlight
        - type: template
          content: All off
          icon: mdi:lightbulb-group-off
          tap_action:
            action: call-service
            service: light.turn_off
            target:
              entity_id:
                - light.living_room
                - light.tv
                - light.sidetable_lamp
                - light.desk_underlight
        # whole-home adaptive lighting master (amber when adapting)
        - type: template
          entity: switch.circadian_adaptive_lighting_circadian
          content: Adaptive
          icon: mdi:sun-clock
          icon_color: "{{ 'amber' if is_state('switch.circadian_adaptive_lighting_circadian','on') else '' }}"
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.circadian_adaptive_lighting_circadian
- type: vertical-stack
  view_layout:
    grid-area: lights
  cards:
    - type: custom:mushroom-title-card
      title: Lights
    - type: custom:mushroom-light-card
      entity: light.living_room
      name: All Hue
      show_brightness_control: true
      use_light_color: true
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-light-card
          entity: light.floor_lamp_a
          show_brightness_control: true
          use_light_color: true
        - type: custom:mushroom-light-card
          entity: light.floor_lamp_b
          show_brightness_control: true
          use_light_color: true
        - type: custom:mushroom-light-card
          entity: light.ground_spot
          show_brightness_control: true
          use_light_color: true
        - type: custom:mushroom-light-card
          entity: light.sidetable_lamp
          show_brightness_control: true
        - type: custom:mushroom-light-card
          entity: light.desk_underlight
          show_brightness_control: true
          use_light_color: true
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          content: Bright
          icon: mdi:brightness-7
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.living_room_bright
        - type: template
          content: Relax
          icon: mdi:sofa
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.living_room_relax
        - type: template
          content: Movie
          icon: mdi:movie
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.living_room_dimmed
        - type: template
          content: Read
          icon: mdi:book-open-variant
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.living_room_read
- type: vertical-stack
  view_layout:
    grid-area: side
  cards:
    - type: custom:mushroom-title-card
      title: Climate
    - type: custom:mushroom-climate-card
      entity: climate.living_room
      show_temperature_control: true
      collapsible_controls: true
    - type: custom:mushroom-climate-card
      entity: climate.air_conditioner
      name: A/C
      icon: mdi:air-conditioner
      collapsible_controls: true
    - type: custom:mushroom-entity-card
      entity: switch.vent_fan_switch
      name: Vent Fan
      icon: mdi:fan
      tap_action:
        action: toggle
    - type: custom:mushroom-entity-card
      entity: switch.floor_fan
      name: Floor Fan
      icon: mdi:fan
      tap_action:
        action: toggle
    - type: custom:mushroom-entity-card
      entity: switch.camp_lamp
      name: Camp Lamp
      icon: mdi:lamp
      tap_action:
        action: toggle
    - type: custom:mushroom-cover-card
      entity: cover.plant_blinds
      name: Plant Blinds
      show_tilt_position_control: true
- type: vertical-stack
  view_layout:
    grid-area: ent
  cards:
    - type: custom:mushroom-title-card
      title: Entertainment
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-light-card
          entity: light.tv
          show_brightness_control: true
          use_light_color: true
          icon: mdi:television
        - type: custom:mushroom-light-card
          entity: light.tv_accent
          show_brightness_control: true
          use_light_color: true
          icon: mdi:television-ambient-light
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          content: TV Bright
          icon: mdi:brightness-7
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.tv_bright
        - type: template
          content: TV Movie
          icon: mdi:movie
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.tv_dimmed
        - type: template
          content: Ambient
          icon: mdi:lava-lamp
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.tv_cozy_dani
    - type: custom:mushroom-entity-card
      entity: sensor.plex_chrismiller_xyz
      name: Plex Server
      icon: mdi:plex
