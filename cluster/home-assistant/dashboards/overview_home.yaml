# =====================================================================
# HOME — warm-minimal glance. Deterministic 6-track grid via layout-card
# (named areas; collapses to one column ≤800px). The logic lives in
# packages/overview_brain.yaml — this view only displays those entities.
# =====================================================================
title: Home
type: custom:grid-layout
layout:
  # Outer 1fr tracks are gutters — they center the 6 content tracks
  # (layout-card ignores max-width/margin:auto, so centering lives in
  # the grid definition itself).
  grid-template-columns: minmax(16px, 1fr) repeat(6, minmax(0, 185px)) minmax(16px, 1fr)
  grid-gap: 12px
  margin: 12px 0 28px
  grid-template-areas: |
    ". hero hero hero hero hero hero ."
    ". today today today agenda agenda agenda ."
    ". playing playing playing reminders reminders reminders ."
    ". rooms rooms rooms rooms rooms rooms ."
    ". room-lr room-lr room-br room-br room-kt room-kt ."
  mediaquery:
    "(max-width: 800px)":
      grid-template-columns: minmax(0, 1fr)
      grid-gap: 10px
      margin: 8px 10px 24px
      grid-template-areas: |
        "hero"
        "today"
        "agenda"
        "playing"
        "reminders"
        "rooms"
        "room-lr"
        "room-br"
        "room-kt"
cards:
# ---------- HERO: outfit verdict + weather + sun times (one tight band;
#            horizon-card is too tall at grid width — times live in the
#            secondary line instead) ----------
- type: vertical-stack
  view_layout:
    grid-area: hero
  cards:
    - type: custom:mushroom-template-card
      primary: "{{ states('sensor.outfit_advice') }}"
      secondary: >-
        {{ states('sensor.current_city') }}  ·  {{ states('sensor.active_temperature') }}°
        {%- set w = states('weather.forecast_home') %}
        {%- set labels = {'clear-night': 'Clear night', 'cloudy': 'Cloudy', 'exceptional': 'Exceptional', 'fog': 'Fog',
          'hail': 'Hail', 'lightning': 'Lightning', 'lightning-rainy': 'Thunderstorms', 'partlycloudy': 'Partly cloudy',
          'pouring': 'Pouring', 'rainy': 'Rainy', 'snowy': 'Snowy', 'snowy-rainy': 'Sleet', 'sunny': 'Sunny',
          'windy': 'Windy', 'windy-variant': 'Windy'} %}
        {{ labels.get(w, w | replace('-', ' ') | capitalize) }}
        ·  ↑ {{ as_timestamp(state_attr('sun.sun','next_rising')) | timestamp_custom('%-I:%M %p') }}
        ·  ↓ {{ as_timestamp(state_attr('sun.sun','next_setting')) | timestamp_custom('%-I:%M %p') }}
      icon: >-
        {% set c = states('weather.forecast_home') %}
        {% set m = {'sunny':'mdi:weather-sunny','clear-night':'mdi:weather-night',
        'cloudy':'mdi:weather-cloudy','partlycloudy':'mdi:weather-partly-cloudy',
        'rainy':'mdi:weather-rainy','pouring':'mdi:weather-pouring',
        'snowy':'mdi:weather-snowy','fog':'mdi:weather-fog','windy':'mdi:weather-windy'} %}
        {{ m.get(c, 'mdi:weather-partly-cloudy') }}
      icon_color: amber
      card_mod:
        style: |
          ha-card {
            background:
              radial-gradient(130% 200% at 10% -20%, rgba(221,161,94,0.22), transparent 60%),
              var(--card-background-color);
            border-radius: 24px;
            --mush-icon-size: 52px;
          }
          mushroom-shape-icon { --shape-color: transparent; }
          mushroom-state-info $ .primary { font-size: 22px; font-weight: 700; }
          mushroom-state-info $ .secondary { font-size: 14px; }
    # ---------- TODAY: transit (work days only) + mail ----------
    # Household chips: guest mode, the climate brain's verdict, air quality.
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          entity: input_boolean.guest_mode
          content: "{{ 'Guests' if is_state('input_boolean.guest_mode', 'on') else 'No guests' }}"
          icon: mdi:account-multiple
          icon_color: "{{ 'amber' if is_state('input_boolean.guest_mode', 'on') else 'disabled' }}"
          tap_action:
            action: toggle
        - type: template
          entity: sensor.free_cooling_status
          content: "Climate · {{ states('sensor.free_cooling_status') }}"
          icon: "{% set s = states('sensor.free_cooling_status') %}{{ {'running': 'mdi:fan', 'smoke': 'mdi:smoke', 'insert out': 'mdi:window-closed-variant', 'paused': 'mdi:pause-circle-outline'}.get(s, 'mdi:fan-off') }}"
          icon_color: "{{ 'amber' if is_state('sensor.free_cooling_status', 'running') else ('red' if is_state('sensor.free_cooling_status', 'smoke') else 'disabled') }}"
          tap_action:
            action: navigate
            navigation_path: /home-ops/1
        - type: template
          entity: sensor.airnow_air_quality_index
          content: "AQI {{ states('sensor.airnow_air_quality_index') }}"
          icon: mdi:air-filter
          icon_color: >-
            {% set a = states('sensor.airnow_air_quality_index') | float(0) %}
            {{ 'red' if a > 100 else ('amber' if a > 50 else 'green') }}
    # Only while printing.
    - type: conditional
      conditions:
        - condition: state
          entity: binary_sensor.octoprint_printing
          state: "on"
      card:
        type: custom:mushroom-template-card
        primary: "Printing · {{ states('sensor.octoprint_job_percentage') | int(0) }}%"
        secondary: >-
          {{ states('sensor.octoprint_current_file') }}
          {% set t = states('sensor.octoprint_estimated_finish_time') %}
          {% if t not in ['unknown', 'unavailable'] %}· done {{ as_timestamp(t) | timestamp_custom('%-I:%M %p') }}{% endif %}
        icon: mdi:printer-3d-nozzle
        icon_color: amber
        tap_action:
          action: more-info
          entity: binary_sensor.octoprint_printing
- type: vertical-stack
  view_layout:
    grid-area: today
  cards:
    - type: custom:mushroom-title-card
      title: Today
    - type: conditional
      conditions:
        - condition: state
          entity: binary_sensor.show_commute
          state: "on"
      card:
        type: custom:mushroom-template-card
        primary: "{{ states('sensor.commute_transit') }}"
        secondary: >-
          ~{% if is_state('sensor.current_city','Toronto') %}40{% else %}50{% endif %} min to the office
        icon: mdi:subway-variant
        icon_color: amber
        card_mod:
          style: |
            ha-card { border-radius: 20px; }
            mushroom-shape-icon { --shape-color: transparent; }
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        # front door — amber only when unlocked (state is the accent)
        - type: template
          entity: lock.front_door_lock
          content: "{{ 'Locked' if is_state('lock.front_door_lock','locked') else 'Unlocked' }}"
          icon: "{{ 'mdi:lock' if is_state('lock.front_door_lock','locked') else 'mdi:lock-open-variant' }}"
          icon_color: "{{ '' if is_state('lock.front_door_lock','locked') else 'amber' }}"
          tap_action:
            action: more-info
        # mail_and_packages was reconfigured — hello_chrismiller_xyz_* is
        # the live entity set (the old mail_* set is dead duplicates)
        - type: entity
          entity: sensor.hello_chrismiller_xyz_mail_usps_mail
          icon: mdi:mailbox
        - type: entity
          entity: sensor.hello_chrismiller_xyz_mail_amazon_packages
          icon: mdi:package
        - type: entity
          entity: sensor.hello_chrismiller_xyz_mail_amazon_packages_delivered
          icon: mdi:package-check
# ---------- AGENDA ----------
- type: vertical-stack
  view_layout:
    grid-area: agenda
  cards:
    - type: custom:mushroom-title-card
      title: Agenda
    - type: custom:calendar-card-pro
      entities:
        - entity: calendar.cmiller548_gmail_com
          color: '#DDA15E'
        - entity: calendar.family
          color: '#96A884'
        - entity: calendar.chris_is_not_in_seattle_calendar
          label: ✈️
          color: '#C2703D'
        - entity: calendar.birthdays
          label: 🎂
          color: '#C79BD6'
      days_to_show: 5
      compact_events_to_show: 4
      card_mod:
        style: "ha-card { border-radius: 22px; }"
# ---------- NOW PLAYING (Plex creates per-client players dynamically;
#            scan the domain instead of hardcoding entity_ids) ----------
- type: vertical-stack
  view_layout:
    grid-area: playing
  cards:
    - type: custom:mushroom-title-card
      title: Now Playing
    - type: custom:mushroom-template-card
      primary: >-
        {% set p = (states.media_player | selectattr('state','eq','playing') | list
          + states.media_player | selectattr('state','eq','paused') | list)
          | first | default(none) %}
        {% if p %}{{ p.attributes.media_title | default(p.name) }}{% else %}Nothing playing{% endif %}
      secondary: >-
        {% set p = (states.media_player | selectattr('state','eq','playing') | list
          + states.media_player | selectattr('state','eq','paused') | list)
          | first | default(none) %}
        {% if p %}{% set sub = p.attributes.media_series_title | default(p.attributes.media_artist | default('')) %}{{ (sub ~ ' · ') if sub else '' }}{{ p.state | title }}{% else %}Plex is quiet{% endif %}
      icon: mdi:plex
      icon_color: >-
        {% if states.media_player | selectattr('state','eq','playing') | list | count > 0 %}amber{% endif %}
      picture: >-
        {% set p = (states.media_player | selectattr('state','eq','playing') | list
          + states.media_player | selectattr('state','eq','paused') | list)
          | first | default(none) %}
        {{ p.attributes.entity_picture | default('') if p else '' }}
      card_mod:
        style: |
          ha-card { border-radius: 22px; }
          mushroom-shape-icon { --shape-color: transparent; }
# ---------- REMINDERS ----------
- type: vertical-stack
  view_layout:
    grid-area: reminders
  cards:
    - type: custom:mushroom-title-card
      title: Reminders
    - type: todo-list
      entity: todo.shopping_list
      hide_completed: true
      hide_create: true
      card_mod:
        style: |
          ha-card {
            border-radius: 22px;
            max-height: 320px;
            overflow-y: auto;
          }
# ---------- ROOMS (drill-down) ----------
- type: custom:mushroom-title-card
  title: Rooms
  view_layout:
    grid-area: rooms
- type: custom:mushroom-template-card
  view_layout:
    grid-area: room-lr
  primary: Living Room
  secondary: "{{ states('sensor.living_room_temperature') }}° · {{ states('sensor.living_room_humidity') }}%"
  icon: mdi:sofa
  icon_color: amber
  tap_action:
    action: navigate
    navigation_path: /home-ops/1
  card_mod: {class: roomtile}
- type: custom:mushroom-template-card
  view_layout:
    grid-area: room-br
  primary: Bedroom
  secondary: "{{ states('sensor.bedroom_temperature') }}° · {{ states('sensor.bedroom_humidity') }}%"
  icon: mdi:bed
  icon_color: amber
  tap_action:
    action: navigate
    navigation_path: /home-ops/2
  card_mod: {class: roomtile}
- type: custom:mushroom-template-card
  view_layout:
    grid-area: room-kt
  primary: Kitchen
  secondary: >-
    Underlight {{ 'on' if is_state('light.kitchen_all', 'on') else 'off' }}
    · {{ 'Leak!' if is_state('binary_sensor.kitchen_sink_leak_sensor', 'on')
          or is_state('binary_sensor.water_heater_leak_sensor', 'on') else 'Dry' }}
  icon: mdi:silverware-fork-knife
  icon_color: >-
    {{ 'red' if is_state('binary_sensor.kitchen_sink_leak_sensor', 'on')
              or is_state('binary_sensor.water_heater_leak_sensor', 'on')
       else ('amber' if is_state('light.kitchen_all', 'on') else 'disabled') }}
  tap_action:
    action: navigate
    navigation_path: /home-ops/3
  card_mod: {class: roomtile}
