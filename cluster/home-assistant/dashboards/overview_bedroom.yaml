title: Bedroom
type: custom:grid-layout
layout:
  grid-template-columns: minmax(16px, 1fr) repeat(6, minmax(0, 185px)) minmax(16px, 1fr)
  grid-gap: 12px
  margin: 12px 0 28px
  grid-template-areas: |
    ". hero hero hero hero hero hero ."
    ". lights lights lights lights side side ."
  mediaquery:
    "(max-width: 800px)":
      grid-template-columns: minmax(0, 1fr)
      grid-gap: 10px
      margin: 8px 10px 24px
      grid-template-areas: |
        "hero"
        "lights"
        "side"
cards:
- type: vertical-stack
  view_layout:
    grid-area: hero
  cards:
    - type: custom:mushroom-template-card
      primary: Bedroom
      secondary: >-
        {{ states('sensor.bedroom_temperature') }}° · {{ states('sensor.bedroom_humidity') }}%
        · {{ expand('light.bedroom_all') | selectattr('state','eq','on') | list | count }} lights on
      icon: mdi:bed
      icon_color: amber
      card_mod: {class: roomhero}
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          content: All on
          icon: mdi:lightbulb-group
          tap_action:
            action: call-service
            service: light.turn_on
            target:
              entity_id: light.bedroom_all
        - type: template
          content: All off
          icon: mdi:lightbulb-group-off
          tap_action:
            action: call-service
            service: light.turn_off
            target:
              entity_id: light.bedroom_all
        - type: template
          entity: switch.circadian_adaptive_lighting_circadian
          content: Adaptive
          icon: mdi:sun-clock
          icon_color: "{{ 'amber' if is_state('switch.circadian_adaptive_lighting_circadian','on') else '' }}"
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.circadian_adaptive_lighting_circadian
        # adaptive-lighting sleep mode: 1% @ 1000K on the managed lamps
        - type: template
          entity: switch.adaptive_lighting_circadian_adaptive_lighting_sleep_mode_circadian
          content: Sleep
          icon: mdi:power-sleep
          icon_color: "{{ 'amber' if is_state('switch.adaptive_lighting_circadian_adaptive_lighting_sleep_mode_circadian','on') else '' }}"
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.adaptive_lighting_circadian_adaptive_lighting_sleep_mode_circadian
- type: vertical-stack
  view_layout:
    grid-area: lights
  cards:
    - type: custom:mushroom-title-card
      title: Lights
    - type: custom:mushroom-light-card
      entity: light.bedroom_all
      name: All Lights
      show_brightness_control: true
      use_light_color: true
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-light-card
          entity: light.dresser_lamp
          show_brightness_control: true
          use_light_color: true
        - type: custom:mushroom-light-card
          entity: light.floor_lamp
          show_brightness_control: true
          use_light_color: true
        - type: custom:mushroom-light-card
          entity: light.nightstand_lamp
          show_brightness_control: true
          use_light_color: true
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          content: Bright
          icon: mdi:brightness-7
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.bedroom_bright
        - type: template
          content: Relax
          icon: mdi:bed
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.bedroom_relax
        - type: template
          content: Night
          icon: mdi:weather-night
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.bedroom_nightlight
        - type: template
          content: Sunset
          icon: mdi:weather-sunset
          tap_action:
            action: call-service
            service: scene.turn_on
            target:
              entity_id: scene.bedroom_sundown
- type: vertical-stack
  view_layout:
    grid-area: side
  cards:
    - type: custom:mushroom-title-card
      title: Climate
    - type: custom:mushroom-climate-card
      entity: climate.bedroom
      show_temperature_control: true
      collapsible_controls: true
    - type: custom:mushroom-cover-card
      entity: cover.bedroom_blinds
      name: Blinds
      show_tilt_position_control: true
    # z2m entity_id is bedroom_bedroom_* — the short bedroom_light_switch
    # id referenced previously does not exist
    - type: custom:mushroom-entity-card
      entity: switch.bedroom_bedroom_light_switch
      name: Wall Switch
      icon: mdi:light-switch
      tap_action:
        action: toggle
