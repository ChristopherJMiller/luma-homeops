title: Kitchen
type: custom:grid-layout
layout:
  grid-template-columns: minmax(16px, 1fr) repeat(6, minmax(0, 185px)) minmax(16px, 1fr)
  grid-gap: 12px
  margin: 12px 0 28px
  grid-template-areas: |
    ". hero hero hero hero hero hero ."
    ". lights lights lights lights side side ."
  mediaquery:
    "(max-width: 800px)":
      grid-template-columns: minmax(0, 1fr)
      grid-gap: 10px
      margin: 8px 10px 24px
      grid-template-areas: |
        "hero"
        "lights"
        "side"
cards:
- type: vertical-stack
  view_layout:
    grid-area: hero
  cards:
    - type: custom:mushroom-template-card
      primary: Kitchen
      secondary: >-
        {% set f = states('binary_sensor.fridge_door_contact') %}
        {% set z = states('binary_sensor.freezer_door_contact') %}
        {{ 'Fridge open' if f == 'on' else 'Fridge closed' if f == 'off' else 'Fridge —' }}
        · {{ 'Freezer open' if z == 'on' else 'Freezer closed' if z == 'off' else 'Freezer —' }}
      icon: mdi:silverware-fork-knife
      icon_color: amber
      card_mod: {class: roomhero}
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          entity: switch.kitchen_underlight_do_not_disturb
          content: Do not disturb
          icon: mdi:bell-off
          icon_color: "{{ 'amber' if is_state('switch.kitchen_underlight_do_not_disturb','on') else '' }}"
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.kitchen_underlight_do_not_disturb
    # Room modes: Auto = adaptive lighting; a scene holds until Auto (lighting.yaml).
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          content: Auto
          icon: mdi:sun-clock
          icon_color: "{{ 'amber' if is_state('input_select.kitchen_light_mode', 'Auto') else 'disabled' }}"
          tap_action:
            action: perform-action
            perform_action: script.room_auto
            data:
              room: kitchen
        - type: template
          content: Bright
          icon: mdi:brightness-7
          icon_color: "{{ 'amber' if is_state('input_select.kitchen_light_mode', 'Bright') else 'disabled' }}"
          tap_action:
            action: perform-action
            perform_action: script.room_scene
            data:
              room: kitchen
              scene: Bright
        - type: template
          content: Night
          icon: mdi:weather-night
          icon_color: "{{ 'amber' if is_state('input_select.kitchen_light_mode', 'Night') else 'disabled' }}"
          tap_action:
            action: perform-action
            perform_action: script.room_scene
            data:
              room: kitchen
              scene: Night
- type: vertical-stack
  view_layout:
    grid-area: lights
  cards:
    - type: custom:mushroom-title-card
      title: Lights
    - type: custom:mushroom-light-card
      entity: light.kitchen_underlight
      show_brightness_control: true
      show_color_control: true
      use_light_color: true
- type: vertical-stack
  view_layout:
    grid-area: side
  cards:
    - type: custom:mushroom-title-card
      title: Sensors
    - type: custom:mushroom-entity-card
      entity: binary_sensor.fridge_door_contact
      name: Fridge Door
    - type: custom:mushroom-entity-card
      entity: binary_sensor.freezer_door_contact
      name: Freezer Door
    - type: custom:mushroom-entity-card
      entity: binary_sensor.kitchen_sink_leak_sensor
      name: Sink Leak
      icon: mdi:water-alert
    - type: custom:mushroom-entity-card
      entity: binary_sensor.water_heater_leak_sensor
      name: Water Heater Leak
      icon: mdi:water-alert
