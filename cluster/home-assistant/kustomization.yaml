---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
  - logical-backup-s3.yaml
  - restic-config.yaml
  - restic-backup-cronjob.yaml
  - psql.yaml
  - postgres-podmonitor.yaml
  - mosquitto-servicemonitor.yaml
  - ha-reload.yaml
  - ha-reload-token.yaml
  - ha-secrets.yaml

# HA config packages (git-tracked source of truth). Rendered into a ConfigMap
# that the ha-helm chart mounts at /config/packages via extraConfigMounts.
# Stable name (no hash suffix) so the chart can reference it directly. After
# every sync the ha-reload PostSync hook (ha-reload.yaml) reloads HA until it
# runs this revision, restarting it once if a new integration needs it.
configMapGenerator:
  - name: ha-packages
    files:
      - packages/bedroom.yaml
      - packages/plant_blinds.yaml
      - packages/morning_routine.yaml
      - packages/night_routine.yaml
      - packages/lighting.yaml
      - packages/scenes.yaml
      - packages/overview_brain.yaml
      - packages/home_alerts.yaml
      - packages/presence.yaml
      - packages/zigbee_hygiene.yaml
      - packages/prometheus.yaml
      - packages/config_revision.yaml
  - name: ha-dashboards
    files:
      - dashboards/overview.yaml
  - name: ha-themes
    files:
      - themes/warm-minimal.yaml
  # The ha-reload PostSync hook's script (ha-reload.yaml).
  - name: ha-reload-script
    files:
      - hooks/ha_reload.py

generatorOptions:
  disableNameSuffixHash: true
