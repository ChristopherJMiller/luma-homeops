---
# Bedroom wall switch (spec §7.4). One way only: the switch drives the lamps;
# the lamps never drive the switch, so the old switch<->lamp flapping cannot
# happen. Trade-off (accepted): lamps turned on from the app while the switch
# is off need on-then-off at the paddle to turn off.
#
# GitOps source of truth. Rendered into /config/packages/bedroom.yaml in the HA
# pod via the `ha-packages` ConfigMap (kustomization.yaml) + the chart's
# extraConfigMounts. HA loads it via `homeassistant.packages`. Edit HERE, not in
# the HA UI (the UI editor is read-only for package-defined automations).
automation:
  - id: bedroom_switch_master
    alias: Bedroom - Wall Switch Drives the Lamps
    description: Switch on = bedroom lamps on in Auto (or "start your day" while the morning routine is armed); switch off = lamps off. Never the other way round.
    triggers:
      - trigger: state
        entity_id: switch.bedroom_bedroom_light_switch
        from: "off"
        to: "on"
        id: "on"
      - trigger: state
        entity_id: switch.bedroom_bedroom_light_switch
        from: "on"
        to: "off"
        id: "off"
    actions:
      - choose:
          # Armed by the morning routine: this flip is "start your day".
          - conditions:
              - condition: trigger
                id: "on"
              - condition: state
                entity_id: input_boolean.wake_up_pending
                state: "on"
            sequence:
              - action: script.start_your_day
          - conditions:
              - condition: trigger
                id: "on"
            sequence:
              - action: script.room_auto
                data:
                  room: bedroom
                  turn_on: true
          - conditions:
              - condition: trigger
                id: "off"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.bedroom_all
    mode: queued

  # The blinds' only automation. It targets the two SwitchBot Blind Tilts, not
  # cover.bedroom_blinds: that group sits unavailable for ~5 min after each restart.
  - id: bedroom_button_blinds
    alias: Bedroom - Button Toggles the Blinds
    description: >-
      Bedroom Button (SONOFF SNZB-01P), single press: either blind open = close both,
      both closed = open both. Double and long press are unassigned.
    triggers:
      - trigger: state
        entity_id: sensor.bedroom_button_action
        to: single
    actions:
      - if:
          - condition: template
            value_template: "{{ is_state('cover.window_left', 'open') or is_state('cover.window_right', 'open') }}"
        then:
          - action: cover.close_cover_tilt
            target:
              entity_id: [cover.window_left, cover.window_right]
        else:
          - action: cover.open_cover_tilt
            target:
              entity_id: [cover.window_left, cover.window_right]
    mode: single
