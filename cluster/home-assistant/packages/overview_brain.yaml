# Overview "brain" — the logic behind the top-of-mind glance dashboard.
#
# GitOps source of truth (see bedroom.yaml header for the mount mechanism).
# All the "which city / is it a workday / coat or umbrella / which commute"
# reasoning lives HERE as template + workday sensors; the dashboard only
# DISPLAYS these entities. Keeps presentation thin and logic centralized.
#
# EXTERNAL entities this expects (add via HA UI where noted):
#   weather.forecast_home         Seattle / Capitol Hill (Met.no)     — exists
#   weather.toronto               Toronto / Yonge+Eglinton (Met.no)   — ADD via UI
#   sensor.seattle_work_commute   Capitol Hill -> Redmond Bldg 25     — exists (Waze)
#   sensor.toronto_work_commute   Yonge+Eg -> CIBC Square (transit)   — ADD (google_travel_time)
#   sensor.pixel_9_pro_xl_current_time_zone     which city (time_zone_id) — exists (mobile app)
#   calendar.chris_is_not_in_seattle_calendar   fallback Toronto tell     — exists

# Workday is config-flow-only in HA 2026.x (no YAML). Added via the UI:
#   binary_sensor.workday_sensor_us_wa   United States / Washington (Seattle)
#   binary_sensor.workday_sensor_ca_on   Canada / Ontario (Toronto)

template:
  # ---- Location: which city, and which entities are "active" ----
  - sensor:
      # The phone's time zone is the signal (time_zone_id, an IANA id; the state is a display
      # name like "Pacific Daylight Time"): America/Toronto -> Toronto, any other zone -> Seattle.
      # Only when the phone has not reported does the Toronto calendar decide. Every template
      # repeats the same two-line decision so state, icon and attributes always agree.
      - name: Current City
        unique_id: current_city
        state: >-
          {% set tz = state_attr('sensor.pixel_9_pro_xl_current_time_zone', 'time_zone_id') %}
          {% set city = 'Toronto' if tz == 'America/Toronto' else 'Seattle' if tz else 'Toronto' if is_state('calendar.chris_is_not_in_seattle_calendar', 'on') else 'Seattle' %}
          {{ city }}
        icon: >-
          {% set tz = state_attr('sensor.pixel_9_pro_xl_current_time_zone', 'time_zone_id') %}
          {% set city = 'Toronto' if tz == 'America/Toronto' else 'Seattle' if tz else 'Toronto' if is_state('calendar.chris_is_not_in_seattle_calendar', 'on') else 'Seattle' %}
          {{ 'mdi:tower-fire' if city == 'Toronto' else 'mdi:space-needle' }}
        attributes:
          weather_entity: >-
            {% set tz = state_attr('sensor.pixel_9_pro_xl_current_time_zone', 'time_zone_id') %}
            {% set city = 'Toronto' if tz == 'America/Toronto' else 'Seattle' if tz else 'Toronto' if is_state('calendar.chris_is_not_in_seattle_calendar', 'on') else 'Seattle' %}
            {{ 'weather.toronto' if city == 'Toronto' else 'weather.forecast_home' }}
          commute_entity: >-
            {% set tz = state_attr('sensor.pixel_9_pro_xl_current_time_zone', 'time_zone_id') %}
            {% set city = 'Toronto' if tz == 'America/Toronto' else 'Seattle' if tz else 'Toronto' if is_state('calendar.chris_is_not_in_seattle_calendar', 'on') else 'Seattle' %}
            {{ 'sensor.toronto_work_commute' if city == 'Toronto' else 'sensor.seattle_work_commute' }}
          workday_entity: >-
            {% set tz = state_attr('sensor.pixel_9_pro_xl_current_time_zone', 'time_zone_id') %}
            {% set city = 'Toronto' if tz == 'America/Toronto' else 'Seattle' if tz else 'Toronto' if is_state('calendar.chris_is_not_in_seattle_calendar', 'on') else 'Seattle' %}
            {{ 'binary_sensor.workday_sensor_ca_on' if city == 'Toronto' else 'binary_sensor.workday_sensor_us_wa' }}

      - name: Active Temperature
        unique_id: active_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        # Unavailable (not an empty, invalid number) while the city's weather entity is missing.
        availability: >-
          {% set w = state_attr('sensor.current_city','weather_entity') %}
          {{ w is not none and states(w) not in ['unknown','unavailable'] }}
        state: >-
          {% set w = state_attr('sensor.current_city','weather_entity') %}
          {% if w and states(w) not in ['unknown','unavailable','none'] %}{{ state_attr(w,'temperature') | round(0) }}{% endif %}

      - name: Active Commute
        unique_id: active_commute
        unit_of_measurement: min
        icon: mdi:car-clock
        availability: >-
          {% set c = state_attr('sensor.current_city','commute_entity') %}
          {{ c is not none and states(c) not in ['unknown','unavailable'] }}
        state: >-
          {% set c = state_attr('sensor.current_city','commute_entity') %}
          {% if c and states(c) not in ['unknown','unavailable','none'] %}{{ states(c) | round(0) }}{% endif %}

  # A binary sensor (on/off): the dashboard's commute tile is conditional on
  # binary_sensor.show_commute being "on". It was a plain sensor ("True"/
  # "False") until 2026-10-03, so the tile never showed; `hactl lint` caught it.
  - binary_sensor:
      - name: Show Commute
        unique_id: show_commute
        # Only surface the commute when it's a workday in the active city AND
        # you're home (no point once you've left). current_city's
        # workday_entity is None until it renders (startup, reloads), and
        # is_state(None, …) raises, hence the guard. No commute source (Seattle since
        # Waze was removed) = no tile.
        state: >-
          {% set wd = state_attr('sensor.current_city','workday_entity') %}
          {{ wd is not none and is_state(wd,'on') and is_state('person.chris_m','home')
             and states('sensor.active_commute') not in ['unknown', 'unavailable'] }}

  # ---- Weather forecast for the active city (precip chance + amount today) ----
  - trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/20"
      - platform: state
        entity_id: sensor.current_city
    variables:
      w: "{{ state_attr('sensor.current_city','weather_entity') }}"
    condition:
      - condition: template
        value_template: "{{ w and states(w) not in ['unknown','unavailable','none'] }}"
    action:
      - service: weather.get_forecasts
        target:
          entity_id: "{{ w }}"
        data:
          type: daily
        response_variable: fc
    sensor:
      - name: Active Rain Chance Today
        unique_id: active_rain_chance_today
        unit_of_measurement: "%"
        state: >-
          {% set f = (fc.values()|list|first).forecast[0] if fc else none %}
          {{ f.precipitation_probability | default(0) if f else 0 }}
      - name: Active Precip Today
        unique_id: active_precip_today
        unit_of_measurement: "in"
        state: >-
          {% set f = (fc.values()|list|first).forecast[0] if fc else none %}
          {{ ((f.precipitation | default(0) | float) / 25.4) | round(2) if f else 0 }}

  # ---- The verdicts the dashboard shows ----
  - binary_sensor:
      - name: Coat Needed
        unique_id: coat_needed
        icon: mdi:coat-rack
        state: >-
          {{ (states('sensor.active_temperature') | float(99) < 65)
             or (states('sensor.active_rain_chance_today') | float(0) > 75) }}
      - name: Umbrella Needed
        unique_id: umbrella_needed
        icon: mdi:umbrella
        state: "{{ states('sensor.active_precip_today') | float(0) >= 0.1 }}"

  - sensor:
      # One-line plain-language summary for the top of the glance.
      - name: Outfit Advice
        unique_id: outfit_advice
        icon: mdi:hanger
        state: >-
          {% set coat = is_state('binary_sensor.coat_needed','on') %}
          {% set umb = is_state('binary_sensor.umbrella_needed','on') %}
          {% if coat and umb %}Jacket + umbrella
          {% elif coat %}Grab a jacket
          {% elif umb %}Take an umbrella
          {% else %}You don't need a jacket{% endif %}

      # Transit line(s) for the active city's commute.
      - name: Commute Transit
        unique_id: commute_transit
        icon: mdi:train
        state: >-
          {% if is_state('sensor.current_city','Toronto') %}Line 1 · Line 5{% else %}Link 2 Line{% endif %}
