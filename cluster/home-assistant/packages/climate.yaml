---
# Climate (spec §7.6), all behind input_boolean.climate_auto (Climate Auto on
# the dashboard). The slider insert carries the vent fan and the portable AC, so
# the slider being open means the insert is in. Tunables are input_numbers whose
# `initial:` makes git the source of truth (edit them here, not in the UI).
#
# The living room ecobee is wired to nothing: it is the dial and the brain. HA owns
# its schedule (Chris, 2026-10-18): sensor.climate_comfort picks Home / Sleep / Away
# from presence and the sleep window, and HA writes that comfort's heat-cool pair
# to the ecobee as a hold (its Hold Action is "until I change it", its own program
# is a flat Home, Smart Home/Away is off). A turn of the dial lasts until the next
# comfort change. The ecobee's own call (hvac_action) then drives the real
# equipment: `cooling` the portable AC (climate.portable_air_conditioner, Hisense
# via the ConnectLife cloud), `heating` the SmartRent wall thermostat
# (climate.living_room_thermostat). Each is aimed past the ecobee's setpoint (AC
# below, heat above), because their own sensors sit elsewhere and would call the
# room done too early; HA stops them when the ecobee stops calling.
#
# Safety rules (plan-4 review): a decision sensor is `unavailable` while any of
# its inputs is unknown, so missing data never sends a command; the actuator
# automations act on the first known value after a reload (so they resync); the
# AC is only commanded while binary_sensor.ac_ready (reachable, reading °F; in
# winter it is unplugged, so offline), the heat only while SmartRent is reachable,
# and climate only stops a run it started (any AC cool run when the house empties).
#
# GitOps source of truth (see bedroom.yaml header for the mount mechanism).

input_boolean:
  climate_auto:
    name: Climate Auto
    icon: mdi:thermostat-auto
  # What climate last set the floor fan to. A change that doesn't match was made by
  # hand (the plug is on z2m, whose state reports carry fresh contexts, so a context
  # check can't tell) and starts timer.floor_fan_manual_hold.
  floor_fan_commanded:
    name: Floor Fan Commanded
    icon: mdi:fan-auto
  # Set when climate started the AC, so a run started by hand (app, remote) is left alone.
  ac_started_by_climate:
    name: AC Started by Climate
    icon: mdi:air-conditioner
  # Set when climate put the SmartRent thermostat into heat, so heat set by hand is left alone.
  heat_started_by_climate:
    name: Heat Started by Climate
    icon: mdi:radiator

# The comfort (and setpoints) last written to the ecobee, e.g. "Home 70/76". A
# reload only rewrites the hold if the wanted comfort differs, so a deploy never
# undoes a turn of the dial. No `initial:`, so it survives a restart.
input_text:
  climate_comfort_applied:
    name: Climate Comfort Applied
    icon: mdi:thermostat
    max: 32

# The Sleep comfort's window (Chris, 2026-10-18: 23:00 -> 07:00, every day).
input_datetime:
  climate_sleep_start:
    name: Climate Sleep Start
    has_date: false
    has_time: true
    initial: "23:00:00"
  climate_sleep_end:
    name: Climate Sleep End
    has_date: false
    has_time: true
    initial: "07:00:00"

timer:
  # A floor fan switched by hand is left alone this long (Chris, 2026-10-18).
  floor_fan_manual_hold:
    name: Floor Fan Manual Hold
    icon: mdi:hand-back-right
    duration: "02:00:00"
    restore: true

input_number:
  free_cooling_delta:
    name: Free Cooling Delta
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: °F
    initial: 2
    mode: box
  free_cooling_floor:
    name: Free Cooling Floor
    min: 60
    max: 80
    step: 0.5
    unit_of_measurement: °F
    initial: 70
    mode: box
  aqi_limit:
    name: AQI Limit
    min: 0
    max: 300
    step: 5
    initial: 100
    mode: box
  # How far below the ecobee's cool setpoint the AC is aimed (floored at its min_temp).
  ac_setpoint_offset:
    name: AC Setpoint Offset
    min: 0
    max: 10
    step: 1
    unit_of_measurement: °F
    initial: 4
    mode: box
  # How far above the ecobee's heat setpoint the SmartRent heat is aimed (capped at 78).
  heat_setpoint_offset:
    name: Heat Setpoint Offset
    min: 0
    max: 10
    step: 1
    unit_of_measurement: °F
    initial: 4
    mode: box
  # The schedule's heat-cool pairs (Chris, 2026-10-18). The ecobee needs the pair at
  # least its heatCoolMinDelta (5 °F) apart.
  comfort_home_heat:
    name: Comfort Home Heat
    min: 55
    max: 85
    step: 0.5
    unit_of_measurement: °F
    initial: 70
    mode: box
  comfort_home_cool:
    name: Comfort Home Cool
    min: 60
    max: 90
    step: 0.5
    unit_of_measurement: °F
    initial: 76
    mode: box
  comfort_sleep_heat:
    name: Comfort Sleep Heat
    min: 55
    max: 85
    step: 0.5
    unit_of_measurement: °F
    initial: 67
    mode: box
  comfort_sleep_cool:
    name: Comfort Sleep Cool
    min: 60
    max: 90
    step: 0.5
    unit_of_measurement: °F
    initial: 74
    mode: box
  comfort_away_heat:
    name: Comfort Away Heat
    min: 55
    max: 85
    step: 0.5
    unit_of_measurement: °F
    initial: 62
    mode: box
  comfort_away_cool:
    name: Comfort Away Cool
    min: 60
    max: 90
    step: 0.5
    unit_of_measurement: °F
    initial: 82
    mode: box

template:
  # Trigger-based so it keeps its state across reloads and restarts (a state-based
  # template with delay_on would sit `unknown` for 30 min after every deploy).
  - triggers:
      - trigger: state
        entity_id: binary_sensor.slider_door_contact
        to: "on"
        for: "00:30:00"
      - trigger: state
        entity_id: binary_sensor.slider_door_contact
        to: "off"
        for: "00:05:00"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    binary_sensor:
      - name: Window Insert Installed
        unique_id: window_insert_installed
        icon: mdi:window-shutter-open
        state: >-
          {% if trigger.platform == 'state' %}{{ trigger.to_state.state == 'on' }}
          {% elif this.state in ['on', 'off'] %}{{ this.state == 'on' }}
          {% else %}{{ is_state('binary_sensor.slider_door_contact', 'on') }}{% endif %}

  # The ecobee's fan (wired to nothing) is the floor fan's schedule, smoothed: on as
  # soon as it runs, off once it has been off 15 min, so min-runtime cycling (at
  # 45 min/h: on ~6-9 min every ~15 min) doesn't click the fan. Change it from the
  # ecobee: fan mode `on` = always, min runtime 0 = only with heating/cooling calls.
  # Trigger-based, so it keeps its state across reloads.
  - triggers:
      - trigger: template
        value_template: "{{ state_attr('climate.living_room', 'fan') == 'on' }}"
        id: "on"
      - trigger: template
        value_template: "{{ state_attr('climate.living_room', 'fan') == 'off' }}"
        for: "00:15:00"
        id: "off"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    binary_sensor:
      - name: Ecobee Fan Circulating
        unique_id: ecobee_fan_circulating
        icon: mdi:fan-clock
        # First value ever (no state yet): circulating if the ecobee asks for any fan time.
        state: >-
          {% if trigger.id in ['on', 'off'] %}{{ trigger.id == 'on' }}
          {% elif this.state in ['on', 'off'] %}{{ this.state == 'on' }}
          {% else %}{{ state_attr('climate.living_room', 'fan') == 'on'
                       or state_attr('climate.living_room', 'fan_mode') == 'on'
                       or state_attr('climate.living_room', 'fan_min_on_time') | int(0) > 0 }}{% endif %}

  - binary_sensor:
      # The floor fan: the ecobee circulating, but never while printing (it sits by
      # the printer and warps prints). OctoPrint unknown counts as not printing.
      - name: Floor Fan Wanted
        unique_id: floor_fan_wanted
        icon: mdi:fan
        availability: "{{ states('binary_sensor.ecobee_fan_circulating') in ['on', 'off'] }}"
        state: >-
          {{ is_state('binary_sensor.ecobee_fan_circulating', 'on')
             and not is_state('binary_sensor.octoprint_printing', 'on') }}

      # Instant (no delay_on/off): a delayed template restarts as `off` after every reload,
      # which made the vent fan automation switch the fan off on each deploy. The
      # hysteresis delays live on the automation triggers instead (`for:`).
      - name: Free Cooling Wanted
        unique_id: free_cooling_wanted
        icon: mdi:weather-windy
        availability: >-
          {{ states('binary_sensor.window_insert_installed') in ['on', 'off']
             and states('sensor.living_room_temperature') | is_number
             and state_attr('weather.forecast_home', 'temperature') | is_number }}
        state: >-
          {% set indoor = states('sensor.living_room_temperature') | float %}
          {% set outdoor = state_attr('weather.forecast_home', 'temperature') | float %}
          {% set aqi = states('sensor.airnow_air_quality_index') | float(none) %}
          {{ is_state('binary_sensor.window_insert_installed', 'on')
             and outdoor <= indoor - states('input_number.free_cooling_delta') | float(2)
             and indoor >= states('input_number.free_cooling_floor') | float(70)
             and (aqi is none or aqi <= states('input_number.aqi_limit') | float(100)) }}

      # The ecobee calls for cooling (its own differential and minimum off time; the
      # schedule sets its setpoint, so Away's 82 keeps it quiet while nobody is home)
      # and outside air can't do it (+1°F to start, -1°F to stop). The AC automation
      # adds 5 min either way, so the compressor isn't short-cycled.
      - name: AC Cool Wanted
        unique_id: ac_cool_wanted
        icon: mdi:snowflake
        availability: >-
          {{ states('binary_sensor.window_insert_installed') in ['on', 'off']
             and states('climate.living_room') not in ['unavailable', 'unknown']
             and states('sensor.living_room_temperature') | is_number
             and state_attr('weather.forecast_home', 'temperature') | is_number }}
        state: >-
          {% set indoor = states('sensor.living_room_temperature') | float %}
          {% set outdoor = state_attr('weather.forecast_home', 'temperature') | float %}
          {% set delta = states('input_number.free_cooling_delta') | float(2) %}
          {% set on = this.state == 'on' %}
          {{ state_attr('climate.living_room', 'hvac_action') == 'cooling'
             and is_state('binary_sensor.window_insert_installed', 'on')
             and outdoor > indoor - delta + (-1 if on else 1) }}

      # The ecobee calls for heat. The heat automation adds 5 min either way.
      - name: Heat Wanted
        unique_id: heat_wanted
        icon: mdi:radiator
        availability: "{{ states('climate.living_room') not in ['unavailable', 'unknown'] }}"
        state: "{{ state_attr('climate.living_room', 'hvac_action') == 'heating' }}"

      # Sanity gate. The unit can be switched to °C at any time (an IR frame did it,
      # 2026-10-18); stock hisense_ac_plugin then read Celsius under a °F label. Our
      # fork follows the switch live, so HA converts; if a reading still disagrees
      # with the ecobee by more than 10°F, nothing is sent (no reading: allowed).
      - name: AC Ready
        unique_id: ac_ready
        icon: mdi:air-conditioner
        availability: "{{ states('sensor.living_room_temperature') | is_number }}"
        state: >-
          {% set ac = state_attr('climate.portable_air_conditioner', 'current_temperature') | float(none) %}
          {{ states('climate.portable_air_conditioner') not in ['unavailable', 'unknown']
             and (ac is none or (ac - states('sensor.living_room_temperature') | float) | abs <= 10) }}

  - sensor:
      # What the AC is set to while climate runs it: the ecobee's cool setpoint less
      # the offset, floored at the AC's minimum. Unavailable unless the ecobee cools.
      - name: AC Drive Setpoint
        unique_id: ac_drive_setpoint
        icon: mdi:thermometer-chevron-down
        unit_of_measurement: °F
        availability: >-
          {% set mode = states('climate.living_room') %}
          {{ mode in ['cool', 'heat_cool']
             and state_attr('climate.living_room', 'target_temp_high' if mode == 'heat_cool' else 'temperature') | is_number }}
        state: >-
          {% set mode = states('climate.living_room') %}
          {% set target = state_attr('climate.living_room', 'target_temp_high' if mode == 'heat_cool' else 'temperature') | float %}
          {% set floor = state_attr('climate.portable_air_conditioner', 'min_temp') | float(61) %}
          {{ [target - states('input_number.ac_setpoint_offset') | float(4), floor] | max | round(0) | int }}

      # What the SmartRent thermostat is set to while climate heats: the ecobee's heat
      # setpoint plus the offset, capped at 78 so a missed "off" can't overheat the
      # room. Unavailable unless the ecobee heats.
      - name: Heat Drive Setpoint
        unique_id: heat_drive_setpoint
        icon: mdi:thermometer-chevron-up
        unit_of_measurement: °F
        availability: >-
          {% set mode = states('climate.living_room') %}
          {{ mode in ['heat', 'heat_cool']
             and state_attr('climate.living_room', 'target_temp_low' if mode == 'heat_cool' else 'temperature') | is_number }}
        state: >-
          {% set mode = states('climate.living_room') %}
          {% set target = state_attr('climate.living_room', 'target_temp_low' if mode == 'heat_cool' else 'temperature') | float %}
          {{ [target + states('input_number.heat_setpoint_offset') | float(4), 78] | min | round(0) | int }}

      # The schedule: Away while the house is empty (guests count as home), Sleep in
      # the sleep window, Home otherwise. Each has a heat-cool pair of input_numbers.
      - name: Climate Comfort
        unique_id: climate_comfort
        icon: mdi:home-thermometer
        availability: "{{ states('binary_sensor.house_occupied') in ['on', 'off'] }}"
        state: >-
          {% set start = states('input_datetime.climate_sleep_start') %}
          {% set end = states('input_datetime.climate_sleep_end') %}
          {% set t = now().strftime('%H:%M:%S') %}
          {% set sleep = (t >= start or t < end) if start > end else (t >= start and t < end) %}
          {{ 'Away' if is_state('binary_sensor.house_occupied', 'off') else ('Sleep' if sleep else 'Home') }}

  - sensor:
      - name: Free Cooling Status
        unique_id: free_cooling_status
        icon: mdi:fan-auto
        state: >-
          {% set indoor = states('sensor.living_room_temperature') | float(none) %}
          {% set outdoor = state_attr('weather.forecast_home', 'temperature') | float(none) %}
          {% set aqi = states('sensor.airnow_air_quality_index') | float(none) %}
          {% if is_state('input_boolean.climate_auto', 'off') %}paused
          {% elif is_state('binary_sensor.window_insert_installed', 'off') %}insert out
          {% elif is_state('binary_sensor.free_cooling_wanted', 'on') %}running
          {% elif indoor is none or outdoor is none %}no data
          {% elif aqi is not none and aqi > states('input_number.aqi_limit') | float(100) %}smoke
          {% elif outdoor > indoor - states('input_number.free_cooling_delta') | float(2) %}warmer outside
          {% elif indoor < states('input_number.free_cooling_floor') | float(70) %}cool enough
          {% else %}starting{% endif %}

automation:
  - id: climate_vent_fan_free_cooling
    alias: Climate - Vent Fan Follows Free Cooling
    description: >-
      While the insert is in, the vent fan runs exactly when free cooling is wanted;
      resyncs on the first known value after a reload and when Climate Auto comes back on.
    triggers:
      # 10 min hysteresis on real changes ...
      - trigger: state
        entity_id: binary_sensor.free_cooling_wanted
        from: ["on", "off"]
        to: ["on", "off"]
        for: "00:10:00"
      # ... immediate resync on the first known value after a reload, or when Climate Auto returns
      - trigger: state
        entity_id: binary_sensor.free_cooling_wanted
        from: [unavailable, unknown]
        to: ["on", "off"]
      - trigger: state
        entity_id: input_boolean.climate_auto
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.climate_auto
        state: "on"
      - condition: state
        entity_id: binary_sensor.window_insert_installed
        state: "on"
      - condition: template
        value_template: >-
          {{ states('binary_sensor.free_cooling_wanted') in ['on', 'off']
             and states('switch.vent_fan_switch') not in ['unavailable', 'unknown'] }}
    actions:
      - action: "switch.turn_{{ states('binary_sensor.free_cooling_wanted') }}"
        target:
          entity_id: switch.vent_fan_switch
    mode: queued

  # The floor fan's only owner (the print pause used to be a second one).
  - id: climate_floor_fan_follows_ecobee
    alias: Climate - Floor Fan Follows the Ecobee Fan
    description: >-
      The floor fan runs while the ecobee's fan circulates (binary_sensor.floor_fan_wanted)
      and is off while printing. A flip by hand is left alone for 2 hours
      (timer.floor_fan_manual_hold), except that a print starting still turns it off.
    triggers:
      - trigger: state
        entity_id: binary_sensor.floor_fan_wanted
        from: ["on", "off"]
        to: ["on", "off"]
      # resync on the first known value after a reload, when Climate Auto returns,
      # and when a hand flip's hold runs out
      - trigger: state
        entity_id: binary_sensor.floor_fan_wanted
        from: [unavailable, unknown]
        to: ["on", "off"]
      - trigger: state
        entity_id: input_boolean.climate_auto
        from: "off"
        to: "on"
      - trigger: state
        entity_id: timer.floor_fan_manual_hold
        from: active
        to: idle
    conditions:
      - condition: state
        entity_id: input_boolean.climate_auto
        state: "on"
      - condition: template
        value_template: >-
          {{ states('binary_sensor.floor_fan_wanted') in ['on', 'off']
             and states('switch.floor_fan') not in ['unavailable', 'unknown'] }}
      - condition: template
        value_template: >-
          {{ not is_state('timer.floor_fan_manual_hold', 'active')
             or is_state('binary_sensor.octoprint_printing', 'on') }}
    actions:
      - variables:
          want: "{{ states('binary_sensor.floor_fan_wanted') }}"
      # Recorded first, so the plug reporting back isn't taken for a hand flip.
      - action: "input_boolean.turn_{{ want }}"
        target:
          entity_id: input_boolean.floor_fan_commanded
      - action: "switch.turn_{{ want }}"
        target:
          entity_id: switch.floor_fan
    mode: queued

  - id: climate_floor_fan_manual_hold
    alias: Climate - Floor Fan Hand Flip Holds 2 Hours
    description: >-
      A floor fan change that isn't what climate last commanded was made by hand
      (dashboard, plug button): climate leaves the fan alone for 2 hours.
    triggers:
      - trigger: state
        entity_id: switch.floor_fan
        from: ["on", "off"]
        to: ["on", "off"]
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state != states('input_boolean.floor_fan_commanded') }}"
    actions:
      - action: "input_boolean.turn_{{ trigger.to_state.state }}"
        target:
          entity_id: input_boolean.floor_fan_commanded
      - action: timer.start
        target:
          entity_id: timer.floor_fan_manual_hold
    mode: queued

  # The ecobee's schedule (its setpoints) has this one owner.
  - id: climate_ecobee_follows_comfort
    alias: Climate - Ecobee Follows the Schedule
    description: >-
      Writes the wanted comfort's heat-cool pair (sensor.climate_comfort: Home, Sleep,
      or Away while the house is empty) to the living room ecobee as a hold, whenever
      it differs from the last one written (input_text.climate_comfort_applied), so a
      turn of the dial lasts until the next comfort change and a deploy doesn't undo
      it. Climate Auto coming back on, or the ecobee's mode changing, rewrites it.
    triggers:
      # the comfort changed, or its first known value after a reload or restart
      - trigger: state
        entity_id: sensor.climate_comfort
        not_to: [unavailable, unknown]
      # a pair changed in git (`initial:` applies on the deploy's reload)
      - trigger: state
        entity_id:
          - input_number.comfort_home_heat
          - input_number.comfort_home_cool
          - input_number.comfort_sleep_heat
          - input_number.comfort_sleep_cool
          - input_number.comfort_away_heat
          - input_number.comfort_away_cool
        not_to: [unavailable, unknown]
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.climate_auto
        from: "off"
        to: "on"
        id: force
      # a cool- or heat-only hold carries one setpoint for both, so heat_cool needs the pair back
      - trigger: state
        entity_id: climate.living_room
        not_from: [unavailable, unknown]
        not_to: [unavailable, unknown]
        id: force
    conditions:
      - condition: state
        entity_id: input_boolean.climate_auto
        state: "on"
      - condition: template
        value_template: >-
          {{ states('sensor.climate_comfort') in ['Home', 'Sleep', 'Away']
             and states('climate.living_room') in ['heat_cool', 'cool', 'heat'] }}
    actions:
      - variables:
          comfort: "{{ states('sensor.climate_comfort') }}"
          pairs:
            Home: [input_number.comfort_home_heat, input_number.comfort_home_cool]
            Sleep: [input_number.comfort_sleep_heat, input_number.comfort_sleep_cool]
            Away: [input_number.comfort_away_heat, input_number.comfort_away_cool]
          heat: "{{ states(pairs[comfort][0]) | float }}"
          cool: "{{ states(pairs[comfort][1]) | float }}"
          key: "{{ comfort }} {{ heat }}/{{ cool }}"
      - condition: template
        value_template: "{{ trigger.id == 'force' or key != states('input_text.climate_comfort_applied') }}"
      - if:
          - condition: state
            entity_id: climate.living_room
            state: heat_cool
        then:
          - action: climate.set_temperature
            target:
              entity_id: climate.living_room
            data:
              target_temp_low: "{{ heat }}"
              target_temp_high: "{{ cool }}"
        else:
          - action: climate.set_temperature
            target:
              entity_id: climate.living_room
            data:
              temperature: "{{ cool if is_state('climate.living_room', 'cool') else heat }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.climate_comfort_applied
        data:
          value: "{{ key }}"
    mode: queued

  - id: climate_ac_follows_cool_wanted
    alias: Climate - AC Follows Cooling Need
    description: >-
      The portable AC (Hisense, ConnectLife cloud) cools while the ecobee calls for
      cooling, the insert is in and outside air can't do it. It runs at the drive
      setpoint (ecobee setpoint less the offset) and follows ecobee changes; it stops
      when the ecobee stops calling. Only a run climate started is stopped, except that
      any cool run stops when the house empties. Nothing is sent unless the AC is
      ready (in winter it is unplugged, so offline).
    triggers:
      - trigger: state
        entity_id: binary_sensor.ac_cool_wanted
        from: ["on", "off"]
        to: ["on", "off"]
        for: "00:05:00"
        id: sync
      # ... immediate resync on the first known value after a reload, when Climate
      # Auto returns, and when the AC is reachable (and reading °F) again
      - trigger: state
        entity_id: binary_sensor.ac_cool_wanted
        from: [unavailable, unknown]
        to: ["on", "off"]
        id: sync
      - trigger: state
        entity_id: input_boolean.climate_auto
        from: "off"
        to: "on"
        id: sync
      - trigger: state
        entity_id: binary_sensor.ac_ready
        to: "on"
        id: sync
      - trigger: state
        entity_id: binary_sensor.house_occupied
        from: "on"
        to: "off"
        id: away
      # the ecobee setpoint (or the offset) moved while the AC runs
      - trigger: state
        entity_id: sensor.ac_drive_setpoint
        not_from: [unavailable, unknown]
        not_to: [unavailable, unknown]
        id: setpoint
    conditions:
      - condition: state
        entity_id: input_boolean.climate_auto
        state: "on"
      - condition: state
        entity_id: binary_sensor.ac_ready
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'sync' and is_state('binary_sensor.ac_cool_wanted', 'on')
                     and states('sensor.ac_drive_setpoint') | is_number }}
            sequence:
              # A setpoint is only accepted in cool, and from off the unit powers up
              # at its own setpoint (26 °C), dropping one sent meanwhile (tested
              # 2026-10-18). So: wait until the unit itself reports cool (the
              # integration's 3 s cache says cool at once), then set and confirm.
              - if:
                  - condition: template
                    value_template: "{{ not is_state('climate.portable_air_conditioner', 'cool') }}"
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.portable_air_conditioner
                    data:
                      hvac_mode: cool
                  - delay: "00:00:05"
                  - wait_template: "{{ is_state('climate.portable_air_conditioner', 'cool') }}"
                    timeout: "00:01:00"
                    continue_on_timeout: false
                  - delay: "00:00:05"
              # ±1 °F: a unit switched to °C moves in 1.8 °F steps.
              - repeat:
                  sequence:
                    - action: climate.set_temperature
                      target:
                        entity_id: climate.portable_air_conditioner
                      data:
                        temperature: "{{ states('sensor.ac_drive_setpoint') | int }}"
                    - wait_template: >-
                        {{ (state_attr('climate.portable_air_conditioner', 'temperature') | float(0)
                            - states('sensor.ac_drive_setpoint') | float(0)) | abs <= 1 }}
                      timeout: "00:00:30"
                  until:
                    - condition: template
                      value_template: "{{ wait.completed or repeat.index >= 3 }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ac_started_by_climate
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'setpoint' and is_state('input_boolean.ac_started_by_climate', 'on')
                     and is_state('climate.portable_air_conditioner', 'cool') }}
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: climate.portable_air_conditioner
                data:
                  temperature: "{{ states('sensor.ac_drive_setpoint') | int }}"
          - conditions:
              - condition: template
                value_template: >-
                  {{ (trigger.id == 'away' and is_state('climate.portable_air_conditioner', 'cool'))
                     or (trigger.id == 'sync' and is_state('binary_sensor.ac_cool_wanted', 'off')
                         and is_state('input_boolean.ac_started_by_climate', 'on')) }}
            sequence:
              # Only from cool: if it was switched to a fan mode by hand, that stays.
              - if:
                  - condition: state
                    entity_id: climate.portable_air_conditioner
                    state: cool
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.portable_air_conditioner
                    data:
                      hvac_mode: "off"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ac_started_by_climate
    mode: queued

  - id: climate_heat_follows_heat_wanted
    alias: Climate - Heat Follows the Ecobee
    description: >-
      The SmartRent wall thermostat (climate.living_room_thermostat, the real heat)
      heats while the living room ecobee calls for heat, at the heat drive setpoint
      (ecobee heat setpoint plus the offset, capped at 78), and follows ecobee
      changes; it is switched off when the ecobee stops calling. Only heat climate
      started is stopped; nothing is sent while SmartRent is unreachable; its cool
      mode is never used.
    triggers:
      # 5 min hysteresis on real changes ...
      - trigger: state
        entity_id: binary_sensor.heat_wanted
        from: ["on", "off"]
        to: ["on", "off"]
        for: "00:05:00"
        id: sync
      # ... immediate resync on the first known value after a reload, when Climate
      # Auto returns, and when SmartRent is reachable again
      - trigger: state
        entity_id: binary_sensor.heat_wanted
        from: [unavailable, unknown]
        to: ["on", "off"]
        id: sync
      - trigger: state
        entity_id: input_boolean.climate_auto
        from: "off"
        to: "on"
        id: sync
      - trigger: state
        entity_id: climate.living_room_thermostat
        from: [unavailable, unknown]
        not_to: [unavailable, unknown]
        id: sync
      # the ecobee heat setpoint (or the offset) moved while it heats
      - trigger: state
        entity_id: sensor.heat_drive_setpoint
        not_from: [unavailable, unknown]
        not_to: [unavailable, unknown]
        id: setpoint
    conditions:
      - condition: state
        entity_id: input_boolean.climate_auto
        state: "on"
      - condition: template
        value_template: "{{ states('climate.living_room_thermostat') not in ['unavailable', 'unknown'] }}"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'sync' and is_state('binary_sensor.heat_wanted', 'on')
                     and states('sensor.heat_drive_setpoint') | is_number }}
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ not is_state('climate.living_room_thermostat', 'heat') }}"
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.living_room_thermostat
                    data:
                      hvac_mode: heat
              - action: climate.set_temperature
                target:
                  entity_id: climate.living_room_thermostat
                data:
                  temperature: "{{ states('sensor.heat_drive_setpoint') | int }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.heat_started_by_climate
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'setpoint' and is_state('input_boolean.heat_started_by_climate', 'on')
                     and is_state('climate.living_room_thermostat', 'heat') }}
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: climate.living_room_thermostat
                data:
                  temperature: "{{ states('sensor.heat_drive_setpoint') | int }}"
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'sync' and is_state('binary_sensor.heat_wanted', 'off')
                     and is_state('input_boolean.heat_started_by_climate', 'on') }}
            sequence:
              # Only from heat: if it was switched to another mode by hand, that stays.
              - if:
                  - condition: state
                    entity_id: climate.living_room_thermostat
                    state: heat
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.living_room_thermostat
                    data:
                      hvac_mode: "off"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.heat_started_by_climate
    mode: queued
