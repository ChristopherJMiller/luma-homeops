---
# Curated scenes (spec §7.3): the looks a room can hold until Auto is chosen again
# (script.room_scene / input_select.<room>_light_mode in lighting.yaml). Hue lamps were
# captured 2026-10-03 from the Hue scene named in each `from:` line with
# `hactl scene capture`; the non-Hue lights (sidetable, desk underlight, camp lamp,
# kitchen underlight) are set by hand. Chris trims/renames these in the plan-5 dashboard
# review. Entity ids are scene.<scene>_<room>: the Hue scenes own scene.<room>_<scene>.
#
# GitOps source of truth (see bedroom.yaml header for the mount mechanism). Never edit in the UI.
scene:
  - id: bright_living_room
    name: Bright (Living Room)
    # from: scene.living_room_bright
    entities:
      light.floor_lamp_a:
        state: 'on'
        brightness: 255
        xy_color: [0.4577, 0.41]
      light.floor_lamp_b:
        state: 'on'
        brightness: 255
        xy_color: [0.4577, 0.41]
      light.ground_spot:
        state: 'on'
        brightness: 255
        color_temp_kelvin: 2732
      light.tv_accent:
        state: 'on'
        brightness: 255
        color_temp_kelvin: 2732
      light.sidetable_lamp:
        state: 'on'
        brightness: 255
      light.desk_underlight:
        state: 'on'
        brightness: 255
        xy_color: [0.4596, 0.4105]
      light.camp_lamp:
        state: 'on'
