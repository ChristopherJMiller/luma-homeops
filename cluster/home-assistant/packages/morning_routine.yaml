---
# Morning routine — phone-alarm-driven wake-up light + "start your day" trigger.
#
# GitOps source of truth (see bedroom.yaml header for the mount mechanism).
#
# Two phases, armed by input_boolean.wake_up_pending so a daytime flip of the
# bedroom switch never triggers "start your day":
#   Phase 1 (Gentle)  — 1 min before the phone alarm: take the bedroom lamps out of
#                       adaptive lighting (manual), ease them into a warm dim glow,
#                       and ARM the routine. Other rooms keep adapting (sleep mode).
#   Phase 2 (Start)   — flipping the bedroom light switch WHILE ARMED runs
#                       script.start_your_day (via bedroom.yaml), which re-enables
#                       circadian and turns the rooms on, then disarms.
# A timeout auto-disarms if the switch flip never happens.

input_boolean:
  wake_up_pending:
    name: Wake Up Pending
    icon: mdi:weather-sunset-up

template:
  - sensor:
      # Next alarm on the phone, minus 1 minute. Unavailable (not errored) when
      # no alarm is set, so the Phase 1 time trigger simply doesn't fire. A
      # timestamp sensor rejects an empty state, hence the availability guard.
      - name: Wake Up Light Time
        unique_id: wake_up_light_time
        device_class: timestamp
        availability: >-
          {{ states('sensor.pixel_9_pro_xl_next_alarm') not in
             ['unknown', 'unavailable', 'none', ''] }}
        state: >-
          {{ (as_datetime(states('sensor.pixel_9_pro_xl_next_alarm'))
             - timedelta(minutes=1)).isoformat() }}

# Phase 2 — "start your day". Called by bedroom.yaml's wall-switch automation when
# the switch goes on while wake_up_pending is armed: one automation owns the switch,
# so the two can't race on the same flip.
script:
  start_your_day:
    alias: Start Your Day
    description: Re-enable circadian lighting and put the bedroom and living room on in Auto; disarm the routine.
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wake_up_pending
      # clear bedtime sleep mode (night_routine.yaml), or the day would start at 1% / 1000K
      - action: switch.turn_off
        target:
          entity_id: switch.adaptive_lighting_circadian_adaptive_lighting_sleep_mode_circadian
      # bedroom back to Auto (Phase 1 made its lamps manual), then the living room on in Auto
      - action: script.room_auto
        data:
          room: bedroom
          turn_on: true
      - action: script.room_auto
        data:
          room: living_room
          turn_on: true

automation:
  # Phase 1 — gentle pre-alarm wake light
  - id: morning_wake_up_gentle
    alias: Morning - Wake Up Gentle Light
    description: >-
      One minute before the phone alarm, take the bedroom lamps out of adaptive
      lighting and ease them into a warm dim glow, then arm "start your day".
    triggers:
      - trigger: time
        at: sensor.wake_up_light_time
    conditions:
      - condition: zone
        entity_id: person.chris_m
        zone: zone.home
    actions:
      # Per-room manual control, not the global adaptive-lighting switch: turning that off
      # left the whole house unadapted all day whenever "start your day" didn't happen.
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.circadian_adaptive_lighting_circadian
          lights: [light.nightstand_lamp, light.dresser_lamp, light.floor_lamp]
          manual_control: true
      - action: light.turn_on
        target:
          entity_id: light.bedroom_all
        data:
          brightness_pct: 15
          color_temp_kelvin: 2200
          transition: 60
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wake_up_pending
    mode: single


  # Safety — auto-disarm if the switch flip never happens (e.g. slept in / away)
  - id: morning_disarm_timeout
    alias: Morning - Disarm Wake Pending (timeout)
    description: 3 hours after Phase 1, if Start Your Day never ran, disarm and hand the bedroom back to adaptive lighting.
    triggers:
      - trigger: state
        entity_id: input_boolean.wake_up_pending
        to: "on"
        for: "03:00:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wake_up_pending
      - action: script.room_auto
        data:
          room: bedroom
    mode: single
