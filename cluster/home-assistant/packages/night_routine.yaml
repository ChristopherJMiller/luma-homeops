---
# Night routine. Evenings follow adaptive lighting's own curve (it keeps dimming
# toward 1% through the night); adaptive lighting's sleep mode (1% / 1000K) is
# on demand only, from the Bedroom dashboard's "Sleep" chip. The 22:30 sleep-mode
# switch-on was dropped 2026-10-18 (Chris): it reset every light at once, and held
# scenes then snapped back, so the house dipped and returned every night.
# morning_routine.yaml clears sleep mode in "Start Your Day"; the 10:00 fallback
# here clears it if that never fires (no alarm, away, slept in).
#
# GitOps source of truth (see bedroom.yaml header for the mount mechanism).

automation:
  - id: night_sleep_mode_off_fallback
    alias: Night - Sleep Mode Off (fallback)
    description: Safety net if the morning routine didn't clear sleep mode.
    triggers:
      - trigger: time
        at: "10:00:00"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.adaptive_lighting_circadian_adaptive_lighting_sleep_mode_circadian
    mode: single
