---
# Storage-mode dashboards (YAML ones are the chart's lovelace.dashboards) and Lovelace
# resources. Fully managed; deleting needs --prune. lovelace and map are HA built-ins.
# Written by `hactl import`, then edited by hand; converge with `hactl apply`.
# `default:` is the dashboard HA opens first (phone app included).
default: home-ops
dashboards:
  - url_path: claude-preview
    title: Claude Preview
    icon: mdi:flask-outline
    require_admin: true
    show_in_sidebar: false
  - url_path: lovelace
    title: Overview
    icon: mdi:view-dashboard
    require_admin: false
    show_in_sidebar: true
    # Retired 2026-10-03: a stale pre-July copy of Home. Built-in, so it can't be
    # deleted; its contents just point at Home.
    config: overview_retired.yaml
  - url_path: map
    title: Map
    icon: mdi:map
    require_admin: false
    show_in_sidebar: true
resources:
  - url: /local/community/lovelace-mushroom/mushroom.js?v=v5.1.1
    type: module
  - url: /local/community/lovelace-horizon-card/lovelace-horizon-card.js?v=v1.5.3
    type: module
  - url: /local/community/calendar-card-pro/calendar-card-pro.js?v=v3.2.0
    type: module
  - url: /local/community/lovelace-card-mod/card-mod.js?v=v4.2.1
    type: module
  - url: /local/community/Bubble-Card/bubble-card.js?v=v3.2.5
    type: module
  - url: /local/community/lovelace-layout-card/layout-card.js?v=v2.4.7
    type: module
  - url: /local/community/Ultra-Card/ultra-card.js?v=v3.5.0
    type: module
  - url: /local/community/weather_alerts_card/weather-alerts-card.js?v=v3.2.0
    type: module
