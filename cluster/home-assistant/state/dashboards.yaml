# Storage-mode dashboards (YAML ones are the chart's lovelace.dashboards) and Lovelace
# resources. Fully managed; deleting needs --prune. lovelace and map are HA built-ins.
# Written by `hactl import`, then edited by hand; converge with `hactl apply`.
dashboards:
