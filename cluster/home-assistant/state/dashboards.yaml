    title: Claude Preview
    icon: mdi:flask-outline
    require_admin: true
    show_in_sidebar: false
  - url_path: lovelace
    title: Overview
    icon: mdi:view-dashboard
    require_admin: false
    show_in_sidebar: true
  - url_path: map
    title: Map
    icon: mdi:map
    require_admin: false
    show_in_sidebar: true
