---
# Entity overrides, matched by platform + unique_id (survives entity_id renames).
# Unlisted entities are untouched. `remove:` deletes registry entries (dead entities).
# Written by `hactl import`, then edited by hand; converge with `hactl apply`.
entities:
  # switch_as_x names its light after the area + name; the lighting design uses light.camp_lamp.
  - match:
      platform: switch_as_x
      unique_id: 01M425PWDJPKY0NAJ4EC54F8ZC
    about: Camp Lamp (switch_as_x of switch.camp_lamp)
    entity_id: light.camp_lamp
  - match:
      platform: switch_as_x
      unique_id: 01M4P782WKWTXMMDJ28EKJBEQ0
    about: Bookshelf Lamp (switch_as_x of switch.bookshelf_lamp)
    entity_id: light.bookshelf_lamp
  # z2m renames don't move HA's sticky entity_id (joined as 0x00124b0030dd5487).
  - match:
      platform: mqtt
      unique_id: 0x00124b0030dd5487_switch_zigbee2mqtt
    about: Bookshelf Lamp plug (S40ZBTPB)
    entity_id: switch.bookshelf_lamp
  - match:
      platform: mqtt
      unique_id: 0x00124b0030dd5487_update_zigbee2mqtt
    about: Bookshelf Lamp plug firmware
    entity_id: update.bookshelf_lamp
  # The SwitchBot IR remote for the portable AC, superseded by hisense_ac_plugin
  # (climate.portable_air_conditioner). Disabled, not just unused: its power key is a
  # toggle (on/off both flip it), and its frames carry a Celsius setpoint that switches
  # the unit to °C, under the Hisense entity's °F label (2026-10-18).
  - match:
      platform: switchbot_cloud
      unique_id: 01-202507281617-44845622
      domain: climate
    about: Air Conditioner (SwitchBot IR remote)
    disabled: true
  - match:
      platform: switchbot_cloud
      unique_id: 01-202507281617-44845622
      domain: switch
    about: Air Conditioner power (SwitchBot IR remote)
    disabled: true
