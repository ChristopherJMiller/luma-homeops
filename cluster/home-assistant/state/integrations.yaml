---
# Integrations that must exist. hactl never deletes one. `create` answers its config flow
# (secrets via `credentials:` from credentials.yaml); `manual` says what a person must do.
# Written by `hactl import`, then edited by hand; converge with `hactl apply`.
integrations:
  - domain: adaptive_lighting
    title: circadian
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> adaptive_lighting'
  # Air quality (AQI chip on Home). Key from airnow.gov in credentials.yaml; lat/lon default to
  # HA's home location. HA titles it "AirNow Sensor at <lat>, <lon>" -- hactl renames it to
  # this title on create, keeping coordinates out of this public repo.
  - domain: airnow
    title: AirNow
    create:
      answers: {}
    credentials: airnow
  - domain: analytics
    title: Analytics
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> analytics'
  - domain: backup
    title: Backup
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> backup'
  - domain: caldav
    title: cmiller548@gmail.com - Main
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> caldav'
  - domain: dlna_dms
    title: 'Plex Media Server: plex.chrismiller.xyz'
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> dlna_dms'
  - domain: ecobee
    title: ecobee
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> ecobee'
  - domain: go2rtc
    title: go2rtc
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> go2rtc'
  - domain: google_translate
    title: Google Translate text-to-speech
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> google_translate'
  - domain: hacs
    title: ''
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> hacs'
  - domain: hue
    title: Hue Bridge 001788465e9e
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> hue'
  - domain: local_calendar
    title: Home Maintenance
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> local_calendar'
  - domain: mail_and_packages
    title: imap.fastmail.com
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> mail_and_packages'
  - domain: mcp_server
    title: Assist
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> mcp_server'
  - domain: met
    title: Home
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> met'
  - domain: mobile_app
    title: Pixel 9 Pro XL
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> mobile_app'
  - domain: mqtt
    title: mosquitto
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> mqtt'
  - domain: octoprint
    title: 192.168.0.243
    manual: 'HA: Add integration -> OctoPrint, host 192.168.0.243, port 80, path /, SSL off; then approve the Home Assistant app key in OctoPrint (Settings -> Application Keys)'
  - domain: opower
    title: Seattle City Light (SCL) (cmiller548)
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> opower'
  # Plex by its Service name via the manual-setup flow: plex.tv sign-in stores whatever address
  # plex.tv advertises (the pod IP), which breaks whenever the pod moves. Token in credentials.yaml.
  - domain: plex
    title: http://mm-plex.media.svc.cluster.local:32400
    create:
      menu: [manual_setup]
      answers:
        host: mm-plex.media.svc.cluster.local
        port: 32400
        ssl: false
        verify_ssl: true
    credentials: plex
  - domain: radio_browser
    title: Radio Browser
    manual: 're-add it in HA: Settings -> Devices & services -> Add integration -> radio_browser'
  - domain: shopping_list
