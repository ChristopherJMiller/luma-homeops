---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home
  labels:
    app: home
    service: web
spec:
  replicas: 2
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: home
  template:
    metadata:
      namespace: realliance
      labels:
        app: home
        service: web
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
      containers:
        - name: home
          # Built by Forgejo Actions in realliance/realliance.net on the `general` runner.
          # Manual re-pin after `git verify-tag` and review (CLAUDE.md sharp edge 6).
          # Anonymous pulls go through the WAN hairpin and are 307'd to B2, so new pods
          # cannot pull while Forgejo is down (pre-pulled on every node at release).
          # Rollback: roll FORWARD to git.realliance.net/realliance/realliance.net:2.3
          # (same digest as the retired Quay copy; full pin in docs/forgejo.md, Rollback),
          # never `git revert`, and pause Renovate for this package in the same commit.
          image: git.realliance.net/realliance/realliance.net:2.4.0@sha256:c454fa03009763fcbf2835e1d0b01d2c8b9774acce0caa2d225a36530aaec4c9
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: 5Mi
              cpu: 5m
            limits:
              memory: 5Mi
              cpu: 5m
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: [/usr/sbin/nginx, -s, quit]
---
apiVersion: v1
kind: Service
metadata:
  name: home
  labels:
    service: web
spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: home
