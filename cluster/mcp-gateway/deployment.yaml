---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
spec:
  # 2 is safe: the gateway keeps no session state of its own — registrations live
  # in Dex (as oauth2clients) and tokens are bearer tokens it validates.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/hyprmcp/mcp-gateway:0.4.0@sha256:fde162c3b0df2f75b31776d1bc6736a7da29bc9665cc6fa872d37d022e2e3040
          # The root command IS serve (cmd/root.go), so no subcommand.
          args:
            - -c
            - /etc/mcp-gateway/conf/config.yaml
            - -a
            - :9000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 9000
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-gateway/conf
              readOnly: true
            - name: dex-client
              mountPath: /etc/mcp-gateway/dex-client
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: mcp-gateway-config
        - name: dex-client
          secret:
            secretName: mcp-gateway-dex-client
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
spec:
  selector:
    app.kubernetes.io/name: mcp-gateway
  ports:
    - name: http
      port: 9000
---
# mcp.chrismiller.xyz, split by path because the two halves need opposite answers.
#
# THE MCP CALLS — gated by mcp-jwt-auth, which requires a Dex-issued token whose
# email is on the family allowlist. Two layers, since the gateway supplies only
# authentication:
#
#   mcp-jwt-auth   is this somebody on the family allowlist?   authorization
#   the gateway    is the token signed by Dex, plus OAuth/DCR  authentication
#
# The gateway alone was not enough: published with authentication only on
# 2026-09-26, this endpoint accepted any Dex-issued token, and Dex authenticates
# any Google or Microsoft account in the world — the family tree was briefly
# world-readable. Do not remove this annotation.
#
# No `errors` middleware: an MCP client cannot follow a sign-in redirect, so a flat
# 401 is correct, and the gateway's WWW-Authenticate points the client at a token.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      oauth2-proxy-mcp-jwt-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: mcp.chrismiller.xyz
      http:
        paths:
          # One entry per MCP server. Adding a server means adding a path here
          # and in the gateway config — deliberately explicit, so a new server
          # cannot be exposed by accident.
          - path: /gramps/mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-gateway
                port:
                  number: 9000
---
# THE OAUTH BOOTSTRAP — ungated, necessarily. A client reaches these BEFORE it can
# possibly hold a token: it reads the metadata to find the authorization server,
# registers itself, and only then obtains one. Gating them made the endpoint safe
# and unusable, which is how this split came about.
#
# Safe to leave open: metadata is public by design (RFC 9728/8414), and
# registration only mints an OAuth client — the family allowlist above still
# decides whether any resulting token opens anything. The gateway rate-limits
# registration to 3 per 10 minutes per IP, so the exposure is Dex oauth2client
# objects, not data.
#
# There is deliberately NO catch-all `/` route: only these prefixes and the MCP
# paths above are reachable at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-gateway-oauth
  namespace: mcp-gateway
spec:
  ingressClassName: traefik
  rules:
    - host: mcp.chrismiller.xyz
      http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: mcp-gateway
                port:
                  number: 9000
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: mcp-gateway
                port:
                  number: 9000
