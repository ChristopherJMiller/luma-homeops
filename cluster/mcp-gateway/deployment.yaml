---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
spec:
  # 2 is safe: the gateway keeps no session state of its own — registrations live
  # in Dex (as oauth2clients) and tokens are bearer tokens it validates.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/hyprmcp/mcp-gateway:0.4.0@sha256:fde162c3b0df2f75b31776d1bc6736a7da29bc9665cc6fa872d37d022e2e3040
          # The root command IS serve (cmd/root.go), so no subcommand.
          args:
            - -c
            - /etc/mcp-gateway/conf/config.yaml
            - -a
            - :9000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 9000
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-gateway/conf
              readOnly: true
            - name: dex-client
              mountPath: /etc/mcp-gateway/dex-client
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: mcp-gateway-config
        - name: dex-client
          secret:
            secretName: mcp-gateway-dex-client
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
spec:
  selector:
    app.kubernetes.io/name: mcp-gateway
  ports:
    - name: http
      port: 9000
      targetPort: http
# NO INGRESS — deliberately, since 2026-09-27.
#
# The gateway authenticates but does not AUTHORIZE. Its only check is that the
# bearer token is signed by Dex's JWKS (oauth/oauth.go: jwt.ParseString with
# WithKeySet and nothing else) — no audience check, no issuer allowlist, and no
# user allowlist. Dex, in turn, authenticates any Google or Microsoft account in
# the world: it has no hostedDomains and no allowlist, because access control in
# this cluster lives in the oauth2-proxy tiers.
#
# Exposed publicly, that combination means anyone could POST /oauth/register,
# sign in with their own Google account and read the whole family tree. It was
# briefly live in that state on 2026-09-26 and the route was removed the moment
# the gap was understood.
#
# Do not re-add this Ingress until requests are authorized against the family
# allowlist as well as authenticated. The hard part is that an MCP client is not
# a browser, so the oauth2-proxy forward-auth used everywhere else cannot be
# reused as-is; it would need to accept a JWT bearer token rather than a cookie.
