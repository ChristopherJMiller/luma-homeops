---
# forge-bot: keeps the Realliance forge (Forgejo, git.realliance.net) in step with Realliance SSO
# (Keycloak, sso.realliance.net). Code, README and alert rules: git.realliance.net/realliance-ops/forge-bot.
# Spec: docs/superpowers/specs/2026-11-02-forge-bot-and-ci-design.md. Runbook: docs/forgejo.md#forge-bot.
#
# Not manifests, so not listed: alerts_test.yaml, alerts_site_test.yaml (forge-bot's promtool tests, checked by
# scripts/test-forge-bot-alerts.sh) and the *.secret.yaml sources of the two SealedSecrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forge-bot
resources:
  - namespace.yaml
  - forgejo-token.yaml # SealedSecret forge-bot-forgejo: forge-bot's Forgejo API token
  - keycloak.yaml # SealedSecret forge-bot-keycloak: the master-realm client secret
  - statefulset.yaml
  - service.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml # GENERATED by scripts/sync-forge-bot-alerts.sh
  - prometheusrule-site.yaml # site-owned alerts, tested by alerts_site_test.yaml
  - networkpolicy.yaml
# Both keep kustomize's hash suffix: a config, mode or keyring change rolls the pod.
configMapGenerator:
  - name: forge-bot-config
    files:
      - config.yaml
  - name: forge-bot-keyring
    files:
      - keyring/owners.asc
      - keyring/fingerprints.txt
