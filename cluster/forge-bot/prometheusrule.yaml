---
# GENERATED by scripts/sync-forge-bot-alerts.sh: the spec is internal/metrics/alerts.yaml of
# git.realliance.net/realliance/forge-bot at 9be4857b47a09599500d46686280e39f84c3a84a,
# the commit of the pinned image. Do not edit; re-sync after a re-pin.
# scripts/test-forge-bot-alerts.sh lints it, runs forge-bot's promtool tests (alerts_test.yaml)
# and checks it still equals that commit's file.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forge-bot-alerts
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: prometheus
spec:
  # forge-bot alert rules: the spec.groups of a PrometheusRule. Task 16 copies
  # them into luma-homeops cluster/forge-bot/prometheusrule.yaml (labels
  # prometheus: kube-prometheus, role: alert-rules, release: prometheus).
  # TestAlertRules checks that every metric, label and value used here is one
  # the bot exports.
  #
  # The ServiceMonitor must set honorLabels: true, or Prometheus renames the
  # metrics' own "job" label to exported_job and every "by (job)" / "on (job)"
  # below keys on the scrape job instead (pre-flight #1).
  #
  # A cycle runs every 5 m +/- 30 s, so "three cycles" is for: 11m (two of the
  # longest intervals after the first cycle that raised it) and "two cycles" is
  # for: 8m (one cycle can hold a gauge for about 6 min). An alert may have
  # several rules; promtool and Alertmanager treat them as one name, and each
  # carries a distinct reason label (promtool --lint-fatal enforces it).
  #
  # Routing (Task 15): BreakerTripped, OwnerNeedsAction, UnexpectedSSOWrite,
  # ReallianceSSOUnreadable and OwnersUnknown are urgent (24/7, both Owners);
  # the rest go to homelab-default. The dry-run Owner warning has its own name
  # (ForgeBotOwnerNeedsActionDryRun) so the anchored urgent regex cannot match it.
  groups:
    - name: forge-bot
      interval: 60s
      rules:
        # Only jobs in apply: a dry-run job's would-trip is in the metric for the
        # dry-run gate, but nothing was held back, so it does not page.
        - alert: ForgeBotBreakerTripped
          expr: max by (job) (forge_bot_breaker_tripped and on (job) (forge_bot_job_mode == 2)) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "forge-bot held back a bulk change in {{ $labels.job }}; acknowledge with allow_bulk_until or fix the SSO (docs/forgejo.md#forge-bot)"
        - alert: ReallianceSSOUnreadable
          expr: forge_bot_read_ok{source="sso"} == 0
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "forge-bot cannot read Realliance SSO completely; no job writes (docs/forgejo.md#forge-bot)"
        # An Owner finding pages only from a job in apply (review M4); the same
        # finding from a dry-run job is a weekday warning under its own name.
        # forge_bot_owner_needs_action (no job label) stays for dashboards.
        - alert: ForgeBotOwnerNeedsAction
          expr: max by (job) (forge_bot_findings{kind="owner_needs_action"} and on (job) (forge_bot_job_mode == 2)) > 0
          for: 0m
          labels:
            severity: critical
            mode: apply
          annotations:
            summary: "An Owner would be prohibited or demoted by {{ $labels.job }}; forge-bot never does that itself (docs/forgejo.md#forge-bot)"
        - alert: ForgeBotOwnerNeedsActionDryRun
          expr: max by (job) (forge_bot_findings{kind="owner_needs_action"} and on (job) (forge_bot_job_mode == 1)) > 0
          for: 0m
          labels:
            severity: warning
            mode: dry-run
          annotations:
            summary: "In dry-run, {{ $labels.job }} would prohibit or demote an Owner; fix before it goes to apply (docs/forgejo.md#forge-bot)"
        # The counter catches every later write; the cycle's finding catches one
        # seen by a new pod's first cycle, whose counter series starts at 1 so
        # increase() is 0 (review M5).
        - alert: ForgeBotUnexpectedSSOWrite
          expr: (max(increase(forge_bot_unexpected_sso_writes_total[15m])) > 0) or (max(forge_bot_findings{kind="unexpected_sso_write"}) > 0)
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "forge-bot's Keycloak client made a write that is not its own picture write (docs/forgejo.md#forge-bot)"
        # 30 min without a complete cycle, whether the last one is 25 min old
        # plus the 5 min for:, or the bot has never completed one (review M7).
        - alert: ForgeBotStale
          expr: time() - forge_bot_cycle_last_success_timestamp >= 1500
          for: 5m
          labels:
            severity: warning
            reason: last_success_old
          annotations:
            summary: "No forge-bot cycle with complete reads in 30 min (docs/forgejo.md#forge-bot)"
        - alert: ForgeBotStale
          expr: absent(forge_bot_cycle_last_success_timestamp)
          for: 30m
          labels:
            severity: warning
            reason: never_completed
          annotations:
            summary: "No forge-bot cycle with complete reads in 30 min (docs/forgejo.md#forge-bot)"
        - alert: ForgeBotNotConverging
          expr: (forge_bot_planned_changes > 0) and on (job) (forge_bot_job_mode == 2)
          for: 11m
          labels:
            severity: warning
          annotations:
            summary: "forge-bot job {{ $labels.job }} keeps planning changes it does not converge (docs/forgejo.md#forge-bot)"
        - alert: ForgeBotInventoryUntrusted
          expr: forge_bot_inventory_ok{check="signature"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The inventory head is not signed by an Owner; teams and allow_bulk_until are ignored (docs/forgejo.md#forge-bot)"
        - alert: ForgeBotInventoryInvalid
          expr: forge_bot_inventory_ok{check=~"teams|bot_config"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The inventory's {{ $labels.check }} is invalid; the teams job or the override is skipped (docs/forgejo.md#forge-bot)"
        # Findings that hold a job back persist while their cause does, so they
        # alert after three cycles. owners_unknown withholds every loss,
        # offboarding included, so it is urgent.
        - alert: ForgeBotOwnersUnknown
          expr: max by (job, kind) (forge_bot_findings{kind="owners_unknown"}) > 0
          for: 11m
          labels:
            severity: critical
          annotations:
            summary: "forge-bot sees no Owners, so {{ $labels.job }} withholds every loss, offboarding included (docs/forgejo.md#forge-bot)"
        - alert: ForgeBotJobWithheld
          expr: max by (job, kind) (forge_bot_findings{kind=~"access_group_empty|invalid_teams_map|group_unread"}) > 0
          for: 11m
          labels:
            severity: warning
          annotations:
            summary: "forge-bot job {{ $labels.job }} plans nothing: {{ $labels.kind }} (docs/forgejo.md#forge-bot)"
        # write_unaudited is raised once, when a recorded picture write's admin
        # event has not arrived after 14 min; it cannot persist for three
        # cycles, so any occurrence alerts, and it stays up for 30 min.
        - alert: ForgeBotSelfCheckBlind
          expr: max by (job, kind) (max_over_time(forge_bot_findings{kind="write_unaudited"}[30m])) > 0
          for: 0m
          labels:
            severity: warning
            reason: write_unaudited
          annotations:
            summary: "A forge-bot picture write left no Keycloak admin event; the self-check may be blind (docs/forgejo.md#forge-bot)"
        # A failed admin-event read leaves the self-check blind for that cycle
        # (review I2): two cycles in a row alert. One failure holds the gauge for
        # at most about 6 min (a late next cycle plus scrape lag), two for at
        # least 2 x 4m30s = 9 min, so for: 8m separates them (re-review N2).
        - alert: ForgeBotSelfCheckBlind
          expr: max by (job, kind) (forge_bot_findings{kind="events_unread"}) > 0
          for: 8m
          labels:
            severity: warning
            reason: events_unread
          annotations:
            summary: "forge-bot cannot read its own Keycloak admin events; unexpected SSO writes go unseen (docs/forgejo.md#forge-bot)"
        # Findings that skip part of one account's sync, persisting three
        # cycles (final review M3). invalid_policy has no rule: config rejects
        # its only cause, so the running bot never raises it.
        - alert: ForgeBotAccountSkipped
          expr: max by (job, kind) (forge_bot_findings{kind=~"duplicate_login_name|email_conflict"}) > 0
          for: 11m
          labels:
            severity: warning
          annotations:
            summary: "forge-bot job {{ $labels.job }} skips part of an account's sync: {{ $labels.kind }} (docs/forgejo.md#forge-bot)"
        # concurrent_edit is raised once per raced picture write, so any
        # occurrence alerts, and it stays up for 30 min.
        - alert: ForgeBotConcurrentEdit
          expr: max by (job, kind) (max_over_time(forge_bot_findings{kind="concurrent_edit"}[30m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "A forge-bot picture write raced a profile change; check the profile was not overwritten (docs/forgejo.md#forge-bot)"
