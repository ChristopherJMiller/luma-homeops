---
# `release: prometheus` is what makes Prometheus select this monitor; without it the monitor exists
# and collects nothing, silently.
# honorLabels: forge-bot's metrics carry their own `job` label (access, admin, teams, profile,
# avatar, read, selfcheck). Without honorLabels Prometheus renames it to exported_job, and every
# `by (job)`, `on (job)` and `{job=...}` in the alert rules keys on the scrape job instead
# (pre-flight #1). Series without a `job` label (up, the cycle gauges) still get job="forge-bot".
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forge-bot
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-bot
  namespaceSelector:
    matchNames: [forge-bot]
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      honorLabels: true
