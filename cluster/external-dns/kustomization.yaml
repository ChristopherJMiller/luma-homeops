---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dns
resources:
  # NB: upstream kustomize pins the image ONE TAG BEHIND the ref
  # (ref v0.23.0 -> newTag v0.22.0), so the binary is one minor older
  # than the Renovate PR title says. Read the release notes for ref-1
  # before merging a minor bump — v0.22.0 wiped all managed records.
  - github.com/kubernetes-sigs/external-dns/kustomize?ref=v0.23.0
  - cloudflare-api-token.yaml
  - cloudflareddns.yaml
  - cloudflareddns-config.yaml
patchesStrategicMerge:
  - external-dns-deployment.yaml
