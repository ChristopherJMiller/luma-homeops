---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: royaltracker-helm
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/ChristopherJMiller/royaltracker.git
    path: charts/royaltracker
    targetRevision: main
    helm:
      releaseName: royaltracker
      valuesObject:
        publicUrl: https://rccl-tracker.chrismiller.xyz
        image:
          tag: eb3ea82863afa9fbceef56849cfd22e991b5eec7
        ingress:
          enabled: true
          className: traefik
          host: rccl-tracker.chrismiller.xyz
          tls:
            enabled: false  # Traefik serves the wildcard default cert
        database:
          secretName: royaltracker-db
          secretKey: database_url
        configSecret:
          name: royaltracker-config
        bot:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: royaltracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
