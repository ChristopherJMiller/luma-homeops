---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-release
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/ChristopherJMiller/ha-helm.git
    path: ./
    targetRevision: v0.6.0
    helm:
      releaseName: ha
      valuesObject:
        image:
          tag: 2026.9.4
        hacs: false
        # /config/secrets.yaml for `!secret` in packages (home Wi-Fi match), sealed in
        # cluster/home-assistant/ha-secrets.yaml.
        secretsFile:
          enabled: true
          secretName: ha-secrets
          key: secrets.yaml
        # Custom integrations and cards, installed at these exact versions by the
        # chart's install-components init container (replaces HACS; Renovate bumps
        # them). Cards are served at /local/community/<name>/<file> and registered
        # as Lovelace resources in cluster/home-assistant/state/dashboards.yaml.
        components:
          enabled: true
          integrations:
            - name: adaptive_lighting
              repo: basnijholt/adaptive-lighting
              version: v1.31.0
            - name: mail_and_packages
              repo: moralmunky/Home-Assistant-Mail-And-Packages
              version: 0.5.16
              # zip_release repos: CI stamps the version into the asset (source says 0.0.0-dev)
              url: "https://github.com/moralmunky/Home-Assistant-Mail-And-Packages/releases/download/{version}/mail_and_packages.zip"
            - name: smartrent
              repo: ZacheryThomas/homeassistant-smartrent
              version: v0.5.5
              url: "https://github.com/ZacheryThomas/homeassistant-smartrent/releases/download/{version}/smartrent.zip"
          cards:
            - {name: lovelace-mushroom, repo: piitaya/lovelace-mushroom, version: v5.1.1, url: "https://github.com/piitaya/lovelace-mushroom/releases/download/{version}/mushroom.js"}
            - {name: lovelace-horizon-card, repo: rejuvenate/lovelace-horizon-card, version: v1.5.3, url: "https://github.com/rejuvenate/lovelace-horizon-card/releases/download/{version}/lovelace-horizon-card.js"}
            - {name: calendar-card-pro, repo: alexpfau/calendar-card-pro, version: v3.2.0, url: "https://github.com/alexpfau/calendar-card-pro/releases/download/{version}/calendar-card-pro.js"}
            - {name: lovelace-card-mod, repo: thomasloven/lovelace-card-mod, version: v4.2.1, url: "https://raw.githubusercontent.com/thomasloven/lovelace-card-mod/{version}/card-mod.js"}
            - {name: Bubble-Card, repo: Clooos/Bubble-Card, version: v3.2.5, url: "https://raw.githubusercontent.com/Clooos/Bubble-Card/{version}/dist/bubble-card.js"}
            - {name: lovelace-layout-card, repo: thomasloven/lovelace-layout-card, version: v2.4.7, url: "https://raw.githubusercontent.com/thomasloven/lovelace-layout-card/{version}/layout-card.js"}
            - {name: Ultra-Card, repo: WJDDesigns/Ultra-Card, version: v3.5.0, url: "https://github.com/WJDDesigns/Ultra-Card/releases/download/{version}/ultra-card.js"}
            - {name: weather_alerts_card, repo: seevee/weather_alerts_card, version: v3.2.0, url: "https://github.com/seevee/weather_alerts_card/releases/download/{version}/weather-alerts-card.js"}
        externalPostgres:
          host: acid-ha
          port: 5432
          username: postgres
          passwordFromSecretKeyRef:
            name: postgres.acid-ha.credentials.postgresql.acid.zalan.do
            key: password
        haConfigStorage:
          storageClassName: rook-ceph-block-ssd # #2665
          size: 5Gi
        # Canonical external URL so get_url() resolves behind the Cloudflare +
        # ingress proxy chain (fixes OAuth authorization-server metadata for MCP).
        externalUrl: https://home.chrismiller.xyz
        # Git-tracked config packages, mounted from the ha-packages ConfigMap
        # (built by cluster/home-assistant kustomize). Automations/helpers/etc.
        # live in cluster/home-assistant/packages/, edited in-repo not the UI.
        packages:
          enabled: true
        extraConfigMounts:
          - name: packages
            configMap: ha-packages
            mountPath: /config/packages
          - name: dashboards
            configMap: ha-dashboards
            mountPath: /config/dashboards
          - name: themes
            configMap: ha-themes
            mountPath: /config/themes
        # Git-tracked YAML-mode dashboard alongside the storage-mode default
        # (global mode stays storage so the UI-managed resources keep working).
        lovelace:
          enabled: true
          dashboards:
            # url_path MUST contain a hyphen (HA rejects hyphenless custom paths).
            - urlPath: home-ops
              filename: dashboards/overview.yaml
              title: Home
              icon: mdi:home
              showInSidebar: true
        # Fail-fast: a bad automation/package blocks pod start instead of taking
        # HA down. Validated clean pre-cutover (circadian_lighting removed).
        checkConfig:
          enabled: true
        haconfig:
          sensor:
            - platform: derivative
              source: sensor.living_room_temperature
              name: Living Room Temperature Rate
              round: 2
              unit_time: h  # degrees per hour
              time_window: 00:30:00    # 30 minute window

          # No http: here — since 2026.9 HA keeps it in storage; declared in cluster/home-assistant/state/system.yaml.
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: traefik-strip-csp@kubernetescrd
          hosts:
            - host: home.chrismiller.xyz
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    # TEMP (#2665): auto-sync off while home-assistant-persist moves to the ssd tier
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
