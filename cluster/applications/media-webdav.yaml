---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-webdav
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://danuk.github.io/k8s-webdav/
    chart: webdav
    targetRevision: 0.0.7
    helm:
      releaseName: media-webdav
      valuesObject:
        urls:
          /:
            htpasswdSecretRef:
              name: webdav-media-pass
              key: password
        existingHtpasswdSecrets:
          - name: webdav-media-pass
        ingress:
          enabled: true
          className: traefik
          host: mediadav.chrismiller.xyz
          tls:
            enabled: false  # Traefik serves the wildcard default cert
        nodeSelector:
          kubernetes.io/hostname: middle
        strategy:
          type: Recreate
        persistence:
          enabled: true
          existingClaim: mm-media

  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
