---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 92.16.1
    chart: kube-prometheus-stack
    helm:
      releaseName: prometheus
      valuesObject:
        defaultRules:
          create: true
          rules:
            alertmanager: true
            etcd: true
            configReloaders: true
            general: true
            k8s: true
            kubeApiserverAvailability: true
            kubeApiserverBurnrate: true
            kubeApiserverHistogram: true
            kubeApiserverSlos: true
            kubelet: true
            kubeProxy: true
            kubePrometheusGeneral: true
            kubePrometheusNodeRecording: true
            kubernetesApps: true
            kubernetesResources: true
            kubernetesStorage: true
            kubernetesSystem: true
            kubeScheduler: true
            kubeStateMetrics: true
            network: true
            node: true
            nodeExporterAlerting: true
            nodeExporterRecording: true
            prometheus: true
            prometheusOperator: true
          # By design, two nodes cannot hold three nodes' requests (spec §14:
          # Luma is shed during drains). Replaced by ClusterMemoryDrainDeficitHigh
          # and NodeMemoryRequestsHigh in rules/capacity-alerts.yaml.
          disabled:
            KubeMemoryOvercommit: true
        # Talos binds these to 127.0.0.1. All 9 targets have always been down.
        # Scraping them needs machine-config bind-address changes (S4).
        # Readiness is covered by control-plane-alerts.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        alertmanager:
          alertmanagerSpec:
            configSecret: alertmanager-main
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: rook-ceph-block
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 5Gi
        prometheusOperator:
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          livenessProbe:
            timeoutSeconds: 10
          readinessProbe:
            timeoutSeconds: 10
        prometheus:
          podDisruptionBudget:
            enabled: true
          prometheusSpec:
            replicas: 1
            resources:
              requests:
                cpu: 200m
                memory: 4Gi
              limits:
                memory: 4Gi
            # Convention: every PrometheusRule for this Prometheus carries
            # `release: prometheus`, in any namespace (the chart's stock rules
            # already do). Luma's own rules still live in `prometheus`. Older
            # rules also keep the legacy prometheus/role pair, which nothing
            # selects any more. Prove a rule loads with
            # scripts/check-prometheus-rules.sh.
            ruleSelector:
              matchLabels:
                release: prometheus
            ruleNamespaceSelector: {}
            additionalScrapeConfigs:
              - job_name: kubernetes-pods
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: true
                  # Honor prometheus.io/port — rewrite the SD-provided
                  # <pod-ip>:<containerPort> to <pod-ip>:<annotated-port>.
                  # Without this, every container port on an annotated
                  # pod is scraped, which is how gonic ended up being
                  # scraped on its HTML :80 and forced Prom 3 to fall
                  # back to text/plain leniency.
                  - source_labels:
                      - __address__
                      - __meta_kubernetes_pod_annotation_prometheus_io_port
                    action: replace
                    regex: ([^:]+)(?::\d+)?;(\d+)
                    replacement: $1:$2
                    target_label: __address__
                  # Honor prometheus.io/path.
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
              - job_name: vyos-snmp
                static_configs:
                  - targets: [192.168.0.1:161]
                metrics_path: /snmp
                params:
                  module: [vyos]
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-snmp-exporter:9116
              # Satellites (upper orbit) — node-exporter on each. Add new
              # device IPs here when scaling beyond octoprint.
              - job_name: satellites
                static_configs:
                  - targets:
                      - 192.168.0.243:9100 # octoprint
                      - 192.168.0.244:9100 # printer
                    labels:
                      group: satellites
                relabel_configs:
                  # octoprint and printer are intentionally powered off (Chris,
                  # 2026-10-18); delete this rule when they return. The target
                  # list stays as the record.
                  - source_labels: [__address__]
                    regex: '192\.168\.0\.24[34]:\d+'
                    action: drop
              # comin's GitOps deploy state per satellite (last_deployment,
              # number of fetches, etc.). Same hosts, port 4243.
              - job_name: satellites-comin
                static_configs:
                  - targets:
                      - 192.168.0.243:4243 # octoprint
                      - 192.168.0.244:4243 # printer
                    labels:
                      group: satellites
                      component: comin
                relabel_configs:
                  # octoprint and printer are intentionally powered off (Chris,
                  # 2026-10-18); delete this rule when they return. The target
                  # list stays as the record.
                  - source_labels: [__address__]
                    regex: '192\.168\.0\.24[34]:\d+'
                    action: drop
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: rook-ceph-block
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 200Gi
        grafana:
          # Real requests (Luma 0b), requests only: both were BestEffort.
          resources:
            requests:
              memory: 448Mi
          sidecar:
            # One key covers both sidecars (dashboards + datasources).
            resources:
              requests:
                memory: 384Mi
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          envFromSecret: azure-monitor-credentials
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - dashboard.chrismiller.xyz
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
