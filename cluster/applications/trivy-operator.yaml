---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    targetRevision: 0.36.x
    chart: trivy-operator
    helm:
      releaseName: trivy-operator
      valuesObject:
        operator:
          # node-collector can never run here: trivy-system enforces PodSecurity
          # baseline (hostPID + hostPath denied) and Talos lacks the host paths
          # it inspects anyway. Disable instead of spamming FailedCreate forever.
          infraAssessmentScannerEnabled: false
          # Built-in trivy server (ClientServer mode): the vulnerability + Java DBs
          # live once on the Ceph PVC below instead of being downloaded and
          # unpacked (~1.3 GB) into an emptyDir on the node's system SSD by
          # every scan job. Standalone mode was writing ~2.4 TB/day across the
          # three boot NVMes (#2661) — the PVC settings were dead config.
          builtInTrivyServer: true
          # A scan that fails permanently (image tag deleted upstream) was being
          # recreated every 30 s, forever. Retry hourly; cap concurrency so a
          # rescan wave can't saturate a node's disk.
          scanJobsRetryDelay: 1h
          scanJobsConcurrentLimit: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        trivy:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          storageClassEnabled: true
          storageClassName: "rook-ceph-block"
          storageSize: "10Gi"
        serviceMonitor:
          enabled: true
          labels:
            release: prometheus
        compliance:
          cron: "0 */6 * * *"
          specs:
            - k8s-cis-1.23
            - k8s-nsa-1.0
            - k8s-pss-baseline-0.1
            - k8s-pss-restricted-0.1
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
