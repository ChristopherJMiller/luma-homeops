---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph
    targetRevision: v1.20.7
    helm:
      releaseName: rook
      valuesObject:
        csi:
          serviceMonitor:
            enabled: true
          # The mons only speak msgr2 on :3300 and the kernel cephfs client
          # defaults to msgr1 there, so every CephFS mount fails with "no mds
          # is up" (dmesg: "socket closed (con state V1_BANNER)"). RBD already
          # gets the equivalent from the cluster-wide rbd_default_map_options.
          #
          # This is the right place for it: Rook passes it to the CSI node
          # plugin for ALL cephfs mounts. Setting kernelMountOptions on a
          # StorageClass does NOT work — the provisioner never copies it into
          # the PV volumeAttributes, so the mount is attempted without it.
          cephFSKernelMountOptions: ms_mode=prefer-crc
        monitoring:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: rook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
