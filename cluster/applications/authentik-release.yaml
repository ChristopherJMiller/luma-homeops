---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-release
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    targetRevision: 2024.x.x
    chart: authentik
    helm:
      releaseName: a
      valuesObject:
        authentik:
          secret_key: file:///session-key/key
          postgresql:
            host: acid-auth
            user: postgres
            name: postgres
            password: file:///postgres-creds/password
        server:
          livenessProbe:
            # -- Number of seconds after which the [probe] times out
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: traefik-strip-csp@kubernetescrd
            hosts:
              - auth.chrismiller.xyz
            extraPaths:
              - path: /outpost.goauthentik.io
                pathType: ImplementationSpecific
                backend:
                  service:
                    name: ak-outpost-media-outpost
                    port:
                      number: 9000
          volumes:
            - name: postgres-creds
              secret:
                secretName: postgres.acid-auth.credentials.postgresql.acid.zalan.do
            - name: session-key
              secret:
                secretName: session-key
          volumeMounts:
            - name: postgres-creds
              mountPath: /postgres-creds
              readOnly: true
            - name: session-key
              mountPath: /session-key
              readOnly: true
          metrics:
            serviceMonitor:
              enabled: true
              namespace: authentik
              selector:
                release: prometheus
        worker:
          replicas: 2
          metrics:
            serviceMonitor:
              enabled: true
              namespace: authentik
              selector:
                release: prometheus
          livenessProbe:
            # -- Number of seconds after which the [probe] times out
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          volumes:
            - name: postgres-creds
              secret:
                secretName: postgres.acid-auth.credentials.postgresql.acid.zalan.do
            - name: session-key
              secret:
                secretName: session-key
          volumeMounts:
            - name: postgres-creds
              mountPath: /postgres-creds
              readOnly: true
            - name: session-key
              mountPath: /session-key
              readOnly: true
        redis:
          enabled: true
          # docker.io/bitnami/redis:7.4.1-debian-12-r0 was deleted upstream
          # (Bitnami withdrew its free images, 2025). The pod only runs today
          # because the node still has the layer cached; a reschedule or a node
          # rebuild (#2661) would leave it ImagePullBackOff. bitnamilegacy/
          # carries the identical digest. Goes away with the authentik upgrade
          # (#2591), whose chart no longer bundles this subchart.
          image:
            repository: bitnamilegacy/redis
          architecture: standalone
          commonConfiguration: ''
          master:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 512Mi
            persistence:
              enabled: false
          # Bitnami pulled redis-exporter:1.63.0-debian-12-r1 from Docker Hub
          # in 2025 (move to Bitnami Secure Images). The sidecar blocked the
          # pod's Ready, emptying the redis Service endpoints and crashlooping
          # authentik. Disabled until we either switch chart or wire an
          # alternative exporter image.
          metrics:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
