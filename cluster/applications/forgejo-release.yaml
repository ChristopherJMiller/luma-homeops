---
# Forgejo 15 LTS at https://git.realliance.net — the Realliance forge. The namespace, volumes,
# database, secrets and backups are cluster/forgejo/ (Application `forgejo`); this is only the
# Helm release, kept separate like immich-release so chart upgrades never touch the plumbing.
#
# Spec: docs/superpowers/specs/2026-11-02-realliance-forge-design.md · Runbook: docs/forgejo.md
#
# Storage is tiered (spec amendment 2026-11-02):
#   /data   forgejo-data   rook-ceph-block-ssd  queues, indexes, merge scratch, SSH host keys, avatars
#   /repos  forgejo-repos  rook-ceph-block      every bare repo (all git history)
#   B2      realliance-forge-objects            LFS, packages, attachments, archives — served
#                                               straight from B2 (SERVE_DIRECT) so downloads skip
#                                               the cluster and the home uplink
#
# Sign-in is Realliance SSO only; the SSO's /apps/forgejo group decides who may sign in at all.
# The login source `realliance` (with its admin group and group->team map) lives in Forgejo's
# DATABASE, not in this public file — see `gitea.oauth` below. Admin status and team membership
# sync at each sign-in, never between sign-ins: offboarding is the two-step runbook in
# docs/forgejo.md until forge-bot takes over (teams.yaml in the private realliance-ops/forge).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-release
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: code.forgejo.org/forgejo-helm # OCI; repository entry in cluster/argo-cd/values.yaml
    chart: forgejo
    targetRevision: 17.3.2 # appVersion 15.0.11 (LTS). 17.x/18.x of FORGEJO are the short track.
    helm:
      releaseName: forgejo
      valuesObject:
        test:
          enabled: false # a helm-test Pod; Argo would just apply it as a stray Pod
        strategy:
          type: Recreate # one RWO repos volume
        image:
          rootless: true
          # 15.0.11-rootless, pinned by digest (the chart derives the tag from appVersion; bump both together)
          digest: sha256:3cd6bc2b74c87cbde0a0fd527c9665cb416f5a0540dee54fe5afb3fa2df9f40c
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        # Keep-warm (docs/forgejo.md, "Fork image"): the Deployment's own image, run as `sleep` on
        # every node one Argo wave before Forgejo. Recreate stops the old pod before the new one
        # pulls, and the fork image comes from the forge's own registry, so each node must hold it
        # while the old forge still serves it. `--version` runs first: a binary that won't start
        # crash-loops here, and the sync waits at wave -1 with the old forge still up. With a node
        # NotReady every sync of this app waits here too; the runbook has the selective sync.
        extraDeploy:
          - apiVersion: apps/v1
            kind: DaemonSet
            metadata:
              name: forgejo-keepwarm
              namespace: '{{ .Release.Namespace }}'
              labels:
                app.kubernetes.io/name: forgejo-keepwarm
                app.kubernetes.io/instance: '{{ .Release.Name }}'
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/name: forgejo-keepwarm
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
              updateStrategy:
                type: RollingUpdate
                rollingUpdate:
                  maxUnavailable: 100% # the pods serve nothing; pull on all nodes at once
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: forgejo-keepwarm
                    app.kubernetes.io/instance: '{{ .Release.Name }}'
                spec:
                  automountServiceAccountToken: false
                  terminationGracePeriodSeconds: 1 # `sleep` as PID 1 ignores SIGTERM
                  tolerations:
                    - operator: Exists # every node, whatever taint it gains
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                    runAsGroup: 1000
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: keepwarm
                      image: '{{ include "gitea.image" . }}' # always the Deployment's image, fallback included
                      imagePullPolicy: '{{ .Values.image.pullPolicy }}'
                      command: ["sh", "-c", "/app/gitea/gitea --version && exec sleep 2147483647"]
                      resources:
                        requests:
                          cpu: 1m
                          memory: 8Mi
                        limits:
                          memory: 64Mi # `--version` peaks near 40Mi of its own
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: [ALL]

        persistence:
          enabled: true
          create: false
          claimName: forgejo-data
        extraVolumes:
          - name: repos
            persistentVolumeClaim:
              claimName: forgejo-repos
          - name: custom-templates # ConfigMap from cluster/forgejo (kustomize configMapGenerator)
            configMap:
              name: forgejo-custom-templates
          - name: themes # Catppuccin CSS, two ConfigMaps (1 MiB cap) merged into one directory
            projected:
              sources:
                - configMap: {name: forgejo-themes-1}
                - configMap: {name: forgejo-themes-2}
                - configMap: {name: forgejo-font-css} # realliance-fonts.css, loaded on every page
          - name: fonts # self-hosted woff2 + OFL texts (cluster/forgejo/custom/FONTS.md)
            configMap:
              name: forgejo-fonts
          - name: img # Realliance logo, favicons (cluster/forgejo/custom/BRAND.md)
            configMap:
              name: forgejo-img
        extraContainerVolumeMounts:
          - name: repos
            mountPath: /repos
          # Template overrides under $GITEA_CUSTOM (/data/gitea). Forgejo reads them at start:
          # after editing one, bump gitea.podAnnotations realliance/templates-rev to restart.
          - name: custom-templates
            mountPath: /data/gitea/templates/user/settings/navbar.tmpl
            subPath: user-settings-navbar.tmpl
            readOnly: true
          - name: themes
            mountPath: /data/gitea/public/assets/css
            readOnly: true
          - name: fonts
            mountPath: /data/gitea/public/assets/fonts
            readOnly: true
          - name: img
            mountPath: /data/gitea/public/assets/img
            readOnly: true
          # <head> hook, after the theme sheet: preloads the body font, loads realliance-fonts.css
          - name: custom-templates
            mountPath: /data/gitea/templates/custom/header.tmpl
            subPath: custom-header.tmpl
            readOnly: true

        # Forgejo's own GPG key "Realliance Forge <git@realliance.net>" (ID 50ACEA5F43099C00). Without
        # it Forgejo refuses every merge into a branch that requires signed commits ("won't sign: nokey").
        signing:
          enabled: true
          existingSecret: forgejo-signing # key privateKey; canonical copy in sso-secrets forge/signing-key.asc

        ingress:
          enabled: true
          className: traefik
          hosts:
            - host: git.realliance.net
              paths:
                - path: /
                  pathType: Prefix
          tls: [] # the wildcard *.realliance.net cert is Traefik's default TLSStore

        service:
          ssh:
            type: LoadBalancer
            port: 22
            annotations:
              # WAN :22 and LAN→WAN-IP :22 are forwarded here by the router (router/ansible
              # nat rules 400/410).
              metallb.universe.tf/loadBalancerIPs: 192.168.0.6

        gitea:
          podAnnotations:
            realliance/templates-rev: "5" # bump when anything under cluster/forgejo/custom/ changes
          admin:
            # Break-glass only: the internal sign-in form is off, so this account is used through
            # `forgejo admin user …` on the pod. Password: sso-secrets forge/secrets.env.
            existingSecret: forgejo-admin
            email: forgejo-admin@realliance.net
            passwordMode: keepUpdated
          # The SSO login source "realliance" lives in Forgejo's DATABASE, not here. The chart
          # re-applies gitea.oauth on every pod start and REFUSES TO START if the SSO's discovery URL
          # does not answer — an SSO outage plus any Forgejo restart took the whole forge down on
          # 2026-11-03. Source settings (change with `forgejo admin auth update-oauth --id 1 …` on the
          # pod, see docs/forgejo.md): provider openidConnect, key forgejo (secret: Secret forgejo-oidc),
          # discovery https://sso.realliance.net/realms/realliance/.well-known/openid-configuration,
          # group claim `groups`, admin group forgejo-admins, group-team-map with removal (realliance ->
          # realliance/members, realliance-maintainers -> realliance/maintainers; never Owners),
          # skip-local-2fa.
          oauth: []
          additionalConfigSources:
            - secret:
                secretName: forgejo-app-ini
          additionalConfigFromEnvs:
            - name: FORGEJO__DATABASE__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo.acid-forgejo.credentials.postgresql.acid.zalan.do
                  key: password
          config:
            APP_NAME: Realliance Forge
            server:
              # Explicit: the chart would infer http:// because the Ingress carries no spec.tls.
              ROOT_URL: https://git.realliance.net/
              DOMAIN: git.realliance.net
              SSH_DOMAIN: git.realliance.net
              SSH_PORT: 22
              SSH_LISTEN_PORT: 2222
              LFS_START_SERVER: true
            database:
              DB_TYPE: postgres
              HOST: acid-forgejo:5432
              NAME: forgejo
              USER: forgejo
              SSL_MODE: require
            repository:
              ROOT: /repos
              DEFAULT_PRIVATE: private
            service:
              DISABLE_REGISTRATION: false
              ALLOW_ONLY_EXTERNAL_REGISTRATION: true # accounts only come from Realliance SSO
              ENABLE_INTERNAL_SIGNIN: false
              ENABLE_BASIC_AUTHENTICATION: false # no passwords anywhere; tokens still work
              # Notification mail off for now (Chris 2026-11-01): Resend's free tier is 100/day,
              # shared with SSO. In-app notifications stay; Matrix / a daily digest come later.
              ENABLE_NOTIFY_MAIL: false
              DEFAULT_KEEP_EMAIL_PRIVATE: true
              DEFAULT_ALLOW_CREATE_ORGANIZATION: false # orgs are code (realliance/forge)
            ui:
              DEFAULT_THEME: catppuccin-sapphire-auto # Chris 2026-11-02; people can still pick any theme
              # Forgejo's own themes, then every Catppuccin flavour/accent and the auto (latte/mocha) ones.
              THEMES: forgejo-auto, forgejo-light, forgejo-dark, gitea-auto, gitea-light, gitea-dark, forgejo-auto-deuteranopia-protanopia, forgejo-light-deuteranopia-protanopia, forgejo-dark-deuteranopia-protanopia, forgejo-auto-tritanopia, forgejo-light-tritanopia, forgejo-dark-tritanopia, catppuccin-latte-rosewater, catppuccin-latte-flamingo, catppuccin-latte-pink, catppuccin-latte-mauve, catppuccin-latte-red, catppuccin-latte-maroon, catppuccin-latte-peach, catppuccin-latte-yellow, catppuccin-latte-green, catppuccin-latte-teal, catppuccin-latte-sky, catppuccin-latte-sapphire, catppuccin-latte-blue, catppuccin-latte-lavender, catppuccin-frappe-rosewater, catppuccin-frappe-flamingo, catppuccin-frappe-pink, catppuccin-frappe-mauve, catppuccin-frappe-red, catppuccin-frappe-maroon, catppuccin-frappe-peach, catppuccin-frappe-yellow, catppuccin-frappe-green, catppuccin-frappe-teal, catppuccin-frappe-sky, catppuccin-frappe-sapphire, catppuccin-frappe-blue, catppuccin-frappe-lavender, catppuccin-macchiato-rosewater, catppuccin-macchiato-flamingo, catppuccin-macchiato-pink, catppuccin-macchiato-mauve, catppuccin-macchiato-red, catppuccin-macchiato-maroon, catppuccin-macchiato-peach, catppuccin-macchiato-yellow, catppuccin-macchiato-green, catppuccin-macchiato-teal, catppuccin-macchiato-sky, catppuccin-macchiato-sapphire, catppuccin-macchiato-blue, catppuccin-macchiato-lavender, catppuccin-mocha-rosewater, catppuccin-mocha-flamingo, catppuccin-mocha-pink, catppuccin-mocha-mauve, catppuccin-mocha-red, catppuccin-mocha-maroon, catppuccin-mocha-peach, catppuccin-mocha-yellow, catppuccin-mocha-green, catppuccin-mocha-teal, catppuccin-mocha-sky, catppuccin-mocha-sapphire, catppuccin-mocha-blue, catppuccin-mocha-lavender, catppuccin-rosewater-auto, catppuccin-flamingo-auto, catppuccin-pink-auto, catppuccin-mauve-auto, catppuccin-red-auto, catppuccin-maroon-auto, catppuccin-peach-auto, catppuccin-yellow-auto, catppuccin-green-auto, catppuccin-teal-auto, catppuccin-sky-auto, catppuccin-sapphire-auto, catppuccin-blue-auto, catppuccin-lavender-auto
            service.explore:
              DISABLE_USERS_PAGE: true
            admin:
              DISABLE_REGULAR_ORG_CREATION: true
              DEFAULT_EMAIL_NOTIFICATIONS: disabled # new accounts; people may opt in
            oauth2_client:
              ENABLE_AUTO_REGISTRATION: true
              ACCOUNT_LINKING: disabled
              USERNAME: nickname # Keycloak sends no nickname; goth falls back to preferred_username
              REGISTER_EMAIL_CONFIRM: false # Keycloak verified the address
            session:
              PROVIDER: db
              SESSION_LIFE_TIME: 604800 # 7 days
              COOKIE_SECURE: true
            queue:
              TYPE: level
            cache:
              ADAPTER: twoqueue
            storage:
              # "minio" is Forgejo's name for any S3 server; this is Backblaze B2 (Realliance
              # account). Keys come from the forgejo-app-ini Secret.
              STORAGE_TYPE: minio
              MINIO_ENDPOINT: s3.us-east-005.backblazeb2.com
              MINIO_LOCATION: us-east-005
              MINIO_BUCKET: realliance-forge-objects
              MINIO_USE_SSL: true
              MINIO_CHECKSUM_ALGORITHM: md5 # required for Backblaze (Forgejo storage docs)
              SERVE_DIRECT: true # downloads go client <-> B2 via signed URLs
            avatar:
              STORAGE_TYPE: local # loaded on every page view; tiny — keep on the SSD volume
            repo-avatar:
              STORAGE_TYPE: local
            mailer:
              ENABLED: true
              PROTOCOL: smtps
              SMTP_ADDR: smtp.resend.com
              SMTP_PORT: 465
              USER: resend
              FROM: Realliance Forge <git@realliance.net>
            repository.signing:
              SIGNING_KEY: 50ACEA5F43099C00
              SIGNING_NAME: Realliance Forge
              SIGNING_EMAIL: git@realliance.net
              # Forgejo's defaults also demand Forgejo-local 2FA ("twofa"); MFA is enforced at the SSO
              # instead, so these drop it and keep the rest.
              MERGES: pubkey, basesigned, commitssigned
              CRUD_ACTIONS: pubkey, parentsigned
              INITIAL_COMMIT: always
            cron.git_gc_repos:
              ENABLED: false # full repacks are the one bulk write repos make on the HDD pool
            # Webhooks. The default `external` refuses private IPs; the pages-relay Service
            # (ns pages) is the one in-cluster target. The system hook (pages branch only) is
            # created through the admin API, not here: docs/pages.md.
            webhook:
              ALLOWED_HOST_LIST: external,pages-relay.pages.svc.cluster.local
            # Forgejo Actions. Job logs and artifacts go to B2 through the default [storage] above
            # (actions_log/, actions_artifacts/ in realliance-forge-objects). The one runner is
            # cluster/forgejo-runner (host mode, label `galaxy`), registered per repo: an allowlist.
            actions:
              ENABLED: true
              DEFAULT_ACTIONS_URL: https://github.com # `uses: actions/x@<sha>` resolves on GitHub
              ARTIFACT_RETENTION_DAYS: 30
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
