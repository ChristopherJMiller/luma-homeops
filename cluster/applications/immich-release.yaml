---
# Immich itself. The namespace, volumes and database are cluster/immich/
# (Application `immich`); this is only the Helm release, kept separate for the
# same reason as mega-media and home-assistant — chart upgrades land here
# without touching the plumbing underneath.
#
# Runbook: docs/immich.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-release
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://immich-app.github.io/immich-charts
    chart: immich
    targetRevision: 0.12.0
    helm:
      releaseName: immich
      valuesObject:
        # Shared by every component.
        controllers:
          main:
            containers:
              main:
                env:
                  DB_HOSTNAME:
                    valueFrom:
                      secretKeyRef: {name: immich-db, key: DB_HOSTNAME}
                  DB_PORT:
                    valueFrom:
                      secretKeyRef: {name: immich-db, key: DB_PORT}
                  DB_DATABASE_NAME:
                    valueFrom:
                      secretKeyRef: {name: immich-db, key: DB_DATABASE_NAME}
                  DB_USERNAME:
                    valueFrom:
                      secretKeyRef: {name: immich-db, key: DB_USERNAME}
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef: {name: immich-db, key: DB_PASSWORD}
                  # Which vector extension to use. Auto-detection would pick
                  # VectorChord anyway (it is preferred when several are
                  # present), but being explicit means a future pgvector-only
                  # database fails loudly instead of silently degrading.
                  #
                  # NOTE: DB_STORAGE_TYPE is deliberately NOT set here — it
                  # configures Immich's own Postgres container, which this
                  # cluster does not run. The SMR tuning lives on acid-immich
                  # instead (cluster/immich/psql.yaml).
                  DB_VECTOR_EXTENSION: vectorchord
                  # Spilo's pg_hba rejects unencrypted network connections
                  # ("no encryption" in the FATAL). require = use TLS but do not
                  # verify the CA, which is right for Spilo's self-signed cert.
                  DB_SSL_MODE: require

        immich:
          metrics:
            enabled: true # ServiceMonitors for the existing kube-prometheus-stack
          # System settings as code: cluster/immich/config.secret.yaml. Using a
          # config file makes the entire settings UI read-only, which is the
          # point — OIDC, job throttling and the scan schedule get reviewed in
          # git instead of clicked. Immich re-reads it on restart.
          configurationKind: Secret
          existingConfiguration: immich-config
          persistence:
            library:
              # CephFS RWX, created in cluster/immich/pvcs.yaml. The chart
              # deliberately will not create this for us.
              existingClaim: immich-uploads

        # Job queue. emptyDir is the chart default and is fine: a lost queue
        # means jobs re-run, and the data itself is in Postgres and the PVC.
        valkey:
          enabled: true

        server:
          enabled: true
          controllers:
            main:
              containers:
                main:
                  # Chart 0.12.0 defaults to app v2.6.3; v3.2.2 is current.
                  # Pinned here rather than waiting for a chart release —
                  # 3.x is also where VectorChord became mandatory, which this
                  # cluster already satisfies.
                  image:
                    repository: ghcr.io/immich-app/immich-server
                    tag: v3.2.2@sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea
                  resources:
                    requests:
                      cpu: 100m
                      memory: 512Mi
                    limits:
                      cpu: "2"
                      # 6Gi, raised from 2Gi: the server was OOMKilled ten
                      # times during the archive thumbnail pass, roughly every
                      # 20 minutes. Two things stack up here — ffmpeg decoding
                      # multi-GB DV captures for a video thumbnail, and page
                      # cache from writing those thumbnails to CephFS, which
                      # the kernel client charges to the cgroup with no
                      # writeback throttling (the same mechanism that OOMed the
                      # family archive writer during the original ingest).
                      #
                      # The LIMIT moves, not the request. Node middle is at
                      # ~99% of memory *requests* while using ~42% of actual
                      # memory, so raising the request risks unschedulability
                      # while raising the limit costs nothing until used.
                      memory: 6Gi
          persistence:
            # The family archive, mounted READ-ONLY as an external library.
            # Immich indexes it in place and never writes: /family stays the
            # source of truth, still mirrored to B2 by family-backup.
            family:
              enabled: true
              type: persistentVolumeClaim
              existingClaim: family-media-ro
              readOnly: true
              globalMounts:
                - path: /family
                  readOnly: true
          ingress:
            main:
              enabled: true
              className: traefik
              # NO oauth2-proxy middleware on purpose: the Immich mobile app
              # cannot complete a browser forward-auth redirect, and phone sync
              # is the point. Immich authenticates against Dex itself.
              hosts:
                - host: photos.chrismiller.xyz
                  paths:
                    - path: /
                      service:
                        identifier: main
              tls: [] # wildcard cert is Traefik's default TLSStore

        machine-learning:
          enabled: true
          controllers:
            main:
              # The cache is RWX now, so a rolling update no longer deadlocks
              # on Multi-Attach. Recreate is still the right choice: ML going
              # away briefly only means smartSearch/faceDetection jobs queue,
              # whereas a surge pod wants another 1Gi request on a cluster
              # already tight on memory requests, and would pull ~2 GB of
              # models through CephFS concurrently with the outgoing pod.
              # Switch to RollingUpdate if ML ever needs to be continuously
              # available — with RWX that is now merely a choice, not a trap.
              strategy: Recreate
              containers:
                main:
                  image:
                    repository: ghcr.io/immich-app/immich-machine-learning
                    tag: v3.2.2@sha256:60dfcf266a9ef3b7376f5678e8c980d4fb61db5fc48c078fe8a326ab1535d60d
                  resources:
                    requests:
                      cpu: 100m
                      memory: 1Gi
                    limits:
                      cpu: "2"
                      memory: 3Gi
          persistence:
            cache:
              # Downloaded CLIP / face models. A PVC rather than the chart's
              # emptyDir default so a restart doesn't re-download ~2 GB.
              enabled: true
              type: persistentVolumeClaim
              existingClaim: immich-ml-cache-fs
              globalMounts:
                - path: /cache

  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
