            bandwidth_max = 8M
            cache_limit = 1G
            web_dir = Glitter
            web_color = Auto
            https_cert = server.cert
            https_key = server.key
            https_chain = ""
            enable_https = 0
            inet_exposure = 0
            socks5_proxy_url = ""
            permissions = ""
            download_dir = /incomplete
            complete_dir = /media/complete
