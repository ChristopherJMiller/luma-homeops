---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mega-media-release
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://realliance.github.io/helm-mega-media
    chart: mega-media
    targetRevision: 0.14.0
    helm:
      releaseName: mm
      valuesObject:
        nodeName: middle
        # exportarr sidecars on every *arr + SABnzbd (named `metrics` port :9707),
        # scraped by the ServiceMonitor in cluster/media. Chart default is off.
        metrics:
          enabled: true
        postgresql:
          enabled: false
        externalPostgres:
          host: acid-media
          port: 5432
          username: postgres
          passwordFromSecretKeyRef:
            name: postgres.acid-media.credentials.postgresql.acid.zalan.do
            key: password
        reconciler:
          enabled: true
          # 0.9.0 runs the reconciler as a long-running Deployment that serves
          # /metrics on metricsPort 8000 (scraped by the reconciler PodMonitor in
          # cluster/media). The older pinned sha predates the metrics endpoint, so
          # advance the pin to a metrics-serving build. Pinning (vs :latest) still
          # forces the kubelet to pull instead of reusing a cached `:latest`.
          mode: deployment
          # c541948 (chart 0.14.0): per-*arr SAB field names, Plex Connect,
          # mediaManagement.
          tag: c541948
          # Sonarr/Radarr tell Plex to rescan the touched folder on import,
          # upgrade, rename and delete. Same Plex token Ombi uses.
          plexNotify:
            enabled: true
            tokenFromSecretKeyRef:
              name: ombi-bootstrap
              key: plex-token
        arrs:
          config:
            storageClassName: rook-ceph-block-ssd # #2665
            size: 8Gi
          # Explicit version tags: the chart's floating tags (v4 / release) with
          # pullPolicy IfNotPresent never re-pulled, so every *arr sat on whatever
          # image a node first cached (Sonarr was stuck at 4.0.0.748 from Dec 2023).
          # Bump these deliberately; pg_dump acid-media first.
          sonarr:
            enabled: true
            tag: release-4.0.20.3014
            apiKey:
              name: api-keys
              key: sonarr
            # Import subtitle sidecars that ship with a release (TRaSH).
            mediaManagement:
              importExtraFiles: true
              extraFileExtensions: srt,ass,ssa,sub,idx
            # Requests stay where they were (middle's memory *requests* sit ~89%);
            # only the ceiling rises. A metadata refresh downloads full-size
            # TMDB/TVDB artwork and resizes it in-process — Radarr OOMKilled at
            # the 300Mi chart default mid-refresh (2026-10-05), which is why the
            # poster cache never filled in. Same shape as plex below.
            resources:
              requests:
                memory: 400Mi
              limits:
                memory: 1Gi
          radarr:
            enabled: true
            tag: release-6.4.4.10685
            apiKey:
              name: api-keys
              key: radarr
            mediaManagement:
              importExtraFiles: true
              extraFileExtensions: srt,ass,ssa,sub,idx
            resources:
              requests:
                memory: 300Mi
              limits:
                memory: 1Gi
          lidarr:
            enabled: true
            tag: release-3.1.0.4875
            apiKey:
              name: api-keys
              key: lidarr
            resources:
              requests:
                memory: 300Mi
              limits:
                memory: 768Mi
          prowlarr:
            enabled: true
            tag: release-2.6.5.5623
            apiKey:
              name: api-keys
              key: prowlarr
        plex:
          enabled: true
          livenessProbe:
            failureThreshold: 25
          readinessProbe:
            failureThreshold: 25
          resources:
            # `middle` is a single node pinned by RWO media storage, and its
            # memory *requests* run near 100% while real usage sits ~44%. Plex
            # idles at ~100Mi and only needs headroom during transcode, so the
            # request is decoupled from the limit: request enough to schedule,
            # keep the 4Gi ceiling for transcode bursts. (Reverting to
            # request==limit re-pins 4Gi and OOM-rejects Plex on restart — this
            # bit us on the 0.9.0 rollout, 783 OutOfmemory pods.)
            requests:
              memory: 2Gi
              cpu: 1
            limits:
              memory: 4Gi
              # amd.com/gpu: 1  # TEMP removed 2026-07-16: middle's GPU fails init
              # on Talos 1.9 kernel 6.12 ("Unable to locate a BIOS ROM") — plex
              # was hard-down with 0 schedulable pods. Restore once GPU works.
          config:
            storageClassName: rook-ceph-block-ssd # #2665
            # Plex metadata + thumbnails + databases + daily DB backups live here.
            # The chart default (1Gi) is far too small — it filled to 81% and
            # starved thumbnail/artwork generation. rook-ceph-block allows online
            # expansion; RBD is thin-provisioned so this reserves nothing upfront.
            size: 30Gi
          transcode:
            # Transcoder scratch (TranscoderTempDirectory=/transcode). ssd: segments are
            # written and read back immediately; 20Gi holds a few concurrent 4K sessions.
            # Plex removes a session's files when it ends.
            storageClassName: rook-ceph-block-ssd # #2665
            size: 20Gi
          # The family archive (cluster/family/) as a second library source.
          # Read-only on purpose: Plex writes sidecars next to media by default,
          # and this volume is the curated, B2-mirrored source of truth — its
          # metadata belongs in mm-plex-config (which is backed up), not in the
          # archive. Add it in Plex as an "Other Videos" library on /family.
          # RWX CephFS, so it doesn't pin Plex to a node the way mm-media does.
          extraVolumes:
            - name: family
              persistentVolumeClaim:
                claimName: family-media
                readOnly: true
          extraVolumeMounts:
            - name: family
              mountPath: /family
              readOnly: true
        sabnzbd:
          tag: release-28cfd5e
          # New episodes/movies (aired in the last 14 days) jump the queue at
          # High; backlog keeps the category default. Faster time-to-watch
          # without touching bandwidth.
          downloadClient:
            recentPriority: 1
            olderPriority: -100
          livenessProbe:
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
            httpGet:
              path: /
              port: http
          readinessProbe:
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
            httpGet:
              path: /
              port: http
          apiKey:
            name: api-keys
            key: sabnzbd
          config:
            storageClassName: rook-ceph-block-ssd # #2665
          # download_dir scratch (chart 0.12.0): articles, par2 repair and unrar on ssd;
          # complete_dir stays on mm-media so *arr imports remain same-fs moves.
          # Bounded on purpose — it can never eat the ssd pool the databases need;
          # download_free in the ini pauses the queue before it fills.
          incomplete:
            enabled: true
            storageClassName: rook-ceph-block-ssd
            size: 64Gi
          resources:
            # Decoupled request/limit for the same reason as Plex (see above):
            # SABnzbd idles ~80Mi and only grows toward its 1G article cache +
            # par2 repair under load. Request 1Gi to schedule, keep 2Gi ceiling.
            requests:
              memory: 1Gi
              cpu: 1
            limits:
              memory: 2Gi
          servers:
            - name: news.eweka.nl
              enabled: true
              host: news.eweka.nl
              port: 563
              timeout: 60
              usernameFromSecretKeyRef:
                name: usenet-user-pass
                key: username
              passwordFromSecretKeyRef:
                name: usenet-user-pass
                key: password
              connections: 40
          # TEMPORARY (2026-10-05): bandwidth_max = 8M caps downloads at 8 MB/s
          # for the ~207-episode backfill. Every finished file lands on mm-media
          # (SMR HDDs, x3 replicas); >~25 GiB of sustained writes collapses OSD
          # latency (2026-09-21 ingest). Set back to "" once the backfill drains.
          ini: |
            helpful_warnings = 1
            host_whitelist = "sabnzbd.chrismiller.xyz"
            queue_complete = ""
            queue_complete_pers = 0
            bandwidth_perc = 100
            refresh_rate = 0
            interface_settings = ""
            queue_limit = 20
            config_lock = 0
            fixed_ports = 1
            notified_new_skin = 0
            direct_unpack_tested = 1
