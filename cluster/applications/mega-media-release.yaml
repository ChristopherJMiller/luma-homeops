        # Ombi — the family-facing request UI at requests.chrismiller.xyz, gated
        # by the oauth2-proxy FAMILY tier (cluster/media/ombi-ingress.yaml).
        #
        # Unlike every other workload in this release, Ombi is NOT pinned to
        # `middle`: it only speaks HTTP to the *arrs and Plex and never mounts the
        # RWO media PVC, so the chart deliberately omits nodeName/podAffinity for
        # it. That keeps it off the node whose memory requests are already tight.
        #
        # Ombi stores its configuration in its own database, not in files, so
        # there is nothing more to express here — auth mode, *arr connections,
        # quality profiles (the resolution cap), roles and the Discord agent are
        # applied by docs/ombi/bootstrap.sh against Ombi's settings API.
        ombi:
          enabled: true
          # External secret, not a chart-generated key: Argo can't tell install
          # from upgrade and would otherwise rotate the key on every sync.
          apiKey:
            name: api-keys
            key: ombi
          config:
            storageClassName: rook-ceph-block-ssd # #2665
            size: 1Gi
          resources:
            # Request/limit decoupled for the same reason as Plex and SABnzbd
            # above: Ombi idles small but the first-boot EF migrations and its
            # Plex/*arr sync jobs spike it. Request enough to schedule, keep the
            # ceiling for the spikes.
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
        # TRaSH-Guides profiles / custom formats / sizes / naming, synced on
        # every Argo sync (PostSync hook). Validated with `recyclarr sync
        # --preview` against the live *arrs 2026-10-05. Deviations from stock
        # TRaSH are deliberate: media lives on SMR HDDs (#2665 — bulk writes
        # hurt) and Plex has no hardware transcode.
        recyclarr:
          enabled: true
          tag: 8.7.2
          settings: |
            resource_providers:
              # Pinned: TRaSH changes land as a reviewed bump of this sha.
              - name: trash-guides-pinned
                type: trash-guides
                clone_url: https://github.com/TRaSH-Guides/Guides.git
                reference: e7c97a676743d7430fc1c5808701c48252a2ac63
                replace_default: true
          config: |
            sonarr:
              sonarr:
                base_url: http://mm-sonarr.media.svc.cluster.local:8989
                api_key: !env_var SONARR_API_KEY
                delete_old_custom_formats: true
                media_management:
                  propers_and_repacks: do_not_prefer   # Repack/Proper CFs score these instead
                media_naming:
                  series: plex-tvdb
                  season: default
                  episodes:
                    rename: true
                    standard: default
                    daily: default
                    anime: default
                quality_definition:
                  type: series
                  # TRaSH ships max 1000 / preferred 995 MB/min ("take the
                  # biggest"); cap 1080p so episodes stay ~1.5-3 GB on SMR.
                  qualities:
                    - { name: HDTV-1080p,   max: 125, preferred: 95 }
                    - { name: WEBRip-1080p, max: 130, preferred: 95 }
                    - { name: WEBDL-1080p,  max: 130, preferred: 95 }
                    - { name: Bluray-1080p, max: 155, preferred: 95 }
                quality_profiles:
                  # TRaSH WEB-1080p under the name Ombi's bootstrap resolves.
                  - trash_id: 72dae194fc92bf828f32cde7744e51a1
                    name: HD-1080p
                    upgrade:
                      allowed: true
                      until_quality: WEB 1080p
                      until_score: 1700   # TRaSH: 10000; stop at Tier 01/02 to limit SMR rewrite churn
                  # TRaSH [Anime] Remux-1080p minus Remux, for Usenet.
                  - trash_id: 20e0fc959f1f1704bed501f23bdae76f
                    name: Anime-1080p
                    min_format_score: 0   # TRaSH's 100 assumes fansub/BD tier CFs Usenet WEB posts rarely match
                    upgrade:
                      allowed: true
                      until_quality: Bluray-1080p
                      until_score: 1700
                    qualities:
                      - name: Bluray-1080p   # guide groups this with Bluray-1080p Remux; Remux dropped
                      - name: WEB 1080p
                        qualities: [WEBDL-1080p, WEBRip-1080p, HDTV-1080p]
                      - name: Bluray-720p
                      - name: WEB 720p
                        qualities: [WEBDL-720p, WEBRip-720p, HDTV-720p]
                      - name: Bluray-480p
                      - name: WEB 480p
                        qualities: [WEBDL-480p, WEBRip-480p]
                      - name: DVD
                      - name: SDTV
            radarr:
              radarr:
                base_url: http://mm-radarr.media.svc.cluster.local:7878
                api_key: !env_var RADARR_API_KEY
                delete_old_custom_formats: true
                media_management:
                  propers_and_repacks: do_not_prefer
                media_naming:
                  folder: plex-tmdb
                  movie:
                    rename: true
                    standard: plex-tmdb
                quality_definition:
                  type: movie
                  qualities:
                    - { name: WEBDL-1080p,  max: 100, preferred: 80 }
                    - { name: WEBRip-1080p, max: 100, preferred: 80 }
                    - { name: Bluray-1080p, max: 130, preferred: 95 }
                quality_profiles:
                  # TRaSH HD Bluray + WEB (no Remux, no BR-DISK), under Ombi's name.
                  - trash_id: d1d67249d3890e49bc12e275d989a7e9
                    name: HD-1080p
                    upgrade:
                      allowed: true
                      until_quality: Bluray-1080p
                      until_score: 1700
        # Rule-based cleanup (e.g. Love is Blind: keep only the airing season).
        # API-only, any node; UI is behind the oauth2 admin tier
        # (cluster/media/maintainerr-ingress.yaml) — it has no auth of its own.
        maintainerr:
          enabled: true
          config:
            storageClassName: rook-ceph-block-ssd # #2665
            size: 1Gi
        media:
          storageClassName: rook-ceph-block
          size: 3000Gi
        ingress:
          className: traefik
          endpoints:
            plex:
              enabled: true
              annotations:
                traefik.ingress.kubernetes.io/router.middlewares: traefik-strip-csp@kubernetescrd
              hosts:
                - host: plex.chrismiller.xyz
                  paths:
                    - path: /
                      pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
