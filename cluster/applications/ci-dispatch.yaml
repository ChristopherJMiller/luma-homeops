---
# ci-dispatch: launches one `tiny` runner Job per waiting Forgejo Actions job on
# git.realliance.net, within each owner's limits. Two namespaces from one app:
# `ci-dispatch` (the dispatcher) and `ci-tiny` (the runner Jobs). Manifests in
# cluster/ci-dispatch; static tests scripts/test_ci_dispatch_manifests.py.
# Plan: docs/superpowers/plans/2026-11-04-runner-classes-phase-0-1.md.
#
# NOT LISTED in cluster/applications/kustomization.yaml until Task 18 deploys it.
#
# To undo a deploy, roll back by rendering nothing, never by deleting this file:
# cluster/ci-dispatch/kustomization.yaml -> `resources: []`. allowEmpty lets Argo prune everything,
# but the Namespace ci-dispatch and the PVC carry Prune=false,Delete=false, so the ledger survives.
# There is no resources-finalizer, so deleting this file would orphan the lot and leave it running.
# Break-glass: scale the StatefulSet to 0, then delete the Jobs in ci-tiny.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-dispatch
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/ChristopherJMiller/luma-homeops.git
    path: cluster/ci-dispatch
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      # The namespaces are manifests: ci-dispatch's carries Prune=false,Delete=false (D5), ci-tiny's
      # carries Pod Security `restricted`.
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
