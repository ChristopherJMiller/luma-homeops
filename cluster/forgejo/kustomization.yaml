---
# Forgejo (git.realliance.net) — plumbing only: namespace, volumes, database, secrets and backups.
# Forgejo itself is the Helm release in cluster/applications/forgejo-release.yaml.
# Spec: docs/superpowers/specs/2026-11-02-realliance-forge-design.md · Runbook: docs/forgejo.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
resources:
  - namespace.yaml
  - logical-backup-s3.yaml
  - patroni-restapi.yaml
  - app-ini.yaml
  - oidc.yaml
  - admin.yaml
  - signing.yaml
  - pvcs.yaml
  - psql.yaml
  - backup-rbac.yaml
  - backup-b2.yaml
  - backup-cronjob.yaml
configMapGenerator:
  # Forgejo custom/ template overrides, mounted by the Helm release (forgejo-release.yaml).
  - name: forgejo-custom-templates
    files:
      - user-settings-navbar.tmpl=custom/templates/user/settings/navbar.tmpl
      - custom-header.tmpl=custom/templates/custom/header.tmpl # loads realliance-fonts.css on every page
    options:
      disableNameSuffixHash: true # referenced by name from the other Application
  # Catppuccin themes (custom/public/CATPPUCCIN.md): two maps because one ConfigMap is capped at 1 MiB.
  - name: forgejo-themes-1
    files:
      - custom/public/assets/css/theme-catppuccin-frappe-blue.css
      - custom/public/assets/css/theme-catppuccin-frappe-flamingo.css
      - custom/public/assets/css/theme-catppuccin-frappe-green.css
      - custom/public/assets/css/theme-catppuccin-frappe-lavender.css
      - custom/public/assets/css/theme-catppuccin-frappe-maroon.css
      - custom/public/assets/css/theme-catppuccin-frappe-mauve.css
      - custom/public/assets/css/theme-catppuccin-frappe-peach.css
      - custom/public/assets/css/theme-catppuccin-frappe-pink.css
      - custom/public/assets/css/theme-catppuccin-frappe-red.css
      - custom/public/assets/css/theme-catppuccin-frappe-rosewater.css
      - custom/public/assets/css/theme-catppuccin-frappe-sapphire.css
      - custom/public/assets/css/theme-catppuccin-frappe-sky.css
      - custom/public/assets/css/theme-catppuccin-frappe-teal.css
      - custom/public/assets/css/theme-catppuccin-frappe-yellow.css
      - custom/public/assets/css/theme-catppuccin-latte-blue.css
      - custom/public/assets/css/theme-catppuccin-latte-flamingo.css
      - custom/public/assets/css/theme-catppuccin-latte-green.css
      - custom/public/assets/css/theme-catppuccin-latte-lavender.css
      - custom/public/assets/css/theme-catppuccin-latte-maroon.css
      - custom/public/assets/css/theme-catppuccin-latte-mauve.css
      - custom/public/assets/css/theme-catppuccin-latte-peach.css
      - custom/public/assets/css/theme-catppuccin-latte-pink.css
      - custom/public/assets/css/theme-catppuccin-latte-red.css
      - custom/public/assets/css/theme-catppuccin-latte-rosewater.css
      - custom/public/assets/css/theme-catppuccin-latte-sapphire.css
      - custom/public/assets/css/theme-catppuccin-latte-sky.css
      - custom/public/assets/css/theme-catppuccin-latte-teal.css
      - custom/public/assets/css/theme-catppuccin-latte-yellow.css
    options:
      disableNameSuffixHash: true
      annotations:
        # ~620 KB: client-side apply's last-applied annotation would exceed the 256 KB cap
        argocd.argoproj.io/sync-options: ServerSideApply=true
  - name: forgejo-themes-2
    files:
      - custom/public/assets/css/theme-catppuccin-blue-auto.css
      - custom/public/assets/css/theme-catppuccin-flamingo-auto.css
      - custom/public/assets/css/theme-catppuccin-green-auto.css
      - custom/public/assets/css/theme-catppuccin-lavender-auto.css
      - custom/public/assets/css/theme-catppuccin-macchiato-blue.css
      - custom/public/assets/css/theme-catppuccin-macchiato-flamingo.css
      - custom/public/assets/css/theme-catppuccin-macchiato-green.css
      - custom/public/assets/css/theme-catppuccin-macchiato-lavender.css
      - custom/public/assets/css/theme-catppuccin-macchiato-maroon.css
      - custom/public/assets/css/theme-catppuccin-macchiato-mauve.css
      - custom/public/assets/css/theme-catppuccin-macchiato-peach.css
      - custom/public/assets/css/theme-catppuccin-macchiato-pink.css
      - custom/public/assets/css/theme-catppuccin-macchiato-red.css
      - custom/public/assets/css/theme-catppuccin-macchiato-rosewater.css
      - custom/public/assets/css/theme-catppuccin-macchiato-sapphire.css
      - custom/public/assets/css/theme-catppuccin-macchiato-sky.css
      - custom/public/assets/css/theme-catppuccin-macchiato-teal.css
      - custom/public/assets/css/theme-catppuccin-macchiato-yellow.css
      - custom/public/assets/css/theme-catppuccin-maroon-auto.css
      - custom/public/assets/css/theme-catppuccin-mauve-auto.css
      - custom/public/assets/css/theme-catppuccin-mocha-blue.css
      - custom/public/assets/css/theme-catppuccin-mocha-flamingo.css
      - custom/public/assets/css/theme-catppuccin-mocha-green.css
      - custom/public/assets/css/theme-catppuccin-mocha-lavender.css
      - custom/public/assets/css/theme-catppuccin-mocha-maroon.css
      - custom/public/assets/css/theme-catppuccin-mocha-mauve.css
      - custom/public/assets/css/theme-catppuccin-mocha-peach.css
      - custom/public/assets/css/theme-catppuccin-mocha-pink.css
      - custom/public/assets/css/theme-catppuccin-mocha-red.css
      - custom/public/assets/css/theme-catppuccin-mocha-rosewater.css
      - custom/public/assets/css/theme-catppuccin-mocha-sapphire.css
      - custom/public/assets/css/theme-catppuccin-mocha-sky.css
      - custom/public/assets/css/theme-catppuccin-mocha-teal.css
      - custom/public/assets/css/theme-catppuccin-mocha-yellow.css
      - custom/public/assets/css/theme-catppuccin-peach-auto.css
      - custom/public/assets/css/theme-catppuccin-pink-auto.css
      - custom/public/assets/css/theme-catppuccin-red-auto.css
      - custom/public/assets/css/theme-catppuccin-rosewater-auto.css
      - custom/public/assets/css/theme-catppuccin-sapphire-auto.css
      - custom/public/assets/css/theme-catppuccin-sky-auto.css
      - custom/public/assets/css/theme-catppuccin-teal-auto.css
      - custom/public/assets/css/theme-catppuccin-yellow-auto.css
    options:
      disableNameSuffixHash: true
      annotations:
        # ~620 KB: client-side apply's last-applied annotation would exceed the 256 KB cap
        argocd.argoproj.io/sync-options: ServerSideApply=true
  # Realliance typography (custom/FONTS.md): Atkinson Hyperlegible, Fredoka, Noto Sans Mono, self-hosted.
  # The stylesheet joins the projected css/ directory with the themes; the fonts get a directory of
  # their own. Together ~0.2 MiB, far under the 1 MiB ConfigMap cap, so one map each.
  - name: forgejo-font-css
    files:
      - custom/public/assets/css/realliance-fonts.bcecc5eb.css
    options:
      disableNameSuffixHash: true
  - name: forgejo-fonts
    files:
      - custom/public/assets/fonts/atkinson-hyperlegible-Regular.6bfd7bdd.woff2
      - custom/public/assets/fonts/atkinson-hyperlegible-Italic.2b0d2720.woff2
      - custom/public/assets/fonts/atkinson-hyperlegible-Bold.88941f37.woff2
      - custom/public/assets/fonts/atkinson-hyperlegible-BoldItalic.ab97d8a1.woff2
      - custom/public/assets/fonts/fredoka-latin.ea2eb254.woff2
      - custom/public/assets/fonts/noto-sans-mono-latin.c35407ae.woff2
      - custom/public/assets/fonts/OFL-atkinson-hyperlegible.txt
      - custom/public/assets/fonts/OFL-fredoka.txt
      - custom/public/assets/fonts/OFL-noto-sans-mono.txt
    options:
      disableNameSuffixHash: true
      annotations:
        # ~0.2 MiB base64: near enough client-side apply's 256 KB last-applied cap to avoid it
        argocd.argoproj.io/sync-options: ServerSideApply=true
  # Realliance logo (custom/BRAND.md): navbar/home logo (3d, -auto), favicon, apple-touch, logo.png, and
  # baked mocha/latte logos that the stylesheet swaps in for fixed themes. ~45 KB, far under 1 MiB.
  - name: forgejo-img
    files:
      - custom/public/assets/img/logo.svg
      - custom/public/assets/img/logo-mocha.efbf5c27.svg
      - custom/public/assets/img/logo-latte.4d495f38.svg
      - custom/public/assets/img/logo.png
      - custom/public/assets/img/favicon.svg
      - custom/public/assets/img/favicon.png
      - custom/public/assets/img/apple-touch-icon.png
    options:
      disableNameSuffixHash: true
patches:
  - target: {kind: SealedSecret, name: patroni-restapi}
    patch: |- # fail-closed dependency of every Spilo pod (D7): never prune it
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: patroni-restapi
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
