---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-home-automation
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
data:
  home-automation.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Home Assistant (homeassistant_* series from its prometheus integration, scraped via cluster/prometheus-stack/ha-scrapeconfig.yaml) and the Mosquitto broker (broker_* via its exporter sidecar).",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "description": "HA's own process. Home Assistant's prometheus integration (packages/prometheus.yaml), scraped every 60s (cluster/prometheus-stack/ha-scrapeconfig.yaml).",
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "expr": "up{job=\"home-assistant\"}",
              "refId": "A",
              "legendFormat": "scrape"
            },
            {
              "expr": "time() - process_start_time_seconds{job=\"home-assistant\"}",
              "refId": "B",
              "legendFormat": "uptime"
            },
            {
              "expr": "process_resident_memory_bytes{job=\"home-assistant\"}",
              "refId": "C",
              "legendFormat": "memory"
            },
            {
              "expr": "rate(process_cpu_seconds_total{job=\"home-assistant\"}[5m]) * 100",
              "refId": "D",
              "legendFormat": "cpu"
            }
          ],
          "title": "System Health",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dtdurations"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "C"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "D"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  }
                ]
              }
            ]
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "textMode": "auto"
          }
        },
        {
          "datasource": "Prometheus",
          "description": "Entities per domain (homeassistant_entity_available is exported for every entity).",
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "count by (domain) (homeassistant_entity_available{domain=~\"sensor|binary_sensor|light|switch|fan|cover|climate|automation\"})",
              "refId": "A",
              "legendFormat": "{{domain}}",
              "instant": true
            }
          ],
          "title": "Entity Summary",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "textMode": "auto"
          }
        },
        {
          "datasource": "Prometheus",
          "description": "State changes per minute by domain. A domain that jumps here is usually a flapping device (hactl history --flaps finds it).",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "id": 3,
          "targets": [
            {
              "expr": "sum by (domain) (rate(homeassistant_state_change_total[5m])) * 60",
              "refId": "A",
              "legendFormat": "{{domain}}"
            }
          ],
          "title": "Entity State Changes",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "cpm"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "datasource": "Prometheus",
          "description": "Time since each automation entity last changed: a run (last_triggered moves), an on/off toggle, or HA restarting or reloading automations, which resets it. For actual runs see Most Triggered Automations.",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "id": 4,
          "targets": [
            {
              "expr": "sort(time() - homeassistant_last_updated_time_seconds{domain=\"automation\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "format": "table"
            }
          ],
          "title": "Automations: Time Since Last Change",
          "type": "table",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "dtdurations"
            },
            "overrides": []
          },
          "options": {},
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "domain": true,
                  "job": true,
                  "instance": true
                },
                "renameByName": {
                  "entity": "Automation",
                  "friendly_name": "Name",
                  "Value": "Since"
                }
              }
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "description": "Entities HA reports unavailable right now. Empty means everything is reachable.",
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "id": 5,
          "targets": [
            {
              "expr": "homeassistant_entity_available == 0",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "format": "table"
            }
          ],
          "title": "Unavailable Entities",
          "type": "table",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {},
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "domain": true,
                  "job": true,
                  "instance": true
                },
                "renameByName": {
                  "entity": "Entity",
                  "friendly_name": "Name",
                  "Value": "Available"
                }
              }
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "description": "Resident memory of the HA process (the database size and per-component memory are not exported).",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 10
          },
          "id": 6,
          "targets": [
            {
              "expr": "process_resident_memory_bytes{job=\"home-assistant\"}",
              "refId": "A",
              "legendFormat": "resident"
            }
          ],
          "title": "HA Memory",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "datasource": "Prometheus",
          "description": "Prometheus targets behind this dashboard. (The old zigbee/zwave/wifi rows queried jobs that never existed.)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 10
          },
          "id": 7,
          "targets": [
            {
              "expr": "up{job=\"home-assistant\"}",
              "refId": "A",
              "legendFormat": "home assistant"
            },
            {
              "expr": "up{job=\"mosquitto\"}",
              "refId": "B",
              "legendFormat": "mosquitto"
            }
          ],
          "title": "Scrape Targets",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "textMode": "auto"
          }
        },
        {
          "datasource": "Prometheus",
          "description": "The mosquitto-exporter sidecar prefixes every series broker_, not mosquitto_ -- and nothing was scraping it until a ServiceMonitor was added 2026-09-23 (cluster/home-assistant/mosquitto-servicemonitor.yaml).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 14
          },
          "id": 8,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "text": {},
            "textMode": "auto"
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "broker_uptime",
              "refId": "A",
              "legendFormat": "uptime"
            },
            {
              "expr": "broker_connection_up",
              "refId": "B",
              "legendFormat": "broker up"
            }
          ],
          "title": "MQTT Broker Health",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "The mosquitto-exporter sidecar prefixes every series broker_, not mosquitto_ -- and nothing was scraping it until a ServiceMonitor was added 2026-09-23 (cluster/home-assistant/mosquitto-servicemonitor.yaml).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 14
          },
          "id": 9,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "text": {},
            "textMode": "auto"
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "broker_clients_connected",
              "refId": "A",
              "legendFormat": "connected"
            }
          ],
          "title": "Connected Clients",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "The mosquitto-exporter sidecar prefixes every series broker_, not mosquitto_ -- and nothing was scraping it until a ServiceMonitor was added 2026-09-23 (cluster/home-assistant/mosquitto-servicemonitor.yaml).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "ops"
            }
          },
          "gridPos": {
            "h": 6,
            "w": 16,
            "x": 8,
            "y": 14
          },
          "id": 10,
          "options": {
            "tooltip": {
              "mode": "multi"
            },
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "rate(broker_publish_messages_received[5m])",
              "refId": "A",
              "legendFormat": "Published in"
            },
            {
              "expr": "rate(broker_publish_messages_sent[5m])",
              "refId": "B",
              "legendFormat": "Published out"
            },
            {
              "expr": "rate(broker_publish_messages_dropped[5m])",
              "refId": "C",
              "legendFormat": "Dropped"
            }
          ],
          "title": "Message Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Was a per-topic pie chart. The exporter reads mosquitto $SYS counters, which have no per-topic breakdown, so topk over a topic label could never work. Total subscription count is what $SYS exposes.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                }
              },
              "mappings": [],
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 18
          },
          "id": 11,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "values": [
                "value",
                "percent"
              ]
            },
            "pieType": "donut",
            "tooltip": {
              "mode": "single"
            },
            "displayLabels": [
              "name",
              "percent"
            ],
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "broker_subscriptions_count",
              "refId": "A",
              "legendFormat": "subscriptions"
            }
          ],
          "title": "Subscriptions",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "The mosquitto-exporter sidecar prefixes every series broker_, not mosquitto_ -- and nothing was scraping it until a ServiceMonitor was added 2026-09-23 (cluster/home-assistant/mosquitto-servicemonitor.yaml).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "displayMode": "auto"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 20
          },
          "id": 12,
          "options": {
            "showHeader": true,
            "sortBy": [
