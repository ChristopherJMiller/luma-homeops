---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-database-storage
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
data:
  database-storage.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "PostgreSQL clusters, Redis instances, Ceph storage cluster, and persistent storage metrics with performance monitoring",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "description": "PostgreSQL cluster health overview",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "text": {
              "titleSize": 18,
              "valueSize": 24
            },
            "textMode": "value_and_name"
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "up{job=\"kubernetes-pods\",pod=~\"acid-auth.*\"} OR on() vector(0)",
              "legendFormat": "acid-auth",
              "refId": "A"
            },
            {
              "expr": "up{job=~\".*postgres.*\",cluster=~\".*chrismillerxyz.*\"} OR up{job=~\".*acid-chrismillerxyz.*\"} OR on() vector(0)",
              "legendFormat": "acid-chrismillerxyz",
              "refId": "B"
            },
            {
              "expr": "up{job=~\".*postgres.*\",cluster=~\".*ha.*\"} OR up{job=~\".*acid-ha.*\"} OR on() vector(0)",
              "legendFormat": "acid-ha",
              "refId": "D"
            },
            {
              "expr": "up{job=~\".*postgres.*\",cluster=~\".*media.*\"} OR up{job=~\".*acid-media.*\"} OR on() vector(0)",
              "legendFormat": "acid-media",
              "refId": "E"
            }
          ],
          "title": "PostgreSQL Cluster Health",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "pg_stat_database carries no cluster_name label -- the old query grouped by it and collapsed to one unlabelled series. Each Zalando cluster lives in its own namespace.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "percentage",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "id": 2,
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showUnfilled": true
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum by (namespace) (pg_stat_database_numbackends{datname!~\"template.*|postgres\"})",
              "refId": "A",
              "legendFormat": "{{namespace}}"
            }
          ],
          "title": "Active Connections by Cluster",
          "type": "bargauge"
        },
        {
          "datasource": "Prometheus",
          "description": "Database query latency percentiles",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 100
                  }
                ]
              },
              "unit": "ms"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "id": 3,
          "options": {
            "tooltip": {
              "mode": "multi"
            },
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "fontSize": "12px"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "avg(rate(pg_stat_database_blk_read_time[5m]) + rate(pg_stat_database_blk_write_time[5m])) > 0 OR on() vector(0)",
              "legendFormat": "Avg Query Time",
              "refId": "A"
            },
            {
              "expr": "max(rate(pg_stat_database_blk_read_time[5m]) + rate(pg_stat_database_blk_write_time[5m])) > 0 OR on() vector(0)",
              "legendFormat": "Max Query Time",
              "refId": "B"
            },
            {
              "expr": "avg(pg_stat_database_tup_fetched) OR on() vector(0)",
              "legendFormat": "Tuples Fetched",
              "refId": "C"
            }
          ],
          "title": "Database Query Latency",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Commits plus rollbacks, grouped by namespace because pg_stat_database has no cluster_name label.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "ops"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "id": 4,
          "options": {
            "tooltip": {
              "mode": "multi"
            },
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "fontSize": "12px"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum by (namespace) (rate(pg_stat_database_xact_commit[5m]) + rate(pg_stat_database_xact_rollback[5m]))",
              "refId": "A",
              "legendFormat": "{{namespace}}"
            }
          ],
          "title": "Transactions Per Second",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Fallback removed: it ended in OR on() vector(95), so a collection failure would have rendered a healthy-looking 95 percent.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 85
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 10
          },
          "id": 5,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "text": {}
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "avg(pg_stat_database_blks_hit / (pg_stat_database_blks_hit + pg_stat_database_blks_read + 1) * 100)",
              "refId": "A",
              "legendFormat": "hit ratio"
            }
          ],
          "title": "Cache Hit Ratio",
          "type": "gauge"
        },
        {
          "datasource": "Prometheus",
          "description": "postgres_exporter emits pg_replication_lag_seconds; the old query used pg_replication_lag, which does not exist.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 10
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "text": {},
            "textMode": "auto"
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "max(pg_replication_lag_seconds)",
              "refId": "A",
              "legendFormat": "lag"
            }
          ],
          "title": "Replication Lag",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "Database size growth trend",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "bytes"
            }
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "id": 7,
          "options": {
            "tooltip": {
              "mode": "multi"
            },
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "fontSize": "12px"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "pg_database_size_bytes OR on() vector(0)",
              "legendFormat": "{{datname}}",
              "refId": "A"
            }
          ],
          "title": "Database Size Growth",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "pg_stat_statements is not exported here, so pg_stat_statements_mean_time_seconds was dead. Longest open transaction per database is the available signal for something stuck.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "displayMode": "auto"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "id": 8,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Mean Time"
              }
            ]
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "topk(10, max by (namespace, datname) (pg_stat_activity_max_tx_duration))",
              "refId": "A",
              "legendFormat": "{{namespace}}/{{datname}}",
              "format": "table",
              "instant": true
            }
          ],
          "title": "Longest Running Transactions",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {},
                "renameByName": {
                  "queryid": "Query ID",
                  "Value": "Mean Time",
                  "calls": "Calls",
                  "total_time": "Total Time"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": "Prometheus",
          "description": "Immich's job queue. Scraped by redis_exporter (cluster/immich/valkey-exporter.yaml) since 2026-09-23; before that nothing scraped any Redis here and this panel showed a hardcoded zero.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 30
          },
          "id": 9,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "text": {
              "titleSize": 16,
              "valueSize": 20
            },
            "textMode": "value_and_name"
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "redis_up",
              "refId": "A",
              "legendFormat": "{{namespace}}"
            }
          ],
          "title": "Valkey Health",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "Was a Redis query whose OR on() vector(50) fallback invented a flat 50 percent. Nothing scrapes Redis on this cluster, so this tracks the Postgres pods that are actually monitored.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 30
          },
          "id": 10,
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showUnfilled": true
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{pod=~\"acid-.*\"}) / sum by (pod) (kube_pod_container_resource_limits{pod=~\"acid-.*\",resource=\"memory\"}) * 100",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "title": "Postgres Memory vs Limit",
          "type": "bargauge"
        },
        {
          "datasource": "Prometheus",
          "description": "The old query ended in OR on() vector(95), which invented a flat 95 percent whenever the metric was absent -- which was always.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "green",
                    "value": 90
                  }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 30
          },
          "id": 11,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "text": {
              "titleSize": 16,
              "valueSize": 20
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) * 100",
              "refId": "A",
              "legendFormat": "hit rate"
            }
          ],
          "title": "Valkey Cache Hit Rate",
          "type": "gauge"
        },
        {
          "datasource": "Prometheus",
          "description": "Redis operations per second",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "ops"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 36
          },
          "id": 12,
          "options": {
            "tooltip": {
              "mode": "multi"
            },
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "fontSize": "12px"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "rate(redis_commands_processed_total[5m])",
              "refId": "A",
              "legendFormat": "ops/s"
            }
          ],
          "title": "Valkey Operations Per Second",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Completes the Valkey section. Replaces a Redis latency heatmap whose histogram was never exported; rising memory here with non-zero evictions on panel 15 means Immich job state is being dropped.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "scaleDistribution": {
                  "type": "linear"
                }
              }
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 36
          },
          "id": 13,
          "options": {
            "calculate": false,
            "cellGap": 1,
            "color": {
              "exponent": 0.5,
              "fill": "dark-orange",
              "mode": "scheme",
              "reverse": false,
              "scale": "exponential",
              "scheme": "Oranges",
              "steps": 64
            },
            "exemplars": {
              "color": "rgba(255,0,255,0.7)"
            },
            "filterValues": {
              "le": 1E-9
            },
            "legend": {
              "show": true
            },
            "rowsFrame": {
              "layout": "auto"
            },
            "tooltip": {
              "show": true,
              "yHistogram": false
            },
            "yAxis": {
              "axisPlacement": "left",
              "reverse": false,
              "unit": "s"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "redis_memory_used_bytes",
              "refId": "A",
              "legendFormat": "used"
            }
          ],
          "title": "Valkey Memory Used",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Number of connected Redis clients",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
