---
# Forgejo Actions runner for git.realliance.net: forgejo-runner v13.2.1 in HOST mode, label `galaxy`.
# Jobs run inside this pod as uid 1000, with no Kubernetes token and no Docker. Registered per repo
# (an allowlist: realliance-ops/forge-bot, and realliance-ops/ci-dispatch since runner classes Task 5;
# both in the Owners-only org since 2026-11-04, matched by repo id 94 and 240): one
# server.connections entry per registration in the sealed config.yml. Both repos have the same writers,
# the premise for sharing this pod. Specs: docs/superpowers/specs/2026-11-02-forge-bot-and-ci-design.md,
# docs/superpowers/specs/2026-11-04-runner-classes-design.md ("Build")
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo-runner
resources:
  - namespace.yaml
  - pvc.yaml
  - runner-config.yaml
  - deployment.yaml
# NetworkPolicy (netpol plan Task 8, B2; design §6.3): default-deny, DNS, and egress to the forge
# through the WAN /25 on 443 plus the public internet; never the cluster, the LAN, the tailnet or the
# router's own services. This kustomization's namespace puts the components' policies in forgejo-runner.
# deployment.yaml's netpol-gate holds the runner back until they are enforced for its pod.
components:
  - ../components/netpol/default-deny
  - ../components/netpol/allow-dns
  - ../components/netpol/egress-internet-only
