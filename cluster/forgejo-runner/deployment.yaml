---
# forgejo-runner daemon, host mode. Every job runs IN THIS POD as uid 1000: it can read the connection
# tokens (config.yml) and the shared caches, and reach what any pod reaches. It holds no other
# credential (no Forgejo admin token, no Keycloak secret, no Kubernetes token).
#
# What persists, all on the forgejo-runner-work PVC:
#   /work/act/<rand>   one job's workdir; the runner deletes it when the job ends (not if it is killed)
#   /work/home, /work/tmp   HOME and TMPDIR, which every job inherits: shared between the jobs of one
#                           pod lifetime (a job can leave ~/.gitconfig or go env behind for the next)
#   /work/cache        actions cache, Go build/module caches: kept until the PVC is deleted
#   /work/.runner      registration file; not written while config.yml declares the connection
# The start command wipes /work/act, /work/home and /work/tmp, so `kubectl rollout restart` clears
# every job's state except the caches. Clearing the caches too: scale to 0, delete the PVC (S4).
# Security model and accepted risk: the forge-bot + CI spec, "Security model, plainly".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate # one RWO work volume
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch # don't re-chown the whole cache on every start
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          # Not `top`: it runs hottest (#2603), and CI is the most CPU-hungry thing here.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [top]
            # Then `middle`: it has the most memory-request headroom (2026-11-03: top 85 %,
            # middle 82 %, bottom 89 % with the runner; NodeMemoryRequestsHigh fires > 90 %).
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [middle]
      # netpol-gate (netpol plan Task 8, B2; design §6.3): the runner must not register or take a job
      # until this pod's egress is enforced. Without NRI the enforcer enrols a new pod's IP a moment
      # after the pod starts, and a job before that would run unconfined. A timeout to the API
      # ClusterIP means the packet was dropped, so the policy is live and the gate passes; a connect,
      # or any error such as a refusal, means not yet, so it waits.
      # Never allow the API server in this namespace's egress, or this gate waits forever.
      initContainers:
        - name: netpol-gate
          # Keep this image equal to the runner's; netpol-manifests (pre-commit) fails otherwise, and
          # Renovate bumps both lines together.
          image: ghcr.io/christopherjmiller/forgejo-runner:sha-6b269ab@sha256:3bb2fca689b0c986039be061a4201580488c30bcdcb476815f80d737f97b76e9
          command:
            - sh
            - -c
            - |
              until node -e 'const s=require("net").connect({host:"10.96.0.1",port:443,timeout:3000});
                s.on("connect",()=>process.exit(1));s.on("timeout",()=>process.exit(0));
                s.on("error",()=>process.exit(1))'; do
                echo "egress not enforced yet; waiting"; sleep 3
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: runner
          # images/forgejo-runner (forgejo-runner v13.2.1, Go, ko, Node, git, gcc), built by GitHub
          # Actions. Renovate bumps the Dockerfile; this pin is a second, manual commit.
          image: ghcr.io/christopherjmiller/forgejo-runner:sha-6b269ab@sha256:3bb2fca689b0c986039be061a4201580488c30bcdcb476815f80d737f97b76e9
          command:
            - sh
            - -c
            - rm -rf /work/home /work/tmp /work/act && mkdir -p /work/act /work/cache /work/home /work/tmp && exec forgejo-runner daemon --config /etc/forgejo-runner/config.yml
          env:
            - name: HOME
              value: /work/home
            - name: TMPDIR
              value: /work/tmp
            - name: GOMAXPROCS
              value: "2"
            - name: GOFLAGS
              value: -p=2
            - name: GOCACHE
              value: /work/cache/go-build
            - name: GOMODCACHE
              value: /work/cache/go-mod
            - name: GOPATH
              value: /work/cache/gopath
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: config
              mountPath: /etc/forgejo-runner
              readOnly: true
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: forgejo-runner-work
        - name: config
          secret:
            secretName: forgejo-runner-config # SealedSecret runner-config.yaml
