---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: fs-pool
  namespace: rook
spec:
  metadataPool:
    replicated:
      size: 3
  dataPools:
    - name: replicated
      replicated:
        size: 3
  preserveFilesystemOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-fs
  annotations:
    # StorageClass.parameters are immutable, so a plain apply fails with
    # "updates to parameters are forbidden" and the app sticks OutOfSync.
    # Replace lets Argo delete+recreate instead. Safe: existing PVs keep
    # their own copy of the parameters, so bound volumes are unaffected.
    # Replace alone still uses `kubectl replace`, which cannot change an
    # immutable field; Force makes it delete+recreate.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
provisioner: rook.cephfs.csi.ceph.com
parameters:
  # clusterID is the namespace where the rook cluster is running
  # If you change this namespace, also change the namespace below where the secret namespaces are defined
  clusterID: rook

  # CephFS filesystem name into which the volume shall be created
  fsName: fs-pool

  # Ceph pool into which the volume shall be created
  # Required for provisionVolume: "true"
  pool: fs-pool-replicated

  # The secrets contain Ceph admin credentials. These are generated automatically by the operator
  # in the same namespace as the cluster.
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook

  # The mons only speak msgr2 on :3300 and the kernel cephfs client defaults to
  # msgr1 there, so without this every mount fails with "no mds is up" (dmesg:
  # "socket closed (con state V1_BANNER)"). RBD gets the equivalent from the
  # cluster-wide rbd_default_map_options; cephfs needs it per mount. The static
  # PVs in cluster/family and cluster/backups carry the same option.
  kernelMountOptions: ms_mode=prefer-crc
reclaimPolicy: Retain
allowVolumeExpansion: true
