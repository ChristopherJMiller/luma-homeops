---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: fs-pool
  namespace: rook
spec:
  metadataPool:
    deviceClass: ssd # 0.3 GB, latency-bound; moved to the ssd tier 2026-10-04 (#2665)
    replicated:
      size: 3
  dataPools:
    - name: replicated
      deviceClass: hdd
      replicated:
        size: 3
  preserveFilesystemOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: true
    # Luma 0b: a real request, plus a limit, because Rook derives the cache
    # from the limit: mds_cache_memory_limit = 4Gi x 0.5 = 2 GiB (the cache
    # held 0.89 GB on 2026-10-22). Rook writes it to the mon config store,
    # so a revert must also `ceph config rm mds.fs-pool-{a,b}
    # mds_cache_memory_limit` (see the 0b plan, Task 11).
    resources:
      requests:
        memory: 1664Mi
      limits:
        memory: 4Gi
    # Rook's default too, but set explicitly: a default can change under an upgrade.
    cacheMemoryLimitFactor: 0.5
    # With a request and priority 0 the MDS would become a preemption victim,
    # for example of the standby mgr during a drain.
    priorityClassName: system-cluster-critical
    placement:
      podAntiAffinity:
        # a and b on different nodes
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: rook-ceph-mds
              topologyKey: kubernetes.io/hostname
      nodeAffinity:
        # Request capacity only. Written (0b Task 11) to keep middle free for
        # nfs-ganesha; since 0b ruling R8 (2026-10-22) ganesha prefers bottom
        # instead, so this now just spreads the MDS pods onto top and bottom.
        # Changing it rolls the MDS, so it stays until a capacity re-plan.
        # Preferred, so a drain can always re-place it.
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - middle
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-fs
  annotations:
    # StorageClass.parameters are immutable, so a plain apply fails with
    # "updates to parameters are forbidden" and the app sticks OutOfSync.
    # Replace lets Argo delete+recreate instead. Safe: existing PVs keep
    # their own copy of the parameters, so bound volumes are unaffected.
    # Replace alone still uses `kubectl replace`, which cannot change an
    # immutable field; Force makes it delete+recreate.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
provisioner: rook.cephfs.csi.ceph.com
parameters:
  # clusterID is the namespace where the rook cluster is running
  # If you change this namespace, also change the namespace below where the secret namespaces are defined
  clusterID: rook

  # CephFS filesystem name into which the volume shall be created
  fsName: fs-pool

  # Ceph pool into which the volume shall be created
  # Required for provisionVolume: "true"
  pool: fs-pool-replicated

  # The secrets contain Ceph admin credentials. These are generated automatically by the operator
  # in the same namespace as the cluster.
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook

reclaimPolicy: Retain
allowVolumeExpansion: true
