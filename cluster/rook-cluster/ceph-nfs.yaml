---
# CephNFS spins up an NFS-Ganesha server backed by CephFS so non-k8s
# clients (satellites) can mount cluster-backed storage. Per-export
# configuration lives in ceph-nfs-exports.yaml as a declarative Argo
# Sync-hook Job (Rook's CRD doesn't expose exports directly).
apiVersion: ceph.rook.io/v1
kind: CephNFS
metadata:
  name: satellites
  namespace: rook
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  rados:
    pool: builtin-mgr
    namespace: nfs-satellites
  server:
    active: 1
    logLevel: NIV_INFO
    # Luma 0b: a real request, with no limit. Ganesha's ~4.7 GiB is its
    # metadata cache at the default bound (MDCACHE Entries_HWMark 100000;
    # 100,008 caps measured), not a leak. There is no override path in
    # Rook 1.19 with Ganesha 5.9: Rook already writes an MDCACHE block, which
    # Ganesha declares unique, and the CephNFS spec has no config field. A Rook
    # feature request is drafted in the 0b plan's Appendix A but not filed
    # (Chris, 2026-10-19); revisit it if Rook ever gains a ganesha config
    # override. NfsGaneshaOverRequest says when the cache bound stops holding.
    #
    # The pod's total is 5Gi, but this says 2560Mi: Rook v1.19.11 applies
    # server.resources to BOTH containers, nfs-ganesha and the dbus-daemon
    # sidecar, and the CRD has no separate sidecar field. The 5Gi written here
    # on 2026-10-22 made a 10 GiB pod that fit no node, so it preempted four
    # pods on bottom. Kubelet eviction compares pod usage with the pod's
    # summed requests, so the 5Gi total is what protects the cache.
    resources:
      requests:
        memory: 2560Mi
    # With a request and priority 0 ganesha would become a preemption victim.
    # It may itself preempt priority-0 pods (Luma's included) when a drain
    # moves it; Luma is shed during drains (Luma spec §14).
    priorityClassName: system-cluster-critical
    placement:
      nodeAffinity:
        # bottom, by request room (0b ruling R8, re-projected from actuals
        # on 2026-10-22): with this pod there it keeps about 5.2 GiB free;
        # middle would drop to about 20 Mi, below the 0b exit's 2048 Mi
        # free-request floor, and top cannot fit it. Preferred, so a drain of
        # bottom can re-place it.
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - bottom
---
# Pin the auto-created NFS Service to a known IP from the lan-internal
# MetalLB pool. We deliberately request 192.168.0.230 so satellites can
# bake the address into their config.
#
# Rook creates a ClusterIP Service named `rook-ceph-nfs-satellites-a` per
# active server. We add a sibling LoadBalancer Service that targets the
# same pod selector so the LAN sees a stable IP.
apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-nfs-satellites-lb
  namespace: rook
  annotations:
    metallb.universe.tf/address-pool: lan-internal
    metallb.universe.tf/loadBalancerIPs: 192.168.0.230
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: rook-ceph-nfs
    ceph_nfs: satellites
  ports:
    - name: nfs
      port: 2049
      protocol: TCP
