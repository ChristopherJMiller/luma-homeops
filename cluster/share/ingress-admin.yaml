---
# Admin ingress — Authentik-gated. Catches every path not claimed by
# share-public. Requires a ProxyProvider for share.chrismiller.xyz on
# the media outpost in Authentik before SSO will accept the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: share-admin
  annotations:
    # Admin trust tier (cluster/oauth2-proxy/). errors BEFORE auth: the errors
    # middleware has to wrap the forwardAuth to catch its 401 and turn it into
    # a redirect to the sign-in page.
    traefik.ingress.kubernetes.io/router.middlewares: >-
      oauth2-proxy-oauth2-admin-errors@kubernetescrd,oauth2-proxy-oauth2-admin-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: share.chrismiller.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filebrowser
                port:
                  number: 80
