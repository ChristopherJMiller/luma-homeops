---
# Admin ingress — Authentik-gated. Catches every path not claimed by
# share-public. Requires a ProxyProvider for share.chrismiller.xyz on
# the media outpost in Authentik before SSO will accept the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: share-admin
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: share.chrismiller.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filebrowser
                port:
                  number: 80
