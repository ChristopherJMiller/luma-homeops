---
# Realliance Pages: git-pages serves every *.realliance.page site from the
# private B2 bucket `realliance-pages`; pages-relay turns the one Forgejo system
# webhook into the per-site POST git-pages expects (plan D1).
# Design: docs/superpowers/specs/2026-11-03-realliance-pages-design.md.
# Plan: docs/superpowers/plans/2026-11-03-realliance-pages.md (Task 5).
# Static tests: scripts/test_pages_manifests.py (pre-commit `pages-manifests`).
#
# Public since plan Task 9 (edge.yaml): only git-pages :3000, GET/HEAD; the relay
# and the metrics port are never routed.
#
# Secrets: *.secret.yaml are the git-crypt cleartext sources; only their sealed
# siblings are listed here (./sign.sh).
#
# Roll back by rendering nothing (the marked `resources: []`; the exact edit is in
# the docstring of scripts/test_pages_manifests.py), never by deleting
# cluster/applications/pages.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pages
resources:
  - namespace.yaml
  - git-pages-s3.yaml
  - pages-relay-webhook.yaml
  - git-pages.yaml
  - pages-relay.yaml
  - monitoring.yaml
  - edge.yaml

# Generated, so the ConfigMap name carries a content hash: git-pages reads its
# config only at start (0.10.0 removed the SIGHUP reload), and a renamed
# ConfigMap changes the Deployment, which rolls the pod.
configMapGenerator:
  - name: git-pages-config
    files:
      - config.toml
