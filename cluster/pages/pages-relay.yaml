---
# pages-relay (images/pages-relay): the target of the one Forgejo system webhook
# (http://pages-relay.pages.svc.cluster.local:8080/hook, plan Task 6). It checks
# X-Forgejo-Signature against the webhook secret, maps a push to the `pages`
# branch of a public repo to Host <owner>.realliance.page + /<repo>/, and POSTs it
# to git-pages by Service (plan D1, D2). It never names a private repo (D9).
#
# Forgejo 15 never retries a delivery, so the relay accepts, then queues: a
# delivery that passes the checks gets 202, and two workers forward the sites in
# arrival order. Per site the latest push wins (coalesced), a site is never
# forwarded twice at once, and a push during its site's forward goes again after
# it. At most 64 sites wait; only then is a new site refused (busy, 503
# Retry-After 5). The queue holds a target and a clone URL per site, never a body.
#
# git-pages answers 202 after 3 s while its update goes on, so after a 202 the
# relay holds the site (hold.go): its next push waits, without occupying a
# worker, until the site's health Last-Modified moves, git-pages' webhook update
# counter (PAGES_RELAY_UPSTREAM_METRICS) shows every update the relay started
# has ended, git-pages restarts, or 5 min pass (update-timeout, config.toml).
# Polling is one request at a time, at least 1 s apart.
#
# Bounded by design: 16 MiB body cap (too_large), 2 bodies read at once (a
# delivery waits up to 3 s for a slot, under Forgejo's 5 s), 5 s header / 4 s
# body deadlines. Two 16 MiB bodies peak near 33 MiB; GOMEMLIMIT keeps the GC
# ahead of the 128Mi limit (Task 4 fix round 2). On delete the pod keeps
# serving through a 5 s preStop sleep while its endpoint goes away; then SIGTERM
# stops accepting, releases every hold and drains the queue for up to 110 s
# (DrainTimeout, relay.go), logging any site left; a crash loses it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pages-relay
  labels:
    app.kubernetes.io/name: pages-relay
    app.kubernetes.io/part-of: pages
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pages-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pages-relay
        app.kubernetes.io/part-of: pages
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Outlasts the 5 s preStop sleep plus the relay's 110 s SIGTERM drain
      # (scripts/test_pages_manifests.py).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pages-relay
          # The sha- tag .github/workflows/pages-relay.yml published, by digest.
          # It decides which host a push publishes to: bump by hand, never automerge.
          image: ghcr.io/christopherjmiller/pages-relay:sha-e7b3303@sha256:e8a84fdd16370ff520e4f80642853965cb8edf9f59628cb02f5cce39fe81be02
          env:
            - name: PAGES_RELAY_UPSTREAM
              value: http://git-pages.pages.svc.cluster.local:3000
            - name: PAGES_RELAY_DOMAIN
              value: realliance.page
            - name: PAGES_RELAY_FORGE
              value: https://git.realliance.net/
            - name: PAGES_RELAY_SECRET_FILE
              value: /etc/pages-relay/webhook-secret
            # git_pages_site_updates{via="webhook"} ends a hold whose update
            # failed after its 202 (hold.go).
            - name: PAGES_RELAY_UPSTREAM_METRICS
              value: http://git-pages.pages.svc.cluster.local:3002/metrics
            - name: GOMEMLIMIT
              value: 100MiB
          # Keep serving while kube-proxy drops the endpoint, so a delivery that
          # still reaches this pod is queued, not refused (review M1). The sleep
          # action needs no shell (distroless); SIGTERM follows it.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # From the Task 4 measurement; Task 10 Step 6 re-measures with a 16 MiB
          # body over a real socket.
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: webhook-secret
              mountPath: /etc/pages-relay
              readOnly: true
      volumes:
        - name: webhook-secret
          secret:
            secretName: pages-relay-webhook
            items:
              - key: webhook-secret
                path: webhook-secret
---
# pages-relay.pages.svc.cluster.local:8080: /hook (Forgejo), /metrics
# (Prometheus), /healthz (probes).
apiVersion: v1
kind: Service
metadata:
  name: pages-relay
  labels:
    app.kubernetes.io/name: pages-relay
    app.kubernetes.io/part-of: pages
spec:
  selector:
    app.kubernetes.io/name: pages-relay
  ports:
    - name: http
      port: 8080
      targetPort: http
