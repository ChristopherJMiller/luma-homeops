---
# Traefik glue for oauth2-proxy forward auth. Each tier needs TWO middlewares,
# and the Ingress must reference them in this order:
#
#   traefik.ingress.kubernetes.io/router.middlewares: >-
#     oauth2-proxy-oauth2-admin-errors@kubernetescrd,oauth2-proxy-oauth2-admin-auth@kubernetescrd
#
# Order matters: `errors` must come FIRST so that it wraps `auth` and can catch
# the 401 it produces. Reversed, the browser just gets a bare 401.
#
# Why two: forwardAuth can only say yes/no. oauth2-proxy answers 401 for an
# unauthenticated request, and the errors middleware turns that into a 302 to
# the sign-in page, carrying the original URL in `rd` so the user lands back
# where they started. statusRewrites is required — without rewriting 401 to
# 302, browsers render the redirect body as a "Found." link instead of
# following it (Traefik >= 3.3; this cluster runs 3.7).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-admin-auth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    # In-cluster address: the check runs on every request, so keep it off the
    # public hairpin. trustForwardHeader passes the original Host/URI through,
    # which is what oauth2-proxy needs to build the right `rd`.
    address: http://oauth2-proxy-admin.oauth2-proxy.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - Set-Cookie
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-admin-errors
  namespace: oauth2-proxy
spec:
  errors:
    status:
      - "401"
    service:
      name: oauth2-proxy-admin
      namespace: oauth2-proxy
      port: 4180
    query: "/oauth2/sign_in?rd={url}"
    statusRewrites:
      "401": 302
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-family-auth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy-family.oauth2-proxy.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - Set-Cookie
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-family-errors
  namespace: oauth2-proxy
spec:
  errors:
    status:
      - "401"
    service:
      name: oauth2-proxy-family
      namespace: oauth2-proxy
      port: 4180
    query: "/oauth2/sign_in?rd={url}"
    statusRewrites:
      "401": 302
