---
# Metrics for both oauth2-proxy tiers.
#
# The `release: prometheus` label is MANDATORY on this cluster — the Prometheus
# CR selects ServiceMonitors with
# `serviceMonitorSelector: {matchLabels: {release: prometheus}}`, and one
# without it is silently never scraped. See docs/auth.md.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  namespaceSelector:
    matchNames: [oauth2-proxy]
  # oauth2_proxy_requests_total carries only a `code` label — nothing that says
  # which tier served the request. Promoting the Service's instance label makes
  # `admin` vs `family` queryable, which is the whole point of running two.
  targetLabels:
    - app.kubernetes.io/instance
  endpoints:
    - port: metrics
      scheme: http
      interval: 30s
