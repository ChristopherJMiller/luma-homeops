---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oauth2-proxy
resources:
  - namespace.yaml
  - google-oauth.yaml
  - emails-admin.yaml
  - emails-family.yaml
  - admin.yaml
  - family.yaml
  - family-rs.yaml
  - middlewares.yaml
  - mcp-jwt-auth.yaml
  - servicemonitors.yaml
# The error page every tier serves (templates/error.html). Hashed name: editing
# the page renames the ConfigMap, which rolls all three Deployments — oauth2-proxy
# reads templates only at startup.
configMapGenerator:
  - name: oauth2-proxy-templates
    files:
      - templates/error.html
