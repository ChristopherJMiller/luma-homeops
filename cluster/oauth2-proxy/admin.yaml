---
# oauth2-proxy, ADMIN trust tier. One instance per tier: the instance *is* the
# trust boundary, because each has its own allowlist and its own cookie. An
# account on the family tier has no valid cookie here and cannot pass this
# check, whatever it does to its own session.
#
# Runs in forward-auth mode for Traefik (see middlewares.yaml): Traefik calls
# /oauth2/auth on every request; 401s are turned into a redirect to
# /oauth2/sign_in by the companion `errors` middleware. The public host below
# exists to serve the sign-in / callback endpoints of the OAuth dance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-admin
  namespace: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: admin
spec:
  replicas: 2 # every gated request hits this; don't make it a single point of failure
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: admin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            # OIDC against Dex, which brokers BOTH Google and Microsoft.
            # Reverting this to --provider=google would silently lock out
            # anyone who signs in with a Microsoft account.
            - --provider=oidc
            - --oidc-issuer-url=https://dex.chrismiller.xyz
            - --provider-display-name=galaxy
            # Dex staticClient id — not a secret (the secret is in the env below).
            - --client-id=oauth2-proxy-admin
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true # behind Traefik: trust X-Forwarded-*
            - --redirect-url=https://auth-admin.chrismiller.xyz/oauth2/callback
            # Cookie is shared across *.chrismiller.xyz so one login covers every
            # gated host on this tier. The NAME is tier-specific: both tiers set a
            # cookie on the same parent domain, and identical names would collide
            # in the browser.
            - --cookie-name=_oauth2_proxy_admin
            - --cookie-domain=.chrismiller.xyz
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=168h
            # Only redirect back to our own domain after login.
            - --whitelist-domain=.chrismiller.xyz
            # THE allowlist. No email-domain fallback on purpose: if this file is
            # empty or unreadable, nobody gets in (fail closed).
            - --authenticated-emails-file=/etc/oauth2-proxy/emails
            # Hand the upstream app the identity: X-Auth-Request-User/-Email.
            - --set-xauthrequest=true
            # Dex advertises S256; without this oauth2-proxy logs a warning and
            # skips PKCE entirely.
            - --code-challenge-method=S256
            # Skip oauth2-proxy's own chooser — it has one provider (Dex).
            # The Google-vs-Microsoft choice happens on Dex's page.
            # Dex ignores its own skipApprovalScreen whenever the request carries
            # approval_prompt=force, which oauth2-proxy sends by default — that put a
            # "galaxy admin would like to: view your email address" click in front of
            # EVERY login. Setting --prompt makes oauth2-proxy drop approval_prompt
            # entirely (documented: "if present, approval-prompt is ignored"); an
            # empty --approval-prompt= does NOT work, the default wins.
            # select_account is the benign choice: Dex does not treat it as forcing
            # approval, and letting people pick which Google/Microsoft account to use
            # is what we want anyway.
            - --prompt=select_account
            - --skip-provider-button=true
            - --upstream=static://202 # nothing is proxied through; only /oauth2/* matters
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: dex-client-secret-admin
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: cookie-secret-admin
          ports:
            - name: http
              containerPort: 4180
          volumeMounts:
            - name: emails
              mountPath: /etc/oauth2-proxy
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: emails
          secret:
            secretName: oauth2-proxy-admin-emails
            items:
              - key: emails
                path: emails
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-admin
  namespace: oauth2-proxy
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: admin
  ports:
    - name: http
      port: 4180
      targetPort: http
---
# Public host for the OAuth dance only (sign_in / start / callback). Deliberately
# NOT gated by its own middleware — that would be a redirect loop.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy-admin
  namespace: oauth2-proxy
spec:
  ingressClassName: traefik
  rules:
    - host: auth-admin.chrismiller.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy-admin
                port:
                  number: 4180
