---
# Forward-auth validator for the MCP endpoint. Source: images/mcp-jwt-auth.
#
# It lives in this namespace on purpose: it mounts the SAME
# oauth2-proxy-family-emails Secret the family tiers use, so "who is family" has
# one definition. Adding a relative there admits them to the tree in a browser AND
# to the MCP endpoint, with no second list to forget.
#
# Why this exists rather than a third oauth2-proxy instance: oauth2-proxy can
# validate bearer JWTs and apply an email allowlist, but it requires the token's
# audience to match a configured value, and MCP clients register dynamically so
# each holds a fresh random client id. See the package comment in main.go.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-jwt-auth
  namespace: oauth2-proxy
  labels:
    app.kubernetes.io/name: mcp-jwt-auth
spec:
  # Every gated MCP request hits this; two so a node drain is not an outage.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-jwt-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-jwt-auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-jwt-auth
          # Pinned by digest-bearing tag from .github/workflows/mcp-jwt-auth.yml.
          image: ghcr.io/christopherjmiller/mcp-jwt-auth:sha-721952f@sha256:5c4b8063d77a0ae8f609a37b5bf4653ef8217253470b67b0fc45391d609bf3b7
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: OIDC_ISSUER
              value: https://dex.chrismiller.xyz
            - name: EMAILS_FILE
              value: /etc/mcp-jwt-auth/emails
            - name: ADDR
              value: :4181
          ports:
            - name: http
              containerPort: 4181
          volumeMounts:
            - name: emails
              mountPath: /etc/mcp-jwt-auth
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: emails
          secret:
            secretName: oauth2-proxy-family-emails
            items:
              - key: emails
                path: emails
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-jwt-auth
  namespace: oauth2-proxy
  labels:
    app.kubernetes.io/name: mcp-jwt-auth
spec:
  selector:
    app.kubernetes.io/name: mcp-jwt-auth
  ports:
    - name: http
      port: 4181
      targetPort: http
---
# Single middleware, no errors partner — and that asymmetry is the point. Every
# other gate in this cluster pairs `errors` with `auth` to turn a 401 into a
# sign-in redirect for a browser. An MCP client cannot follow a redirect, so a
# flat 401 is the correct answer; the gateway's own WWW-Authenticate header is
# what tells the client where to get a token.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-jwt-auth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://mcp-jwt-auth.oauth2-proxy.svc.cluster.local:4181/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-Email
