---
# Public ingress for the Lagrange admin API. Auth happens in two layers:
#
#   1. SSO via the oauth2-proxy ADMIN tier (cluster/oauth2-proxy/,
#      docs/auth.md). Same middleware pair as media/lidarr et al.
#
#   2. Lagrange-admin trusts an identity header when the source IP is the
#      wg0 peer (10.99.0.1).
#      *** BROKEN AS OF 2026-09-23 — needs a change in the lagrange repo. ***
#      That layer reads `X-authentik-username`, which no longer exists:
#      oauth2-proxy emits `X-Auth-Request-User` / `X-Auth-Request-Email`
#      instead, and there is no rename knob. Access control is unaffected
#      (nobody reaches the app without passing SSO first) but lagrange can
#      no longer tell *who* the caller is on that path. Point it at
#      X-Auth-Request-User to restore it.
#      Automation is unaffected: it uses the bearer token via the
#      in-cluster Service (lagrange-admin.ops.svc:8443), bypassing SSO.
#
# Note: clients hitting the PUBLIC URL with just a bearer token get
# redirected to Google (forward-auth runs on every request). For
# scripted/automated callers, use the in-cluster Service path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lagrange-admin
  namespace: ops
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-oauth2-admin-errors@kubernetescrd,oauth2-proxy-oauth2-admin-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: lagrange.chrismiller.xyz
      http:
        paths:
          # /orbit/* — Vite SPA, served by the orbit pod's own nginx.
          # Listed first as a doc-order hint; the controller matches by
          # longest prefix regardless of ordering.
          - path: /orbit
            pathType: Prefix
            backend:
              service:
                name: orbit
                port:
                  number: 8080
          # Everything else — including /v1/* (the admin API) and the
          # bare host — falls through to lagrange-admin. The orbit SPA
          # itself redirects / → /orbit/ for browser users; automation
          # hitting /v1/health directly still lands on the admin service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lagrange-admin
                port:
                  number: 8443
