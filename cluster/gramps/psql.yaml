---
# Gramps Web's database — tree data, user accounts and the search index, all
# three in Postgres so nothing but a lock file lands on the SMR spinners.
#
# Stock Spilo, deliberately: unlike Immich (VectorChord) this needs no
# extensions. What it DOES need is locales, because Gramps sorts names through
# the database's collation. Upstream ships a custom `gramps-postgres` image for
# exactly that reason — the stock postgres images have no locales — but Spilo
# already carries en_US.utf8, verified against acid-immich before writing this:
#
#   datcollate = en_US.utf-8, datlocprovider = c, locale -a -> en_US.utf8
#
# Three databases rather than one, matching the layout upstream's image creates:
#   gramps         tree data, via the SharedPostgreSQL Gramps addon
#   grampswebuser  user accounts (USER_DB_URI)
#   grampssearch   search index (SEARCH_INDEX_DB_URI)
# All owned by the `gramps` role, which needs no superuser — no CREATE EXTENSION
# anywhere in this app.
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: acid-gramps
  namespace: gramps
  labels:
    app: postgresql
    cluster: acid-gramps
spec:
  enableLogicalBackup: true # nightly pg_dumpall -> B2, docs/backups.md
  databases:
    gramps: gramps
    grampswebuser: gramps
    grampssearch: gramps
  numberOfInstances: 2
  spiloRunAsUser: 101
  spiloRunAsGroup: 103
  spiloFSGroup: 103
  postgresql:
    version: '16'
    parameters:
      # SMR spinners: same reasoning as every other cluster here (#2587).
      synchronous_commit: "off"
      effective_io_concurrency: "1"
      random_page_cost: "4"
  patroni:
    failsafe_mode: true
  teamId: acid
  users:
    gramps: [createdb]
    postgres: []
  volume:
    # The tree itself is megabytes; media lives in B2, not here. Headroom is
    # for the search index, which grows with object count, not with file size.
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  sidecars:
    - name: postgres-exporter
      image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
      ports:
        - name: metrics
          containerPort: 9187
          protocol: TCP
      env:
        - name: DATA_SOURCE_URI
          value: localhost:5432/postgres?sslmode=disable
        - name: DATA_SOURCE_USER
          value: postgres
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: postgres.acid-gramps.credentials.postgresql.acid.zalan.do
              key: password
        - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
          value: 'true'
