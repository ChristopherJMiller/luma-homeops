---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gramps
resources:
  - namespace.yaml
  - logical-backup-s3.yaml
  - patroni-restapi.yaml
  - oidc.yaml
  - mcp-auth.yaml
  - psql.yaml
  - b2.yaml
  - config.yaml
  - new-user-emails.yaml
  - frontend-config.yaml
  - pvc.yaml
  - valkey.yaml
  - grampsweb.yaml
  - mcp.yaml
  - backup.yaml
  - export-cronjob.yaml
  - ingress.yaml
patches:
  - target: {kind: SealedSecret, name: patroni-restapi}
    patch: |- # fail-closed dependency of every Spilo pod (D7): never prune it
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: patroni-restapi
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
