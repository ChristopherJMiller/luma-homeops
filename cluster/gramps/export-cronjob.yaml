---
# Nightly Gramps XML export — the undo for an AI mis-edit.
#
# This exists because family members are editors through the MCP endpoint, so the
# tree can now be changed by an assistant, and desktop sync is bidirectional so a
# bad write reaches the laptop too. The nightly pg_dumpall restores the database;
# this restores the *tree*, in the one format that survives a Gramps major-version
# change and that Gramps itself can import.
#
# It authenticates as `gramps-backup`, role 1 (MEMBER), and the role is
# load-bearing: the exporter passes view_private=has_permissions({PERM_VIEW_PRIVATE})
# (exporters.py:229), so a guest-role account would produce a backup that silently
# omits every private record. MEMBER is the lowest role that reads everything and
# still cannot write.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gramps-xml-export
  namespace: gramps
  labels:
    app.kubernetes.io/name: gramps-xml-export
    backup-tier: family
spec:
  # 02:30 — between the postgres dumps (00:30) and the two big rclone mirrors
  # (03:30 family, 04:30 immich), so nothing large overlaps on the SMR OSDs.
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gramps-xml-export
        spec:
          restartPolicy: Never # keep failed pods and their logs
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          # Fetch first, upload second. Two images rather than one because
          # neither the curl nor the rclone image carries the other.
          initContainers:
            - name: export
              image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: GRAMPS_BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: gramps-backup
                      key: GRAMPS_BACKUP_PASSWORD
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  api=http://grampsweb.gramps.svc.cluster.local
                  # /api/token/ answers {"access_token":"...","refresh_token":"..."}
                  tok=$(curl -fsS -X POST "$api/api/token/" \
                          -H 'Content-Type: application/json' \
                          -d "{\"username\":\"gramps-backup\",\"password\":\"$GRAMPS_BACKUP_PASSWORD\"}" \
                        | sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p')
                  test -n "$tok"
                  # GET is the synchronous exporter; POST would queue a celery task.
                  curl -fsS -o /work/tree.gramps \
                    -H "Authorization: Bearer $tok" \
                    "$api/api/exporters/gramps/file"
                  # A .gramps file is gzipped XML. Refuse to upload something that
                  # is not one, so a truncated or error-page "export" cannot quietly
                  # replace a good backup.
                  head -c 2 /work/tree.gramps | od -An -tx1 | grep -q '1f 8b'
                  ls -l /work/tree.gramps
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              image: ghcr.io/rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                # Same bucket and key the media already uses; no new credential.
                - name: RCLONE_CONFIG_B2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_B2_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_B2_ENDPOINT
                  value: https://s3.us-west-004.backblazeb2.com
                - name: RCLONE_CONFIG_B2_REGION
                  value: us-west-004
                # A restricted key cannot CreateBucket, so don't let rclone try.
                - name: RCLONE_CONFIG_B2_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_CONFIG_B2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: gramps-b2
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_B2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gramps-b2
                      key: AWS_SECRET_ACCESS_KEY
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  # Date-stamped, never overwritten: the point is to be able to go
                  # back to before a bad edit, which a single rolling copy cannot do.
                  dest="b2:galaxy-family/gramps-exports/$(date -u +%Y-%m-%d).gramps"
                  rclone copyto --s3-no-check-bucket /work/tree.gramps "$dest"
                  rclone size b2:galaxy-family/gramps-exports
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
