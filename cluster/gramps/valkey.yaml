---
# Celery's broker and result backend. No persistence on purpose: everything in
# here is in-flight task state, and losing it costs at most a re-run of a
# thumbnail or reindex job. Upstream's compose file uses valkey too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: gramps
  labels:
    app.kubernetes.io/name: valkey
spec:
  replicas: 1
  # RollingUpdate, not Recreate: Recreate waits for the old pod to be gone, and
  # a pod on a dead node never is. On 2026-11-19 a digest bump left valkey at
  # 0/1 for four days behind a pod stuck Terminating on top, and login 500'd.
  # Two empty valkeys side by side for a moment cost nothing.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9-alpine@sha256:3ad5a213cb1bc2fd4a113c89b6248a88655a6bf1dda69519d04e03cd3e3d2742
          args: ["--save", "", "--appendonly", "no"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: valkey
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 10
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: gramps
  labels:
    app.kubernetes.io/name: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
