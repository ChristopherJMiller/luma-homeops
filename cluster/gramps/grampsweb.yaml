---
# Gramps Web: the API and the frontend in one image (it serves the static
# build), plus a celery worker for background work — thumbnails, reindexing,
# exports, media checks. Same image, different command, and both must see the
# same tree directory, hence the shared RWX claim.
#
# What is deliberately NOT a volume: tree data, user accounts and the search
# index are all in Postgres, media is in B2. That leaves caches and the per-tree
# metadata dir, so a pod can be thrown away freely.
#
# On the image: this is OUR build (images/grampsweb), which is upstream's
# `latest` plus the patch that creates a listed family address as an editor on
# first login instead of leaving it disabled behind a 500. Upstream's own
# container release tags are badly stale (the newest, 26.3.1.1, is from March
# 2026 while `latest` was rebuilt 2026-09-20), so the Dockerfile pins `latest` by
# digest and Renovate bumps it THERE.
#
# Consequence: merging a Renovate base bump does not ship it. The workflow
# publishes a new sha- tag and this pin is then updated by hand — so the pod keeps
# running the old image until someone does, which is the safe direction. The thing
# to check on ANY bump is the image's GRAMPS_VERSION env: it is 60 today, and
# desktop Gramps Web Sync requires the server and the laptop to agree on
# MAJOR.MINOR. A jump to 61 breaks sync until the laptop follows; the workflow
# prints it and warns.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grampsweb
  namespace: gramps
  labels:
    app.kubernetes.io/name: grampsweb
spec:
  # 1 for now. Scaling out is safe because SECRET_KEY is set explicitly rather
  # than generated per-pod, but `middle` is already near its memory *requests*
  # ceiling, so don't add replicas casually.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grampsweb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grampsweb
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grampsweb
          image: ghcr.io/christopherjmiller/grampsweb:sha-6bebffc@sha256:d714320095cced604bc5039a8fc9b9fff8b0faa4866f23d1eef395426dabdaa1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 5000
          env:
            # 8 (the image default) is far too many for one family's tree, and
            # each worker is a full Gramps process.
            - name: GUNICORN_NUM_WORKERS
              value: "4"
            # Generated by the postgres-operator, never in the repo. Zalando's
            # passwords are alphanumeric, so embedding one in a URI below needs
            # no escaping.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gramps.acid-gramps.credentials.postgresql.acid.zalan.do
                  key: password
            - name: GRAMPSWEB_POSTGRES_PASSWORD
              value: $(DB_PASSWORD)
            - name: GRAMPSWEB_USER_DB_URI
              value: postgresql://gramps:$(DB_PASSWORD)@acid-gramps:5432/grampswebuser
            - name: GRAMPSWEB_SEARCH_INDEX_DB_URI
              value: postgresql://gramps:$(DB_PASSWORD)@acid-gramps:5432/grampssearch
          envFrom:
            - configMapRef:
                name: grampsweb-config
            - secretRef:
                name: gramps-oidc
            - secretRef:
                name: gramps-b2
          volumeMounts:
            - name: treedir
              mountPath: /root/.gramps/grampsdb
            - name: shared-cache
              mountPath: /app/cache
              subPath: cache
            - name: shared-cache
              mountPath: /app/thumbnail_cache
              subPath: thumbnails
            - name: tmp
              mountPath: /tmp
            - name: frontend-config
              mountPath: /app/static/config.js
              subPath: config.js
              readOnly: true
            # Which first-time OIDC login is created as an editor rather than
            # disabled — see OIDC_NEW_USER_ROLE in config.yaml. Mounted as a
            # DIRECTORY, deliberately: a subPath mount is a one-time copy that
            # kubelet never refreshes, so adding a relative would silently need a
            # pod restart to take effect.
            - name: new-user-emails
              mountPath: /etc/gramps/new-user-emails
              readOnly: true
          # Probing `/` (the frontend index) rather than an API route on
          # purpose: /api/metadata/ requires authentication and answers 401,
          # which kubelet counts as a failure. The app already fails hard at
          # boot if Postgres is unreachable — alembic migrations run there — so
          # "gunicorn is serving" is the useful liveness signal here.
          startupProbe:
            httpGet:
              path: /
              port: http
            # A cold start opens the tree, which is slow on the spinners.
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: treedir
          persistentVolumeClaim:
            claimName: gramps-treedir
        - name: shared-cache
          persistentVolumeClaim:
            claimName: gramps-cache
        - name: tmp
          emptyDir: {}
        - name: frontend-config
          configMap:
            name: grampsweb-frontend-config
        # Only the web pod needs this: account creation happens in the request
        # path, never in a celery task.
        - name: new-user-emails
          secret:
            secretName: gramps-new-user-emails
            items:
              - key: emails
                path: emails
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grampsweb-celery
  namespace: gramps
  labels:
    app.kubernetes.io/name: grampsweb-celery
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grampsweb-celery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grampsweb-celery
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery
          image: ghcr.io/christopherjmiller/grampsweb:sha-6bebffc@sha256:d714320095cced604bc5039a8fc9b9fff8b0faa4866f23d1eef395426dabdaa1
          command:
            - celery
            - -A
            - gramps_webapi.celery
            - worker
            - --loglevel=INFO
            - --concurrency=2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gramps.acid-gramps.credentials.postgresql.acid.zalan.do
                  key: password
            - name: GRAMPSWEB_POSTGRES_PASSWORD
              value: $(DB_PASSWORD)
            - name: GRAMPSWEB_USER_DB_URI
              value: postgresql://gramps:$(DB_PASSWORD)@acid-gramps:5432/grampswebuser
            - name: GRAMPSWEB_SEARCH_INDEX_DB_URI
              value: postgresql://gramps:$(DB_PASSWORD)@acid-gramps:5432/grampssearch
          envFrom:
            - configMapRef:
                name: grampsweb-config
            - secretRef:
                name: gramps-oidc
            - secretRef:
                name: gramps-b2
          volumeMounts:
            - name: treedir
              mountPath: /root/.gramps/grampsdb
            - name: shared-cache
              mountPath: /app/cache
              subPath: cache
            - name: shared-cache
              mountPath: /app/thumbnail_cache
              subPath: thumbnails
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # The image carries torch + sentence-transformers for semantic
            # search, so the ceiling is higher than the web pod's. Requests stay
            # low deliberately: request==limit here would make the pod
            # unschedulable on `middle`.
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: treedir
          persistentVolumeClaim:
            claimName: gramps-treedir
        - name: shared-cache
          persistentVolumeClaim:
            claimName: gramps-cache
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grampsweb
  namespace: gramps
  labels:
    app.kubernetes.io/name: grampsweb
spec:
  selector:
    app.kubernetes.io/name: grampsweb
  ports:
    - name: http
      port: 80
      targetPort: http
