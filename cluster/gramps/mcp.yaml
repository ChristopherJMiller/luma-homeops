---
# Gramps MCP server — read/write, reachable ONLY through the MCP gateway.
#
# This is Chris's patched build of cabout-me/gramps-mcp (see the flake's
# gramps-mcp-image output, built from the derivation in nixos-configs). The
# patches are what make writing usable: upstream's create_family silently drops
# children, get_type(person) crashes for anyone with notes, gender OTHER is
# rejected at validation, and a process-wide httpx client gets torn down by
# whichever concurrent tool call finishes first. All still open PRs upstream.
#
# It has no inbound auth of its own and no Ingress: the gateway is the only route,
# and authorization is the family allowlist in front of the gateway. Anything that
# can reach this Service in-cluster can read AND WRITE the tree — flannel does not
# enforce NetworkPolicy, so that is not fixable with a policy today.
#
# Family are editors by decision (2026-09-27), so this account can write and can
# therefore also see records flagged private. Both follow from allowing writes:
# `view_private` starts at MEMBER and editing needs EDITOR, so the earlier
# GUEST-only posture is not compatible with an AI that edits the tree. The undo is
# the nightly pg_dumpall plus the Gramps XML export.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gramps-mcp
  namespace: gramps
  labels:
    app.kubernetes.io/name: gramps-mcp
spec:
  # 1 replica deliberately: upstream keeps a process-wide httpx client and the
  # shared-client-lifetime patch fixes teardown races *within* a process. More
  # replicas is fine for reads but buys nothing here, and writes are easier to
  # reason about with one writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gramps-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gramps-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534 # the image's nobody, from dockerTools.fakeNss
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: IMAGE_PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            # In-cluster, so tree traffic never leaves the LAN. Site root, not /api.
            - name: GRAMPS_API_URL
              value: http://grampsweb.gramps.svc.cluster.local
            - name: GRAMPS_USERNAME
              value: gramps-mcp
            # This server addresses the tree explicitly, unlike the Rust one.
            - name: GRAMPS_TREE_ID
              value: a7d06e65-34ab-474f-a8d5-e8ae6d8946da
            # HOME is /tmp in the image; keep the writable path on an emptyDir so
            # readOnlyRootFilesystem holds.
            - name: HOME
              value: /tmp
          envFrom:
            # GRAMPS_PASSWORD only — see mcp-auth.secret.yaml.
            - secretRef:
                name: gramps-mcp
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gramps-mcp
  namespace: gramps
  labels:
    app.kubernetes.io/name: gramps-mcp
spec:
  selector:
    app.kubernetes.io/name: gramps-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
