---
# Gramps MCP server — reachable ONLY through the MCP gateway.
#
# It has no inbound auth of its own and no Ingress. Its own static-token mode was
# removed when mcp.chrismiller.xyz took over: the gateway speaks OAuth to the
# client and then proxies, and it can only forward a plain URL (ProxyHttp carries
# no headers), so a token here would simply have blocked it.
#
# What that means honestly: anything that can reach this Service in-cluster can
# read the tree, and flannel does not enforce NetworkPolicy, so that is not
# fixable with a policy today. The real containment is that it is not publicly
# routable and that its Gramps account `gramps-mcp` is role 1 (MEMBER) — reads,
# including private records, but the API refuses writes with 403. GRAMPS_READONLY
# only hides the write tools; the role is what forbids a write.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gramps-mcp
  namespace: gramps
  labels:
    app.kubernetes.io/name: gramps-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gramps-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gramps-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the image's own `nonroot` user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/alexey-n-chernyshov/gramps-web-mcp-rs:1.4.0@sha256:b620bb70ff5ce6f3702390e448fd446fcc26775f72d2d65ae8878eb91794b4ed
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            # In-cluster, so tree reads never leave the LAN or hairpin through
            # the edge. This is the site root, not the /api prefix.
            - name: GRAMPS_API_URL
              value: http://grampsweb.gramps.svc.cluster.local
            - name: GRAMPS_USERNAME
              value: gramps-mcp
            - name: GRAMPS_READONLY
              value: "true"
            - name: MCP_TRANSPORT
              value: http
            - name: MCP_HTTP_HOST
              value: 0.0.0.0
            - name: MCP_HTTP_PORT
              value: "3000"
            # Without this the server's DNS-rebinding protection allows only
            # localhost, and every proxied request is rejected — Traefik
            # preserves the original Host header.
            - name: MCP_ALLOWED_HOSTS
              # The gateway preserves the Host header of the public request.
              value: mcp.chrismiller.xyz
          envFrom:
            # GRAMPS_PASSWORD only — see mcp-auth.secret.yaml.
            - secretRef:
                name: gramps-mcp
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gramps-mcp
  namespace: gramps
  labels:
    app.kubernetes.io/name: gramps-mcp
spec:
  selector:
    app.kubernetes.io/name: gramps-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
