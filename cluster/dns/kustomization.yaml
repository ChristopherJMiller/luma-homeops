---
# Public DNS glue for the galaxy edge (namespace: dns).
#
# Records themselves are terraform-managed in cloudflare/dns/ — every public
# hostname is a wildcard CNAME to the zone apex, so nothing in-cluster needs
# write access to per-host records. (This dir was cluster/external-dns/ until
# external-dns was retired 2026-09-19 after it deleted every managed record
# on a routine minor bump — see git log.)
#
# What remains here:
#   - cloudflare-api-token: shared by cloudflareddns and cert-manager (DNS-01)
#   - cloudflareddns: keeps the apex A records pointed at the DHCP WAN IP
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dns
resources:
  - cloudflare-api-token.yaml
  - cloudflareddns.yaml
  - cloudflareddns-config.yaml
