---
# Vendored upstream manifests and machine-generated configs are exempted
# from formatting/whitespace hooks so they stay byte-identical with the
# upstream source (vendored) or the generator output (talosctl).
#
# - cluster/rabbitmq-cluster-operator/{cluster-operator,messaging-topology-operator}.yaml
#   yamlfmt reflows CRD description strings and adds trailing whitespace,
#   which trailing-whitespace then strips, looping forever.
# - nodes/controlplane.yaml (and other nodes/*.yaml)
#   talosctl gen output uses `key:` with no trailing space for empty
#   values; yamlfmt adds a trailing space, trailing-whitespace strips it,
#   same loop. Don't reformat Talos config — it's regenerated/diffed
#   against `talosctl gen` upstream.
# - cluster/kube-network-policies/upstream-install.yaml
#   upstream's install.yaml, vendored byte-identical; scripts/test_netpol_manifests.py
#   checks its sha256. Exempt from every hook that rewrites files (yamlfmt,
#   end-of-file-fixer, trailing-whitespace, mixed-line-ending,
#   fix-byte-order-marker), or a re-vendor would be rewritten and then fail
#   the sha test in a confusing loop. The same test asserts the exemptions.
repos:
  - repo: local
    hooks:
      # A kustomization can reference a resource that is not committed --
      # `git commit -am` stages only tracked files, so a newly created resource
      # silently stays out of the tree. Argo then fails at `kustomize build`
      # and the WHOLE Application stops generating manifests, not just that
      # resource. pre-commit stashes unstaged/untracked files, so this builds
      # the same tree Argo will get.
      - id: kustomize-build
        name: kustomize build (every cluster/ kustomization must render)
        language: system
        entry: scripts/check-kustomizations.sh
        pass_filenames: false
        files: ^cluster/.*\.(yaml|yml)$
      # The NetworkPolicy enforcer's fixed values (args, image pin, the vendored
      # upstream sha256, RBAC and privileges equal to upstream's, monitoring
      # wiring), its Renovate rules and hook exemptions, and every policy rule
      # from the design
      # (docs/superpowers/specs/2026-11-03-networkpolicy-enforcement-design.md).
      # Any cluster/ change runs it: a component or a namespace can change what
      # a policy selects without touching the policy's own file. It accepts the
      # marked rollback (render nothing); the test file's docstring has the edit.
      # It also runs on a change to the router's DHCP reservations or to
      # bmcctl's node map, which the canary's node IPs and BMCs (probe.sh
      # NODE_IPS, NODE_BMCS) must match.
      - id: netpol-manifests
        name: NetworkPolicy enforcer and policy static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_netpol_manifests.py
        pass_filenames: false
        files: ^(cluster/.*|router/ansible/group_vars/vyos_routers\.yml|tools/bmcctl/src/bmcctl/nodes\.py|scripts/test_netpol_manifests\.py|\.renovaterc\.json|\.pre-commit-config\.yaml)$
      # Realliance Pages' fixed values: the git-pages 0.10.1 pin and config (128 MB
      # cap, proxy not caddy, header allowlist), pod hardening for PodSecurity
      # restricted, the relay's env, monitors and alerts, Renovate rules, and the
      # one shared wildcard certificate (no per-host cert)
      # (docs/superpowers/specs/2026-11-03-realliance-pages-design.md). Later plan
      # tasks extend it to traefik/, dns/, cert-manager/ and cloudflare/dns/. It
      # accepts the marked rollback (render nothing); the test file's docstring
      # has the edit.
      - id: pages-manifests
        name: Realliance Pages static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_pages_manifests.py
        pass_filenames: false
        files: ^(cluster/(pages|traefik|dns|cert-manager|applications)/.*|cloudflare/dns/.*\.tf|images/pages-relay/relay\.go|scripts/test_pages_manifests\.py|\.renovaterc\.json|\.pre-commit-config\.yaml)$
      # docs.realliance.net (Realliance docs site, Task 9): exactly one of the two shapes the spec
      # allows (the Workers Custom Domain, or the pre-approved proxied AAAA record plus a route), the
      # `cloudflare.workers` provider alias and its sensitive variable, no account id in any .tf, the
      # workers token file git-crypted, and tf.sh passing that token to terraform without printing
      # it (a stub terraform, a fake token). Never opens a *.secret.* file
      # (docs/superpowers/plans/2026-11-08-realliance-docs-site.md, D11).
      - id: docs-site
        name: docs.realliance.net static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_docs_site.py
        pass_filenames: false
        files: ^(cloudflare/dns/.*|scripts/test_docs_site\.py|\.gitattributes|\.pre-commit-config\.yaml)$
      # ci-dispatch and the `tiny` runner class (runner classes phase 1): the dispatcher pod's
      # hardening and pin, restricted Pod Security on ci-dispatch AND ci-tiny (the kube guard
      # relies on it for pod privilege fields), exact RBAC and quota, the web-only egress
      # component, both policy sets, alerts, Renovate never automerging the image, and
      # SealedSecrets only (docs/superpowers/plans/2026-11-04-runner-classes-phase-0-1.md).
      # Phase 2 adds the paid classes' config, the Azure credential, the money alerts and the
      # ledger's restic job; `files` covers every input the tests read (test_hook_watches_every_input):
      # the backups alerts and canary, every restic manifest, the class image's runner timeouts and
      # the fence. Alert cases run separately: scripts/test-ci-dispatch-alerts.sh (needs promtool and yq).
      - id: ci-dispatch-manifests
        name: ci-dispatch static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_ci_dispatch_manifests.py
        pass_filenames: false
        files: ^(cluster/(ci-dispatch|components/netpol|forgejo-runner-general|forge-bot|applications|backups)/.*|cluster/[^/]+/restic-[^/]*\.yaml|images/forgejo-runner-class/runner-[^/]*\.yml|azure/ci/fence\.json|scripts/test_ci_dispatch_manifests\.py|\.renovaterc\.json|\.pre-commit-config\.yaml)$
      # Realliance.net on the forge: the general runner's fixed values (restricted PSA, pod
      # hardening, pinned slim image, wipe-on-start, nothing shared with the galaxy runner).
      # Later tasks add the site pin test to the same hook.
      - id: realliance-net
        name: realliance.net runner static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_runner_general.py scripts/test_realliance_net_pin.py
        pass_filenames: false
        files: ^(cluster/(forgejo-runner-general|forgejo-runner|realliance\.net|applications|components/netpol)/.*|images/forgejo-runner-general/.*|scripts/test_(runner_general|realliance_net_pin)\.py|\.renovaterc\.json|\.pre-commit-config\.yaml)$
      # Realliance Forge typography: no CDN/Google Fonts reference, every @font-face src ships in a
      # ConfigMap, every forgejo ConfigMap under 1 MiB (cluster/forgejo/custom/FONTS.md).
      - id: forge-fonts
        name: Forge fonts static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_forge_fonts.py
        pass_filenames: false
        files: ^(cluster/forgejo/.*|cluster/applications/forgejo-release\.yaml|scripts/(test_forge_fonts\.py|sync-brand\.sh)|\.pre-commit-config\.yaml)$
      # Forgejo sign-in goes straight to the SSO via a Traefik IngressRoute: GET only, flash-cookie and
      # ?local guards, never a permanent redirect.
      - id: forgejo-signin-redirect
        name: Forgejo sign-in redirect static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_forgejo_signin_redirect.py
        pass_filenames: false
        files: ^(cluster/forgejo/(signin-redirect|kustomization)\.yaml|scripts/test_forgejo_signin_redirect\.py|\.pre-commit-config\.yaml)$
      # Renovate must never automerge the forgejo-helm chart (a bump restarts Forgejo).
      - id: forgejo-renovate
        name: Forgejo chart Renovate guard
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_forgejo_renovate.py
        pass_filenames: false
        files: ^(scripts/test_forgejo_renovate\.py|\.renovaterc\.json|cluster/applications/forgejo-release\.yaml)$
      # The forge image: the keep-warm DaemonSet runs the Deployment's exact image one Argo wave
      # earlier, and a fork pin is a forge-registry tag plus digest with the upstream digest kept as
      # the fallback (docs/forgejo.md, "Fork image"). Renders the chart, so it needs helm and network.
      - id: forgejo-image
        name: Forgejo image and keep-warm static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_forgejo_image.py
        pass_filenames: false
        files: ^(scripts/test_forgejo_image\.py|cluster/applications/forgejo-release\.yaml|\.pre-commit-config\.yaml)$
      # Paid CI on ACI (azure/ci/): fence.json's values, every Policy rule, the dispatcher's exact
      # role, the credential's lifetime, and no Azure id in a public file (runner classes phase 2,
      # Tasks 2 and 3). Also tf.sh's redaction, the mocked `terraform test` restore scenario, and the
      # Renovate rule that keeps provider bumps from automerging. The plan-level tests run only with
      # AZURE_CI_PLAN_JSON set (the test file's docstring). It never opens ci.secret.auto.tfvars.
      - id: azure-ci
        name: azure/ci fence static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_azure_ci.py
        pass_filenames: false
        files: ^(azure/ci/.*|scripts/test_azure_ci\.py|\.renovaterc\.json|\.pre-commit-config\.yaml)$
      # The small/medium CI runner class image (images/forgejo-runner-class): FROM lines equal to
      # the galaxy runner's, root, toolchain, runner configs, entry-script contract, Renovate rule.
      - id: runner-class
        name: runner class image static tests
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_runner_class_image.py
        pass_filenames: false
        files: ^(images/forgejo-runner-class/.*|images/forgejo-runner/Dockerfile|scripts/test_runner_class_image\.py|\.github/workflows/forgejo-runner-class-image\.yml)$
      # scripts/netpol-verify.sh against a stub kubectl: a partial pod list or an
      # unparseable answer must FAIL, never pass vacuously.
      - id: netpol-verify-selftest
        name: netpol-verify.sh self-test (no cluster)
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_netpol_verify.py
        pass_filenames: false
        files: ^(scripts/(netpol-verify\.sh|test_netpol_verify\.py|netpol-connect\.js)|cluster/netpol-canary/(probe\.sh|matrix\.txt))$
      # ci-dispatch's ledger restore (docs/ci.md, Restoring the ledger) against a fake /data and stub
      # restic and kubectl: a missing or non-SQLite replacement must fail and leave the live ledger
      # untouched; the pod stays Pod Security `restricted` with the restic jobs' image.
      - id: ci-dispatch-ledger-restore
        name: ci-dispatch ledger restore self-test (no cluster)
        language: system
        entry: python -m pytest -q -p no:cacheprovider scripts/test_ci_dispatch_ledger_restore.py
        pass_filenames: false
        files: ^(scripts/(ci-dispatch-ledger-restore(-pod)?\.sh|test_ci_dispatch_ledger_restore\.py)|cluster/music-streaming/restic-backup-cronjob\.yaml)$
      # Dex client ids starting `mcp-` are reserved for the MCP facade, which
      # creates and deletes them itself (dynamic client registration). A static
      # client with that prefix would be adopted or swept by it. `idEnv` is
      # refused too: the id would come from the environment, where this hook
      # cannot see it.
      - id: no-static-mcp-client
        name: no static Dex client may use the reserved mcp- id prefix
        language: pygrep
        entry: '(?:^|[\s{,-])(?:id\s*:\s*["'']?mcp-|idEnv\s*:)'
        files: ^cluster/dex/config\.secret\.yaml$
      # The family allowlist feeds four mounts across two namespaces, and a Secret
      # cannot be mounted across namespaces -- so the gramps-side copy is GENERATED
      # from the one list of record rather than maintained by hand. Behaves like a
      # formatter: if it rewrites the file, the commit stops so you can reseal.
      - id: mirror-family-list
        name: mirror the family allowlist into the gramps namespace
        language: system
        entry: scripts/mirror-family-list.sh
        pass_filenames: false
        files: ^cluster/(oauth2-proxy/emails-family|gramps/new-user-emails)\.secret\.yaml$
      # Home Assistant config revision. A hash of packages/, dashboards/ and
      # themes/ written into packages/config_revision.yaml as a sensor; the
      # ha-reload PostSync hook reloads HA until the sensor matches, so every
      # change provably lands. Behaves like a formatter: if it rewrites the
      # file, the commit stops so you can `git add` it.
      - id: ha-config-revision
        name: HA config revision (packages/config_revision.yaml)
        language: system
        entry: tools/hactl/bin/hactl revision --write
        pass_filenames: false
        files: ^cluster/home-assistant/(packages|dashboards|themes)/.*\.yaml$
  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.1
    hooks:
      - id: yamlfmt
        # --width: ruamel wraps plain scalars longer than this and leaves a
        #   trailing space at the wrap, which trailing-whitespace then strips —
        #   an infinite fight on any long value (auth headers, CSP, SealedSecret
        #   ciphertext). YAML has no line limit; never wrap.
        # --preserve-quotes: don't churn "x" -> x on files you didn't touch.
        args: [--mapping, '2', --sequence, '4', --offset, '2', --width, '100000', --preserve-quotes]
        exclude: |
          (?x)^(
            cluster/rabbitmq-cluster-operator/(cluster-operator|messaging-topology-operator)\.yaml
            |nodes/.*\.yaml
            # A unified diff carries meaning in leading and trailing space: a
            # context line for an empty source line is a single space, and
            # stripping it can make the patch unapplyable.
            |(patches|images)/.*\.patch
            |cluster/home-assistant/(packages|blueprints|dashboards|themes)/.*\.yaml
            # Vendored byte-identical from upstream v1.1.3; a test checks its sha256.
            |cluster/kube-network-policies/upstream-install\.yaml
          )$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: check-added-large-files
        args: [--maxkb, '2048']
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            cluster/rabbitmq-cluster-operator/(cluster-operator|messaging-topology-operator)\.yaml
            |nodes/.*\.yaml
            # A unified diff carries meaning in leading and trailing space: a
            # context line for an empty source line is a single space, and
            # stripping it can make the patch unapplyable.
            |(patches|images)/.*\.patch
            # Vendored upstream CSS (catppuccin/gitea): kept byte-identical to the release.
            |cluster/forgejo/custom/public/assets/css/.*\.css
            # Vendored byte-identical from upstream v1.1.3; a test checks its sha256.
            |cluster/kube-network-policies/upstream-install\.yaml
          )$
      - id: fix-byte-order-marker
        name: Fix UTF-8 byte order marker
        # Vendored byte-identical from upstream v1.1.3; a test checks its sha256.
        exclude: ^cluster/kube-network-policies/upstream-install\.yaml$
      - id: mixed-line-ending
        args: [--fix, lf]
        # Vendored byte-identical from upstream v1.1.3; a test checks its sha256.
        exclude: ^cluster/kube-network-policies/upstream-install\.yaml$
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            cluster/rabbitmq-cluster-operator/(cluster-operator|messaging-topology-operator)\.yaml
            |nodes/.*\.yaml
            # A unified diff carries meaning in leading and trailing space: a
            # context line for an empty source line is a single space, and
            # stripping it can make the patch unapplyable.
            |(patches|images)/.*\.patch
            |cluster/forgejo/custom/public/assets/css/.*\.css
            # Vendored byte-identical from upstream v1.1.3; a test checks its sha256.
            |cluster/kube-network-policies/upstream-install\.yaml
          )$
