---
name: pages-relay image

# Forgejo -> git-pages webhook relay (images/pages-relay): verifies the Forgejo
# signature and forwards pushes to the right git-pages site.
# Tags :sha-<short> (immutable, what the Deployment pins) and :latest.

on:
  push:
    branches: [main]
    paths:
      - images/pages-relay/**
      - .github/workflows/pages-relay.yml
  pull_request:
    paths:
      - images/pages-relay/**
      - .github/workflows/pages-relay.yml
  workflow_dispatch:

concurrency:
  group: pages-relay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pages-relay

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: images/pages-relay/go.mod

      - name: Test
        working-directory: images/pages-relay
        run: go vet ./... && go test -race ./...

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/pages-relay
          # amd64 only: every galaxy node is x86_64.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails closed: with no webhook secret it must refuse to start. Distroless
      # has no shell, so the binary is exercised directly.
      - name: Verify it refuses to start without a secret
        if: github.event_name != 'pull_request'
        run: |
          set -eux
          img="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          out="$(docker run --rm "$img" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "PAGES_RELAY_SECRET_FILE"
