---
name: postgres-operator image

# postgres-operator v1.11.0 + Patroni REST API auth patches
# (images/postgres-operator). Tags :sha-<short> (immutable, what
# cluster/applications/postgres-operator.yaml pins by digest) and :latest.
#
# The Docker build is the test gate: it runs upstream's patroni and cluster
# tests on the patched source, and the golden test that proves CRs which
# don't opt in get byte-identical StatefulSets. Merging here deploys nothing:
# the pin in the Argo app is a second, manual commit (CLAUDE.md sharp edge #6).
#
# Actions are pinned by commit SHA: this image runs with get-secrets in every
# database namespace.

on:
  push:
    branches: [main]
    paths:
      - images/postgres-operator/**
      - .github/workflows/postgres-operator-image.yml
  pull_request:
    paths:
      - images/postgres-operator/**
      - .github/workflows/postgres-operator-image.yml
  workflow_dispatch:

concurrency:
  group: postgres-operator-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/postgres-operator

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/postgres-operator
          # amd64 only: every galaxy node is x86_64, and the upstream v1.11.0
          # runtime base is a single-arch amd64 image.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the pushed digest (what the pin names, not a tag that could move)
      # carries our binary, not upstream's. ${IMAGE,,}: the owner in IMAGE is
      # mixed case and image references must be lowercase.
      - name: Verify the galaxy build is in the pushed image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eux
          test -n "$DIGEST"
          docker run --rm --entrypoint /bin/sh "${IMAGE,,}@${DIGEST}" -c 'grep -c v1.11.0-galaxy.1 /postgres-operator'
          tag="$(printf '%s\n' "$TAGS" | grep ':sha-')"
          echo "Pin: \`${tag##*:}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      # The operator pulls without an imagePullSecret, so the package must be
      # public. An empty DOCKER_CONFIG means no credentials: this fails while
      # the GHCR package is private (flip it in the package settings).
      - name: Anonymous pull works
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eux
          DOCKER_CONFIG="$(mktemp -d)" docker manifest inspect "${IMAGE,,}@${DIGEST}"
