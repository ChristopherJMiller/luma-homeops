---
name: gramps-mcp image

# The read-write MCP server for the family tree, built from the Nix derivation in
# ChristopherJMiller/nixos-configs (packages/gramps-mcp) via the flake's
# gramps-mcp-image output — NOT from a Dockerfile here.
#
# That indirection is the point: the derivation carries the patches against
# cabout-me/gramps-mcp v1.1.0 that are still open PRs upstream, and it is also
# what Chris's laptop uses. Copying the patches into this repo would fork them.
# `nix flake update nixos-configs` is how a patch change gets picked up.
#
# Tags :sha-<short> (immutable, what the Deployment pins) and :latest.

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/gramps-mcp-image.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/gramps-mcp-image.yml
  workflow_dispatch:

concurrency:
  group: gramps-mcp-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Lowercase and hardcoded on purpose. github.repository_owner is
  # "ChristopherJMiller", and Docker rejects a mixed-case repository name — the
  # other workflows get away with it because docker/metadata-action lowercases
  # for them, and this one tags by hand. It must also match the `name` in the
  # flake's gramps-mcp-image, which is what `docker load` produces.
  IMAGE: ghcr.io/christopherjmiller/gramps-mcp

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v20

      - name: Build the image stream script
        run: nix build .#gramps-mcp-image --print-build-logs

      # streamLayeredImage produces a script that writes the tar to stdout, so
      # nothing large is ever materialised in the store.
      - name: Load into the local daemon
        run: ./result | docker load

      # Proves the entrypoint actually serves before anything is published: the
      # server binds 8000 with no configuration and only fails per-request
      # without GRAMPS_API_URL, so "it starts and answers" is a real signal.
      - name: Verify it serves streamable HTTP on 8000
        run: |
          set -eux
          docker run -d --name probe -p 8000:8000 "${IMAGE}:latest"
          ok=
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/mcp || true)"
            # Any HTTP status means it is serving; 000 means not listening yet.
            if [ "$code" != "000" ]; then ok="$code"; break; fi
            sleep 1
          done
          docker logs probe
          test -n "$ok"
          docker logs probe 2>&1 | grep -qi "uvicorn running"
          docker rm -f probe

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          set -eux
          short="sha-$(git rev-parse --short HEAD)"
          docker tag "${IMAGE}:latest" "${IMAGE}:${short}"
          docker push "${IMAGE}:${short}"
          docker push "${IMAGE}:latest"
          docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${short}"
